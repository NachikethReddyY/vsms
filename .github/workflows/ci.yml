name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vsms_test
          POSTGRES_USER: vsms
          POSTGRES_PASSWORD: vsms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsms -d vsms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vsms:vsms-ci-password@127.0.0.1:5432/vsms_test
      NODE_ENV: test
      LOCAL_HTTPS: "false"
      JWT_ACCESS_SECRET: ci-only-access-secret-with-at-least-thirty-two-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        working-directory: backend

      - name: Apply test database migrations
        run: pnpm exec prisma migrate reset --force --skip-seed
        working-directory: backend

      - name: Run Node.js backend tests
        shell: bash
        run: |
          find tests -maxdepth 1 -name '*.test.js' \
            ! -name 'auth.integration.test.js' \
            ! -name 'events.integration.test.js' \
            ! -name 'locationService.test.js' \
            ! -name 'qr.integration.test.js' \
            ! -name 'reviewService.test.js' \
            ! -name 'reviews.integration.test.js' \
            ! -name 'sync.integration.test.js' \
            -print0 | xargs -0 node --test
        working-directory: backend

      - name: Run Vitest backend tests
        run: >-
          pnpm exec vitest run
          tests/auth.integration.test.js
          tests/events.integration.test.js
          tests/locationService.test.js
          tests/qr.integration.test.js
          tests/reviewService.test.js
          tests/reviews.integration.test.js
          tests/sync.integration.test.js
        working-directory: backend

      - name: Validate Prisma schema
        run: pnpm run prisma:validate
        working-directory: backend

      - name: Lint OpenAPI contract
        run: pnpm run openapi:lint
        working-directory: backend

      - name: Verify generated API client
        run: pnpm run contracts:check
        working-directory: backend

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: react-user-dashboard/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: react-user-dashboard

      - name: Lint frontend
        run: pnpm run lint
        working-directory: react-user-dashboard

      - name: Run frontend regression tests
        run: pnpm run test:participants && pnpm run test:queue
        working-directory: react-user-dashboard

      - name: Build frontend
        run: pnpm run build
        working-directory: react-user-dashboard
