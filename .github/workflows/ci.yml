name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vsms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vsms_test:vsms-ci-password@127.0.0.1:5432/vsms_test
      NODE_ENV: test
      LOCAL_HTTPS: "false"
      JWT_ACCESS_SECRET: ci-only-access-secret-with-at-least-thirty-two-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Create least-privilege test database
        run: |
          docker exec -i -e PGPASSWORD=vsms-ci-password ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vsms_test LOGIN PASSWORD 'vsms-ci-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE DATABASE vsms_test OWNER vsms_test;
          REVOKE ALL ON DATABASE vsms_test FROM PUBLIC;
          GRANT CONNECT, TEMPORARY ON DATABASE vsms_test TO vsms_test;
          SQL
          docker exec -e PGPASSWORD=vsms-ci-password ${{ job.services.postgres.id }} psql -U vsms_test -d vsms_test -v ON_ERROR_STOP=1 -c "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = current_user"

      - name: Prepare isolated test database
        run: pnpm run db:test:prepare
        working-directory: backend

      - name: Run backend unit and security tests
        run: pnpm run test
        working-directory: backend

      - name: Run backend integration tests
        if: always()
        run: pnpm run test:integration
        working-directory: backend

      - name: Validate Prisma schema
        if: always()
        run: pnpm run prisma:validate
        working-directory: backend

      - name: Lint OpenAPI contract
        if: always()
        run: pnpm run openapi:lint
        working-directory: backend

      - name: Verify generated API collection
        if: always()
        run: pnpm check:api-collection

      - name: Verify generated API client
        if: always()
        run: pnpm run contracts:check
        working-directory: backend

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: react-user-dashboard/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: react-user-dashboard

      - name: Lint frontend
        run: pnpm run lint
        working-directory: react-user-dashboard

      - name: Run frontend regression tests
        run: pnpm run test
        working-directory: react-user-dashboard

      - name: Build frontend
        run: pnpm run build
        working-directory: react-user-dashboard

  https-smoke:
    name: HTTPS local smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vsms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vsms_test:vsms-ci-password@127.0.0.1:5432/vsms_test
      NODE_ENV: development
      LOCAL_HTTPS: "true"
      HOST: 127.0.0.1
      PORT: 5050
      JWT_ACCESS_SECRET: ci-only-access-secret-with-at-least-thirty-two-characters
      VITE_API_PROXY_TARGET: https://127.0.0.1:5050
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            react-user-dashboard/pnpm-lock.yaml

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y mkcert libnss3-tools

      - name: Generate trusted local certificates
        run: |
          mkcert -install
          mkdir -p react-user-dashboard/certs
          mkcert -key-file react-user-dashboard/certs/localhost-key.pem -cert-file react-user-dashboard/certs/localhost.pem localhost 127.0.0.1

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: react-user-dashboard

      - name: Create least-privilege test database
        run: |
          docker exec -i -e PGPASSWORD=vsms-ci-password ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vsms_test LOGIN PASSWORD 'vsms-ci-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE DATABASE vsms_test OWNER vsms_test;
          REVOKE ALL ON DATABASE vsms_test FROM PUBLIC;
          GRANT CONNECT, TEMPORARY ON DATABASE vsms_test TO vsms_test;
          SQL
          docker exec -e PGPASSWORD=vsms-ci-password ${{ job.services.postgres.id }} psql -U vsms_test -d vsms_test -v ON_ERROR_STOP=1 -c "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = current_user"

      - name: Prepare isolated test database
        run: pnpm run db:test:prepare
        working-directory: backend

      - name: Start HTTPS API and frontend services
        run: |
          pnpm --dir backend start > /tmp/vsms-api.log 2>&1 &
          pnpm --dir react-user-dashboard dev --host 127.0.0.1 > /tmp/vsms-frontend.log 2>&1 &
          node -e "const net=require('net'); const ports=[5050,5173]; const deadline=Date.now()+60000; (function wait(){Promise.all(ports.map(port=>new Promise(resolve=>{const s=net.connect({host:'127.0.0.1',port}); s.on('connect',()=>{s.destroy(); resolve(true)}); s.on('error',()=>resolve(false));}))).then(ok=>ok.every(Boolean)?process.exit(0):Date.now()>deadline?process.exit(1):setTimeout(wait,500));})()"

      - name: Run real HTTPS smoke test
        run: pnpm check:https
