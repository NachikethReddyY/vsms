name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vsms_test
          POSTGRES_USER: vsms
          POSTGRES_PASSWORD: vsms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsms -d vsms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vsms:vsms-ci-password@127.0.0.1:5432/vsms_test
      NODE_ENV: test
      LOCAL_HTTPS: "false"
      JWT_ACCESS_SECRET: ci-only-access-secret-with-at-least-thirty-two-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        working-directory: backend

      - name: Apply test database migrations
        run: pnpm exec prisma migrate reset --force --skip-seed
        working-directory: backend

      - name: Run backend unit and security tests
        run: pnpm run test
        working-directory: backend

      - name: Run backend integration tests
        if: always()
        run: pnpm run test:integration
        working-directory: backend

      - name: Validate Prisma schema
        if: always()
        run: pnpm run prisma:validate
        working-directory: backend

      - name: Lint OpenAPI contract
        if: always()
        run: pnpm run openapi:lint
        working-directory: backend

      - name: Verify generated API collection
        if: always()
        run: pnpm check:api-collection

      - name: Verify generated API client
        if: always()
        run: pnpm run contracts:check
        working-directory: backend

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: react-user-dashboard/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: react-user-dashboard

      - name: Lint frontend
        run: pnpm run lint
        working-directory: react-user-dashboard

      - name: Run frontend regression tests
        run: pnpm run test
        working-directory: react-user-dashboard

      - name: Build frontend
        run: pnpm run build
        working-directory: react-user-dashboard

  https-smoke:
    name: HTTPS local smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vsms_test
          POSTGRES_USER: vsms
          POSTGRES_PASSWORD: vsms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsms -d vsms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vsms:vsms-ci-password@127.0.0.1:5432/vsms_test
      NODE_ENV: development
      LOCAL_HTTPS: "true"
      HOST: 127.0.0.1
      PORT: 5050
      JWT_ACCESS_SECRET: ci-only-access-secret-with-at-least-thirty-two-characters
      VITE_API_PROXY_TARGET: https://127.0.0.1:5050
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            react-user-dashboard/pnpm-lock.yaml

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y mkcert libnss3-tools

      - name: Generate trusted local certificates
        run: |
          mkcert -install
          mkdir -p react-user-dashboard/certs
          mkcert -key-file react-user-dashboard/certs/localhost-key.pem -cert-file react-user-dashboard/certs/localhost.pem localhost 127.0.0.1

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: react-user-dashboard

      - name: Apply test database migrations
        run: pnpm exec prisma migrate reset --force --skip-seed
        working-directory: backend

      - name: Start HTTPS API and frontend services
        run: |
          pnpm --dir backend start > /tmp/vsms-api.log 2>&1 &
          pnpm --dir react-user-dashboard dev --host 127.0.0.1 > /tmp/vsms-frontend.log 2>&1 &
          node -e "const net=require('net'); const ports=[5050,5173]; const deadline=Date.now()+60000; (function wait(){Promise.all(ports.map(port=>new Promise(resolve=>{const s=net.connect({host:'127.0.0.1',port}); s.on('connect',()=>{s.destroy(); resolve(true)}); s.on('error',()=>resolve(false));}))).then(ok=>ok.every(Boolean)?process.exit(0):Date.now()>deadline?process.exit(1):setTimeout(wait,500));})()"

      - name: Run real HTTPS smoke test
        run: pnpm check:https
