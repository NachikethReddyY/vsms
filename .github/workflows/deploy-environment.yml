name: Deploy release environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_uri:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: vsms-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_URI: ${{ inputs.image_uri }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Record release start
        run: echo "RELEASE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Validate immutable release input
        env:
          NODE_ENV: production
          RELEASE_IMAGE_URI: ${{ inputs.image_uri }}
        run: node backend/scripts/deploy/preflight.js
      - name: Assume environment deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Capture previous release and stack outputs
        run: |
          PREVIOUS_IMAGE=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Parameters[?ParameterKey=='ApiImageUri'].ParameterValue" --output text)
          PREVIOUS_SHA=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Parameters[?ParameterKey=='ReleaseSha'].ParameterValue" --output text)
          echo "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" >> "$GITHUB_ENV"
          echo "PREVIOUS_SHA=$PREVIOUS_SHA" >> "$GITHUB_ENV"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output json > stack-outputs.json
      - name: Register candidate migration task without shifting traffic
        run: |
          aws cloudformation deploy --stack-name "$STACK_NAME" --template-file infrastructure/availability.yaml --no-fail-on-empty-changeset --capabilities CAPABILITY_IAM --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" --parameter-overrides ApiImageUri="$PREVIOUS_IMAGE" CandidateApiImageUri="$IMAGE_URI" ReleaseSha="$PREVIOUS_SHA" CandidateReleaseSha="$RELEASE_SHA"
      - name: Assume migration launcher role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_MIGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run one-off expand-and-contract migration
        run: |
          CLUSTER=$(node scripts/deploy/read-stack-output.cjs stack-outputs.json ApiClusterName)
          TASK_DEFINITION=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='MigrationTaskDefinitionArn'].OutputValue" --output text)
          SUBNETS=$(node scripts/deploy/read-stack-output.cjs stack-outputs.json PrivateSubnetIds)
          SECURITY_GROUP=$(node scripts/deploy/read-stack-output.cjs stack-outputs.json ApiSecurityGroupId)
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEFINITION" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = "0"
      - name: Promote digest to API and workers
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: |
          aws cloudformation deploy --stack-name "$STACK_NAME" --template-file infrastructure/availability.yaml --no-fail-on-empty-changeset --capabilities CAPABILITY_IAM --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" --parameter-overrides ApiImageUri="$IMAGE_URI" CandidateApiImageUri="$IMAGE_URI" ReleaseSha="$RELEASE_SHA" CandidateReleaseSha="$RELEASE_SHA"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output json > stack-outputs.json
      - name: Wait for API and all enabled workers
        run: |
          CLUSTER=$(node scripts/deploy/read-stack-output.cjs stack-outputs.json ApiClusterName)
          node scripts/deploy/list-stack-services.cjs stack-outputs.json | while read -r SERVICE; do
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          done
      - name: Smoke-test readiness and a safe authenticated API route
        env:
          SMOKE_BASE_URL: ${{ vars.API_URL }}
          SMOKE_AUTH_PATH: ${{ vars.SMOKE_AUTH_PATH }}
          SMOKE_BEARER_TOKEN: ${{ secrets.SMOKE_BEARER_TOKEN }}
        run: pnpm --dir backend deploy:smoke
      - name: Build frontend for the promoted API
        env:
          VITE_API_BASE_URL: ${{ vars.API_URL }}/api/v1
        run: |
          pnpm --dir react-user-dashboard install --frozen-lockfile
          pnpm --dir react-user-dashboard build
      - name: Publish immutable assets before runtime entry point
        run: |
          BUCKET=$(node scripts/deploy/read-stack-output.cjs stack-outputs.json FrontendBucketName)
          DISTRIBUTION=$(node scripts/deploy/read-stack-output.cjs stack-outputs.json FrontendDistributionId)
          aws s3 sync react-user-dashboard/dist "s3://$BUCKET" --delete --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp react-user-dashboard/dist/index.html "s3://$BUCKET/index.html" --cache-control 'no-store' --content-type 'text/html; charset=utf-8'
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/index.html' '/service-worker.js' '/manifest.webmanifest'
      - name: Assume read-only verification role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_VERIFY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify alarms and write release evidence
        run: |
          ALARM_COUNT=$(aws cloudwatch describe-alarms --alarm-name-prefix "$DEPLOY_ENVIRONMENT-vsms" --state-value ALARM --query 'length(MetricAlarms)' --output text)
          test "$ALARM_COUNT" = "0"
          node scripts/deploy/write-release-manifest.cjs stack-outputs.json release-manifest.json
          pnpm --dir backend deploy:verify -- ../release-manifest.json
      - name: Upload release audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ inputs.environment }}-${{ inputs.release_sha }}
          path: |
            release-manifest.json
            stack-outputs.json
          if-no-files-found: warn
          retention-days: 90
      - name: Re-assume deployment role for rollback
        if: failure() && env.PREVIOUS_IMAGE != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll back application image after a failed post-migration gate
        if: failure() && env.PREVIOUS_IMAGE != ''
        run: |
          aws cloudformation deploy --stack-name "$STACK_NAME" --template-file infrastructure/availability.yaml --no-fail-on-empty-changeset --capabilities CAPABILITY_IAM --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" --parameter-overrides ApiImageUri="$PREVIOUS_IMAGE" CandidateApiImageUri="$IMAGE_URI" ReleaseSha="$PREVIOUS_SHA" CandidateReleaseSha="$RELEASE_SHA"
