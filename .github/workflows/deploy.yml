name: Enterprise release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsms-production-release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir react-user-dashboard install --frozen-lockfile
      - name: Start isolated PostgreSQL and prepare integration schema
        env:
          VSMS_TEST_DB_PASSWORD: ci-only-not-a-secret
          DATABASE_URL: postgresql://vsms_test:ci-only-not-a-secret@127.0.0.1:5433/vsms_test
          VSMS_TEST_DATABASE_RESET_ACKNOWLEDGEMENT: I_UNDERSTAND_THIS_RESETS_A_TEST_DATABASE
        run: |
          docker compose --file backend/docker-compose.test.yml down --volumes --remove-orphans
          docker compose --file backend/docker-compose.test.yml up --detach --wait
          pnpm --dir backend db:test:prepare
      - name: Run contracts, tests, lint, and builds
        env:
          DATABASE_URL: postgresql://vsms_test:ci-only-not-a-secret@127.0.0.1:5433/vsms_test
        run: pnpm check && pnpm test && pnpm --dir backend test:integration && pnpm test:availability && pnpm --dir react-user-dashboard test
      - name: Stop isolated PostgreSQL
        if: always()
        env:
          VSMS_TEST_DB_PASSWORD: ci-only-not-a-secret
        run: docker compose --file backend/docker-compose.test.yml down --volumes
      - name: Enforce backward-compatible migrations
        env:
          MIGRATION_BASE_SHA: ${{ github.event.before }}
        run: node backend/scripts/deploy/check-migrations.js "$MIGRATION_BASE_SHA"

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - id: image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "uri=${REGISTRY}/${REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Wait for ECR enhanced scan and fail on critical findings
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          aws ecr wait image-scan-complete --repository-name "$REPOSITORY" --image-id imageDigest="$DIGEST"
          CRITICAL=$(aws ecr describe-image-scan-findings --repository-name "$REPOSITORY" --image-id imageDigest="$DIGEST" --query "imageScanFindings.findingSeverityCounts.CRITICAL || \`0\`" --output text)
          test "$CRITICAL" = "0"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  staging:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image_uri: ${{ needs.build.outputs.image_uri }}
      release_sha: ${{ github.sha }}
    secrets: inherit

  production:
    needs: [build, staging]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      image_uri: ${{ needs.build.outputs.image_uri }}
      release_sha: ${{ github.sha }}
    secrets: inherit
