name: OWASP A06 Dependency Security Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  integration-test:
    name: Backend migration and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vsms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vsms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Run migrations and integration suite
        run: pnpm test:integration
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vsms_test
          NODE_ENV: test
          LOCAL_HTTPS: "false"
          JWT_ACCESS_SECRET: test-only-access-secret-with-at-least-thirty-two-characters
          CORS_ORIGINS: https://localhost:5173
          PUBLIC_APP_ORIGIN: https://localhost:5173

  pnpm-audit:
    name: Fast pnpm Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Run pnpm Audit
        run: pnpm audit --prod --audit-level=high
        working-directory: backend

  owasp-dep-check:
    name: Deep OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: pnpm-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Cryptix Backend API"
          path: "backend"
          format: "HTML"
          args: "--failOnCVSS 7 --nodePackageSkipDevDependencies --nodeAuditSkipDevDependencies --suppression backend/suppression.xml"

      - name: Upload Security Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: "reports"
