name: OWASP A06 Dependency Security Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  pnpm-audit:
    name: Fast pnpm Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, react-user-dashboard]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level high
        working-directory: ${{ matrix.project }}

  owasp-dep-check:
    name: Deep OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: pnpm-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Cryptix Backend API"
          path: "backend"
          format: "HTML"
          args: "--failOnCVSS 7 --nodePackageSkipDevDependencies --nodeAuditSkipDevDependencies --suppression backend/suppression.xml"

      - name: Upload Security Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: "reports"
