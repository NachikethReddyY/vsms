name: Performance and Recovery Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: 500 participants and restore proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vsms-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vsms_perf:vsms-ci-password@127.0.0.1:5432/vsms_perf_test
      RESTORE_DATABASE_URL: postgresql://vsms_perf:vsms-ci-password@127.0.0.1:5432/vsms_restore_test
      NODE_ENV: test
      LOCAL_HTTPS: "false"
      HOST: 127.0.0.1
      PORT: 5050
      JWT_ACCESS_SECRET: ci-only-performance-secret-at-least-thirty-two-characters
      COGNITO_STAFF_SYNC_MODE: local-only
      PERF_FIXTURE_FILE: /tmp/vsms-performance-fixture.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Create isolated source and restore databases
        run: |
          docker exec -i -e PGPASSWORD=vsms-ci-password ${{ job.services.postgres.id }} psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE vsms_perf LOGIN PASSWORD 'vsms-ci-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE DATABASE vsms_perf_test OWNER vsms_perf;
          CREATE DATABASE vsms_restore_test OWNER vsms_perf;
          REVOKE ALL ON DATABASE vsms_perf_test FROM PUBLIC;
          REVOKE ALL ON DATABASE vsms_restore_test FROM PUBLIC;
          SQL

      - name: Migrate and prepare 500-participant fixture
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate
          PERF_FIXTURE_CONFIRM=CREATE_SYNTHETIC_TEST_DATA pnpm perf:prepare
        working-directory: backend

      - name: Start API
        run: |
          pnpm --dir backend start > /tmp/vsms-api.log 2>&1 &
          echo "$!" > /tmp/vsms-api.pid
          node -e "const deadline=Date.now()+60000;(async function wait(){try{if((await fetch('http://127.0.0.1:5050/health')).ok)return}catch{}if(Date.now()>deadline)process.exit(1);setTimeout(wait,500)})()"

      - name: Mint synthetic test token
        run: echo "PERF_AUTHORIZATION=Bearer $(pnpm perf:token)" >> "$GITHUB_ENV"
        working-directory: backend

      - name: Measure 500-participant workload
        env:
          VSMS_LOAD_TEST_ACKNOWLEDGEMENT: SYNTHETIC_LOAD_TEST
          PERF_RESULTS_FILE: /tmp/vsms-performance-results.json
        run: |
          api_pid=$(cat /tmp/vsms-api.pid)
          (
            while kill -0 "$api_pid" 2>/dev/null; do
              date -u +%Y-%m-%dT%H:%M:%SZ
              ps -o pid=,%cpu=,rss=,etime=,command= -p "$api_pid"
              psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT datname,numbackends,xact_commit,xact_rollback,blks_read,blks_hit FROM pg_stat_database WHERE datname=current_database()"
              psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT state,count(*) FROM pg_stat_activity WHERE datname=current_database() GROUP BY state ORDER BY state"
              docker stats --no-stream --format 'postgres cpu={{.CPUPerc}} memory={{.MemUsage}}' ${{ job.services.postgres.id }}
              sleep 2
            done
          ) > /tmp/vsms-observations.txt 2>&1 &
          sampler_pid=$!
          set +e
          pnpm perf:run
          load_exit=$?
          set -e
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          echo "$load_exit" > /tmp/vsms-load-exit-code
        working-directory: backend

      - name: Back up and restore the measured database
        env:
          VSMS_BACKUP_DIR: /tmp/vsms-backups
          RESTORE_CONFIRM: RESTORE_ISOLATED_TEST_DATABASE
        run: |
          mkdir -p /tmp/vsms-evidence
          pnpm backup:postgres | tee /tmp/vsms-evidence/backup.txt
          backup_file=$(find /tmp/vsms-backups -type f -name '*.dump' -print -quit)
          pnpm restore:postgres:test "$backup_file" | tee /tmp/vsms-evidence/restore.txt
          cp /tmp/vsms-performance-results.json /tmp/vsms-observations.txt /tmp/vsms-api.log /tmp/vsms-evidence/
          cp /tmp/vsms-backups/* /tmp/vsms-evidence/
        working-directory: backend

      - name: Upload private evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsms-performance-recovery-${{ github.run_id }}
          path: /tmp/vsms-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce measured thresholds
        if: always()
        run: test "$(cat /tmp/vsms-load-exit-code)" = 0
