info:
  name: VSMS API (OpenAPI sync)
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
  description: >-
    Generated from backend/docs/openapi.yaml. Cognito owns refresh-token issuance and rotation; /auth/refresh exchanges
    the HttpOnly Cognito refresh cookie and CSRF header for replacement auth/CSRF cookies, while its JSON response
    contains user, expiresIn, and sessionExpiresIn only.
item:
