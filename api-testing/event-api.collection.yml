  - name: Refresh Cognito-backed browser session
    description: >-
      Exchanges the HttpOnly Cognito refresh cookie and CSRF header for replacement auth/CSRF cookies. The JSON body
      contains user, expiresIn, and sessionExpiresIn only. It does not expose access tokens, refresh tokens, or CSRF
      values to JavaScript.
    event:
      - listen: test
        script:
          type: text/javascript
          exec:
            - pm.test("refresh exchanges the Cognito refresh cookie without exposing browser tokens", function () {
            - '  pm.response.to.have.status(200);'
            - '  const body = pm.response.json();'
            - '  pm.expect(body.user).to.be.an("object");'
            - '  pm.expect(body.sessionExpiresIn).to.be.a("number");'
            - '  pm.expect(body).to.not.have.property("accessToken");'
            - '  pm.expect(body).to.not.have.property("csrfToken");'
            - '  pm.expect(body).to.not.have.property("refreshToken");'
            - '});'
    request:
      method: POST
      header:
        - key: Cookie
          value: vsms_refresh={{refreshCookie}}; vsms_username={{username}}; vsms_csrf={{csrfToken}}
          description: Required secure browser session cookies
          type: text
        - key: X-CSRF-Token
          value: '{{csrfToken}}'
          description: Must equal the `vsms_csrf` cookie; requests also require an allowed Origin
          type: text
      auth:
        type: noauth
      url:
        raw: '{{baseUrl}}/auth/refresh'
        host:
          - '{{baseUrl}}'
        path:
          - auth
          - refresh
        query: []
    response:
      - name: 200 Response
        originalRequest:
          method: POST
          header:
            - key: Cookie
              value: vsms_refresh={{refreshCookie}}; vsms_username={{username}}; vsms_csrf={{csrfToken}}
              description: Required secure browser session cookies
              type: text
            - key: X-CSRF-Token
              value: '{{csrfToken}}'
              description: Must equal the `vsms_csrf` cookie; requests also require an allowed Origin
              type: text
          url: '{{baseUrl}}/auth/refresh'
        status: OK
        code: 200
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "expiresIn": 0,
            "sessionExpiresIn": 0,
            "returnTo": "",
            "user": {
              "id": "00000000-0000-4000-8000-000000000000",
              "userId": "00000000-0000-4000-8000-000000000000",
              "username": "",
              "email": "",
              "fullName": "",
              "employeeNumber": "",
              "contactNumber": "",
              "department": "",
              "designation": "",
              "systemRole": "ADMIN",
              "status": "ACTIVE",
              "approvalState": "PENDING",
              "accessState": "ENABLED",
              "professionalCategory": "STAFF",
              "roles": [
                "ADMINISTRATOR"
              ],
              "createdAt": "2026-08-07T00:00:00.000Z"
            }
          }
      - name: 401 Response
        originalRequest:
          method: POST
          header:
            - key: Cookie
              value: vsms_refresh={{refreshCookie}}; vsms_username={{username}}; vsms_csrf={{csrfToken}}
              description: Required secure browser session cookies
              type: text
            - key: X-CSRF-Token
              value: '{{csrfToken}}'
              description: Must equal the `vsms_csrf` cookie; requests also require an allowed Origin
              type: text
          url: '{{baseUrl}}/auth/refresh'
        status: Unauthorized
        code: 401
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "code": "",
            "requestId": "00000000-0000-4000-8000-000000000000",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ]
          }
      - name: 403 Response
        originalRequest:
