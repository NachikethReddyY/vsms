  - name: Clear the local browser session and finish the hosted Cognito logout
    description: >-
      Clears local browser auth and CSRF cookies. The CSRF header is optional so an expired access cookie can still be
      cleared.
    event: []
    request:
      method: POST
      header:
        - key: Cookie
          value: vsms_csrf={{csrfToken}}
          description: Required secure browser session cookies
          type: text
        - key: X-CSRF-Token
          value: '{{csrfToken}}'
          description: >-
            Required when credential or CSRF cookies are present; must equal the `vsms_csrf` cookie and include an
            allowed Origin
          type: text
      auth:
        type: noauth
      url:
        raw: '{{baseUrl}}/auth/logout'
        host:
          - '{{baseUrl}}'
        path:
          - auth
          - logout
        query: []
    response:
      - name: 200 Response
        originalRequest:
          method: POST
          header:
            - key: Cookie
              value: vsms_csrf={{csrfToken}}
              description: Required secure browser session cookies
              type: text
            - key: X-CSRF-Token
              value: '{{csrfToken}}'
              description: >-
                Required when credential or CSRF cookies are present; must equal the `vsms_csrf` cookie and include an
                allowed Origin
              type: text
          url: '{{baseUrl}}/auth/logout'
        status: OK
        code: 200
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "message": "",
            "logoutUrl": ""
