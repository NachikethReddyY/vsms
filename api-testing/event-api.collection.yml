    description: ''
    event: []
    request:
      method: GET
      header: []
      auth:
        type: noauth
      url:
        raw: '{{baseUrl}}/health'
        host:
          - '{{baseUrl}}'
        path:
          - health
        query: []
    response:
      - name: 200 Response
        originalRequest:
          method: GET
          header: []
          url: '{{baseUrl}}/health'
        status: OK
        code: 200
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "status": "ok"
          }
      - name: 404 Response
        originalRequest:
          method: GET
          header: []
          url: '{{baseUrl}}/health'
        status: Not Found
        code: 404
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "code": "",
            "requestId": "00000000-0000-4000-8000-000000000000",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ]
          }
      - name: 500 Response
        originalRequest:
          method: GET
          header: []
          url: '{{baseUrl}}/health'
        status: Internal Server Error
        code: 500
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "code": "",
            "requestId": "00000000-0000-4000-8000-000000000000",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ]
          }
  - name: Accept a signature-verified Amazon SNS envelope for SES delivery lifecycle events
    description: >-
      The signed TopicArn must be explicitly allowlisted. Recipient addresses, message bodies, and provider diagnostic
      text are not retained in provider-event receipts or audits.
    event: []
    request:
      method: POST
      header:
        - key: Content-Type
          value: application/json
          description: JSON request body
          type: text
        - key: x-amz-sns-message-type
          value: ''
          description: ''
          type: text
      auth:
        type: noauth
      url:
        raw: '{{baseUrl}}/webhooks/ses'
        host:
          - '{{baseUrl}}'
        path:
          - webhooks
          - ses
        query: []
      body:
        mode: raw
        raw: '{}'
        options:
          raw:
            language: json
    response:
      - name: 202 Response
        originalRequest:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              description: JSON request body
              type: text
            - key: x-amz-sns-message-type
              value: ''
              description: ''
              type: text
          url: '{{baseUrl}}/webhooks/ses'
        status: Accepted
        code: 202
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "accepted": true,
            "duplicate": true,
            "matched": true,
            "appliedStatus": "DELIVERED",
            "subscriptionConfirmed": true
          }
      - name: 400 Response
        originalRequest:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              description: JSON request body
              type: text
            - key: x-amz-sns-message-type
              value: ''
              description: ''
              type: text
          url: '{{baseUrl}}/webhooks/ses'
        status: Bad Request
        code: 400
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "code": "",
            "requestId": "00000000-0000-4000-8000-000000000000",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ]
          }
      - name: 403 Response
        originalRequest:
          method: POST
          header:
            - key: Content-Type
              value: application/json
              description: JSON request body
              type: text
            - key: x-amz-sns-message-type
              value: ''
              description: ''
              type: text
          url: '{{baseUrl}}/webhooks/ses'
        status: Forbidden
        code: 403
        header:
          - key: Content-Type
            value: application/json
        body: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "code": "",
            "requestId": "00000000-0000-4000-8000-000000000000",
            "errors": [
              {
                "field": "",
                "message": ""
              }
