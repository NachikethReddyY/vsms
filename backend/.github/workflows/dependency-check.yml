name: OWASP A06 Dependency Security Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  npm-audit:
    name: Fast NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run NPM Audit
        run: npm audit --audit-level=high

  owasp-dep-check:
    name: Deep OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: npm-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Cryptix Backend API"
          path: "."
          format: "HTML"
          args: "--failOnCVSS 7 --suppression suppression.xml"

      - name: Upload Security Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: "reports"
