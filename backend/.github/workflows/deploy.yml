# Inside your GitHub Actions workflow (.github/workflows/deploy.yml)
- name: Build Application
  run: npm run build

- name: Sign Build Artifact
  env:
    PRIVATE_KEY: ${{ secrets.CODE_SIGNING_PRIVATE_KEY }}
  run: |
    echo "$PRIVATE_KEY" > private.key
    openssl dgst -sha256 -sign private.key -out dist/server.js.sig dist/server.js
    rm private.key
