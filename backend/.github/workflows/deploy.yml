name: Build, Sign, and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Sign Build Artifact
        env:
          PRIVATE_KEY: ${{ secrets.CODE_SIGNING_PRIVATE_KEY }}
        run: |
          # Write secret to a temporary file
          echo "$PRIVATE_KEY" > private.key

          # Generate SHA-256 signature for the built server bundle
          openssl dgst -sha256 -sign private.key -out dist/server.js.sig dist/server.js

          # Clean up private key immediately
          rm private.key

      - name: Upload Artifacts (or Deploy)
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            public.pem
