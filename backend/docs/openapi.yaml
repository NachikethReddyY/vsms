openapi: 3.0.3
info:
  title: VSMS Event Operations API
  version: 2.5.0
  description: Secure staff authentication, event operations, and clinical review workflows for VSMS.
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
servers:
  - url: /
    description: Same-origin API server; local development proxies to https://127.0.0.1:5050
tags:
  - name: System
    description: Service readiness
  - name: Authentication
    description: Amazon Cognito managed login with a secure cookie session
  - name: Events
    description: Authorized event details and lifecycle commands
  - name: Users
    description: Restricted administrative user projection
  - name: Participants
    description: Participant onboarding, lookup, consent, and emergency contacts
  - name: Registrations
    description: Event registration and status history
  - name: Screening
    description: Event station queues and screening result capture
  - name: QR Codes
    description: Registration pass generation, verification, and check-in
  - name: Administration
    description: Restricted operational audit data
  - name: Clinical Reviews
    description: Event-scoped clinical review queue and immutable decisions
  - name: Referrals
    description: Signed, encrypted clinical referral documents and delivery tracking
  - name: Provider Events
    description: Signature-authenticated delivery lifecycle callbacks from configured providers
  - name: Queue
    description: Virtual queue lifecycle and station transfers for in-progress events
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      security: []
      operationId: getHealth
      summary: Check API readiness
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        "500":
          description: Service is not ready
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404":
          description: Health endpoint is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /api/v1/webhooks/ses:
    post:
      tags: [Provider Events]
      security: []
      operationId: ingestSesProviderEvent
      summary: Accept a signature-verified Amazon SNS envelope for SES delivery lifecycle events
      description: The signed TopicArn must be explicitly allowlisted. Recipient addresses, message bodies, and provider diagnostic text are not retained in provider-event receipts or audits.
      parameters:
        - name: x-amz-sns-message-type
          in: header
          required: false
          schema: { type: string, enum: [Notification, SubscriptionConfirmation, UnsubscribeConfirmation] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          text/plain:
            schema: { type: string }
      responses:
        "202":
          description: Authenticated provider event accepted or safely replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderEventAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/config-status:
    get:
      tags: [Authentication]
      security: []
      operationId: getAuthenticationConfigStatus
      summary: Check whether Cognito managed login is configured
      responses:
        "200":
          description: Authentication configuration status
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthConfigStatus" } } }
  /api/v1/auth/authorize:
    get:
      tags: [Authentication]
      security: []
      operationId: authorizeWithCognito
      summary: Redirect the browser to Cognito managed login
      parameters:
        - in: query
          name: returnTo
          schema: { type: string, default: /dashboard }
      responses:
        "302": { description: Redirect to the Cognito authorization endpoint }
        "503": { description: Cognito managed login is not configured }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/callback:
    get:
      tags: [Authentication]
      security: []
      operationId: completeCognitoAuthorization
      summary: Exchange the Cognito authorization code for a cookie session
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cognito authorization completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { description: Invalid or expired OAuth state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: refreshSession
      summary: Exchange the Cognito-backed refresh cookie for a renewed browser session
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Cognito refresh cookie exchanged and session cookies refreshed, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      security: []
      operationId: logout
      summary: Clear the local browser session and finish the hosted Cognito logout
      parameters: [{ $ref: "#/components/parameters/ConditionalCsrfToken" }]
      responses:
        "200":
          description: Browser session cleared
          content: { application/json: { schema: { $ref: "#/components/schemas/LogoutResponse" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Cognito managed login is not configured }
  /api/v1/auth/global-logout:
    post:
      tags: [Authentication]
      security: [{ accessCookie: [] }]
      operationId: globalLogout
      summary: Revoke Cognito sessions everywhere and clear local browser cookies
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Cognito sessions revoked and browser session cleared
          content: { application/json: { schema: { $ref: "#/components/schemas/LogoutResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: Cognito global sign-out could not be completed }
        "503": { description: Cognito managed login is not configured }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the authenticated staff identity
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated Cognito user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Cognito managed login is not configured }
  /api/v1/account:
    get:
      tags: [Users]
      operationId: getCurrentAccount
      summary: Get the current account profile, lifecycle state, and event memberships
      description: Available to pending, rejected, approved, and suspended sessions. Disabled or deprovisioned accounts cannot authenticate.
      responses:
        "200": { description: Current account, content: { application/json: { schema: { $ref: "#/components/schemas/AccountEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      operationId: updateCurrentAccount
      summary: Update non-authoritative current-account profile fields
      parameters: [{ $ref: "#/components/parameters/ConditionalCsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountProfileUpdateRequest" } } }
      responses:
        "200": { description: Updated account, content: { application/json: { schema: { $ref: "#/components/schemas/AccountEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List organisation staff accounts (administrator only)
      responses:
        "200":
          description: Staff accounts without credential material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a staff account and synchronize Cognito access (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Staff user created and identity-provider synchronization completed
          content: { application/json: { schema: { $ref: "#/components/schemas/UserMutationResponse" } } }
        "202":
          description: Staff user created; identity-provider synchronization remains queued or owned by another worker
          content: { application/json: { schema: { $ref: "#/components/schemas/UserMutationResponse" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { description: Local account committed; identity-provider operation escalated for administrator attention }
        "503": { description: Cognito staff synchronization is not configured }
  /api/v1/users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update authoritative staff profile fields or legacy roles (administrator only)
      description: Lifecycle status is intentionally excluded. Use account approval, suspend, reactivate, or deprovision actions for state changes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Staff user updated and identity-provider synchronization completed, or no provider work was required
          content: { application/json: { schema: { $ref: "#/components/schemas/UserMutationResponse" } } }
        "202":
          description: Staff user updated; identity-provider synchronization remains queued or owned by another worker
          content: { application/json: { schema: { $ref: "#/components/schemas/UserMutationResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { description: Local role changes committed; identity-provider operation escalated for administrator attention }
        "503": { description: Cognito staff synchronization is not configured }
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events visible to the current staff member
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EventLimit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventStatus" }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200":
          description: Authorized, cursor-paginated events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a draft event with optional planned shifts
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable retry key for this create attempt
          schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/active:
    get:
      tags: [Events]
      operationId: listActiveEvents
      summary: List published or in-progress events
      responses:
        "200":
          description: Active events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/events/staff-directory:
    get:
      tags: [Events]
      operationId: listEventStaffDirectory
      summary: List active users available for event staffing
      responses:
        "200":
          description: Active staff directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffDirectoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/events/station-templates:
    get:
      tags: [Events]
      operationId: listStationTemplates
      summary: List active reusable station templates
      responses:
        "200":
          description: Active station templates available for import
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StationTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/events/reports/operations:
    get:
      tags: [Events]
      operationId: getOperationalReport
      summary: Report aggregate event operations for active event-manager memberships
      description: Requires an active EVENT_MANAGER membership. Reports include only events covered by that membership; platform administrator status and event creation do not grant implicit access. The response intentionally excludes participant identity, clinical detail, delivery recipients, and synchronization payloads or error logs. Viewing a report is audited.
      parameters:
        - name: eventId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Inclusive event-date range start; defaults to 30 days before today
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive event-date range end; defaults to 30 days after today. The range cannot exceed 366 days.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Aggregate-only operational report
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/locations/search:
    get:
      tags: [Events]
      operationId: searchSingaporeLocations
      summary: Search Singapore addresses with OneMap
      description: Uses a server-cached OneMap token that is renewed automatically; requests are rate limited below OneMap's 300 calls/minute quota.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 120 }
      responses:
        "200":
          description: Normalized Singapore locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationSearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: OneMap is unavailable or not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/public/events/{eventId}:
    get:
      tags: [Events]
      security: []
      operationId: getPublicEvent
      summary: Get public details for a non-draft event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200":
          description: Public event detail
          headers:
            Cache-Control: { schema: { type: string, enum: ["public, max-age=60"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PublicEvent" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/metrics:
    get:
      tags: [Events]
      operationId: getEventMetrics
      summary: Get event operations metrics
      description: Requires an active EVENT_MANAGER membership for this event. Platform administrator status and event creation do not grant implicit access.
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200": { description: Event metrics, content: { application/json: { schema: { $ref: "#/components/schemas/EventMetrics" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/analytics:
    get:
      tags: [Events]
      operationId: getCompletedEventAnalytics
      summary: Get aggregate analytics for a completed event
      description: Requires current active EVENT_MANAGER membership. Uses the canonical attendance definition, UTC half-open timestamp bounds, PostgreSQL continuous percentiles, and small-cell suppression for clinical groups. Participant identities and clinical record bodies are never returned.
      parameters:
        - $ref: "#/components/parameters/EventId"
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Table-friendly aggregate analytics, content: { application/json: { schema: { $ref: "#/components/schemas/EventAnalytics" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/report-exports:
    get:
      tags: [Events]
      operationId: listReportExportJobs
      summary: List report export jobs with completed-event and current membership rechecked
      parameters:
        - $ref: "#/components/parameters/EventId"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReportExportJobStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Aggregate report export jobs, content: { application/json: { schema: { $ref: "#/components/schemas/ReportExportJobList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Events]
      operationId: createReportExportJob
      summary: Queue an aggregate PDF or CSV report export
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateReportExportRequest" } } }
      responses:
        "202": { description: Export queued for durable worker processing, content: { application/json: { schema: { $ref: "#/components/schemas/ReportExportJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/events/{eventId}/report-exports/{jobId}:
    get:
      tags: [Events]
      operationId: getReportExportJob
      summary: Get report export job and artifact metadata with completed-event and current membership rechecked
      parameters:
        - $ref: "#/components/parameters/EventId"
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Report export job, content: { application/json: { schema: { $ref: "#/components/schemas/ReportExportJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events/{eventId}/report-exports/{jobId}/download:
    get:
      tags: [Events]
      operationId: downloadReportExportArtifact
      summary: Download a verified, unexpired report artifact
      description: Event completion and current EVENT_MANAGER membership are rechecked, then the opened-descriptor SHA-256 is verified before every audited download.
      parameters:
        - $ref: "#/components/parameters/EventId"
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: PDF or CSV aggregate artifact
          headers:
            Digest: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { description: Artifact expired or unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/events/{eventId}/attendees:
    get:
      tags: [Events]
      operationId: listEventAttendees
      summary: List event attendees for an authorized manager
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [SIGNED_UP, CHECKED_IN, COMPLETED, CANCELLED] }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200": { description: Attendee page, content: { application/json: { schema: { $ref: "#/components/schemas/EventAttendeeList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/export:
    get:
      tags: [Events]
      operationId: exportEvent
      summary: Export an authorized event operations snapshot
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200": { description: Event export snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/EventExportResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an authorized event detail
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update allowed fields using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventRequest" }
