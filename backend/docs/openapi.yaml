openapi: 3.0.3
info:
  title: VSMS Event Operations API
  version: 2.2.0
  description: Secure staff authentication, event operations, and clinical review workflows for VSMS.
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
servers:
  - url: /
    description: Same-origin API server; local development uses https://localhost:5050
tags:
  - name: System
    description: Service readiness
  - name: Authentication
    description: Simple username/password login with a secure rotating cookie session
  - name: Events
    description: Authorized event details and lifecycle commands
  - name: Users
    description: Restricted administrative user projection
  - name: Clinical Reviews
    description: Event-scoped clinical review queue and immutable decisions
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      security: []
      operationId: getHealth
      summary: Check API readiness
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        "500":
          description: Service is not ready
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404":
          description: Health endpoint is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /api/auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      summary: Authenticate a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login succeeded; refresh and CSRF cookies are also set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Secure HttpOnly refresh cookie and readable CSRF cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/signup:
    post:
      tags: [Authentication]
      security: []
      operationId: signup
      summary: Create a staff account when public registration is enabled
      description: Disabled by default. An administrator must explicitly set PUBLIC_SIGNUP_ENABLED=true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/refresh:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: refreshSession
      summary: Rotate a one-time refresh session
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Session rotated, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/logout:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: logout
      summary: Revoke the refresh family and clear cookies
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Session revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List projected user records (ADMIN only)
      responses:
        "200":
          description: Up to 100 users without credential material
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events visible to the current staff member
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EventLimit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventStatus" }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200":
          description: Authorized, cursor-paginated events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a draft event with optional planned shifts
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable retry key for this create attempt
          schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/staff-directory:
    get:
      tags: [Events]
      operationId: listEventStaffDirectory
      summary: List active users available for event staffing
      responses:
        "200":
          description: Active staff directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffDirectoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events/station-templates:
    get:
      tags: [Events]
      operationId: listStationTemplates
      summary: List active reusable station templates
      responses:
        "200":
          description: Active station templates available for import
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StationTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/locations/search:
    get:
      tags: [Events]
      operationId: searchSingaporeLocations
      summary: Search Singapore addresses with OneMap
      description: Uses a server-cached OneMap token that is renewed automatically; requests are rate limited below OneMap's 300 calls/minute quota.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 120 }
      responses:
        "200":
          description: Normalized Singapore locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationSearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: OneMap is unavailable or not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an authorized event detail
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update allowed fields using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventRequest" }
      responses:
        "200":
          description: Event updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/shifts/{shiftId}/assignments:
    post:
      tags: [Events]
      operationId: assignEventStaff
      summary: Assign an active user to an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffAssignmentRequest" }
      responses:
        "201":
          description: Assignment saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/shifts/{shiftId}/assignments/{assignmentId}:
    delete:
      tags: [Events]
      operationId: removeEventStaffAssignment
      summary: Remove a user from an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Assignment removed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/stations/import:
    post:
      tags: [Events]
      operationId: importEventStations
      summary: Import active screening templates as event Station rows (VA / refraction / colour vision / eye health). REGISTRATION and CLINICAL_REVIEW are rejected.
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationImportRequest" }
      responses:
        "201":
          description: Stations imported and audited
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/stations/{eventStationId}:
    patch:
      tags: [Events]
      operationId: updateEventStation
      summary: Configure an imported station's order, capacity, or availability
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: eventStationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventStationUpdateRequest" }
      responses:
        "200":
          description: Event station updated and audited
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/publish:
    post:
      tags: [Events]
      operationId: publishEvent
      summary: Move a draft event to published
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/start:
    post:
      tags: [Events]
      operationId: startEvent
      summary: Start a published event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/complete:
    post:
      tags: [Events]
      operationId: completeEvent
      summary: Complete an in-progress event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/cancel:
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Cancel a non-terminal event with a reason
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelEventRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/reviews:
    get:
      tags: [Clinical Reviews]
      operationId: listClinicalReviews
      summary: List registrations currently actionable by an assigned reviewer
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200":
          description: Event summary and severity-ordered actionable queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueueResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/events/{eventId}/reviews/{registrationId}:
    get:
      tags: [Clinical Reviews]
      operationId: getClinicalReview
      summary: Inspect the current screening context or immutable decision
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Redacted participant, screening, readiness, and review detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/events/{eventId}/reviews/{registrationId}/decision:
    post:
      tags: [Clinical Reviews]
      operationId: recordClinicalReviewDecision
      summary: Atomically record one immutable decision and optional draft referral
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionRequest" }
      responses:
        "201":
          description: Decision recorded and registration completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDecisionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/audit-log:
    get:
      tags: [Events]
      operationId: getEventAuditLog
      summary: Read immutable event history (manager/admin only)
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Reverse-chronological audit records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token kept in browser memory only
    refreshCookie:
      type: apiKey
      in: cookie
      name: vsms_refresh
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    EventLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
      description: Must equal the `vsms_csrf` cookie; requests also require an allowed Origin
  requestBodies:
    TransitionRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version]
            properties:
              version: { type: integer, minimum: 1 }
  responses:
    EventSuccess:
      description: Event transitioned and audited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Event" }
    Unauthorized:
      description: Authentication is absent, invalid, expired, revoked, or reused
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Request origin, CSRF token, or permission is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Resource is absent or intentionally concealed from the caller
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Stale version, illegal transition, or immutable state
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ValidationFailed:
      description: Request validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimited:
      description: Rate limit exceeded
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    SystemRole:
      type: string
      enum: [ADMIN, EVENT_MANAGER, STAFF]
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED]
    EventBannerKey:
      type: string
      enum: [COMMUNITY_SCREENING, LIBRARY_SCREENING, EVENT_OPERATIONS]
    ShiftStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    StaffAssignmentRole:
      type: string
      enum: [EVENT_MANAGER, REGISTRATION, SCREENER, REVIEWER, SUPPORT]
    StaffAssignmentStatus:
      type: string
      enum: [ASSIGNED, CONFIRMED, COMPLETED, CANCELLED]
    OverallFlag:
      type: string
      enum: [NORMAL, REVIEW, REFER, URGENT]
    ReviewOutcome:
      type: string
      enum: [COMPLETE, MONITOR, REFER, URGENT_ESCALATION]
    ClinicalUrgency:
      type: string
      enum: [ROUTINE, PRIORITY, URGENT, EMERGENCY]
    StaffDirectoryEntry:
      type: object
      additionalProperties: false
      required: [userId, username, systemRole]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
    StationTemplate:
      type: object
      additionalProperties: false
      required: [stationTemplateId, templateKey, version, name, defaultCapacity]
      properties:
        stationTemplateId: { type: string, format: uuid }
        templateKey: { type: string, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
        defaultCapacity: { type: integer, minimum: 1, maximum: 1000 }
    EventStation:
      type: object
      additionalProperties: false
      required: [eventStationId, stationTemplateId, templateVersion, name, stationOrder, capacity, isAvailable, availabilities]
      properties:
        eventStationId: { type: string, format: uuid }
        stationTemplateId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        isAvailable: { type: boolean }
        availabilities:
          type: array
          items: { $ref: "#/components/schemas/EventStationAvailability" }
    EventStationAvailability:
      type: object
      additionalProperties: false
      required: [eventStationAvailabilityId, isAvailable, capacity, eventDay]
      properties:
        eventStationAvailabilityId: { type: string, format: uuid }
        isAvailable: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        eventDay:
          type: object
          additionalProperties: false
          required: [eventDayId, date]
          properties:
            eventDayId: { type: string, format: uuid }
            date: { type: string, format: date }
    EventDayInput:
      type: object
      additionalProperties: false
      required: [date, startsAt, endsAt]
      properties:
        eventDayId: { type: string, format: uuid }
        date: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    EventDay:
      allOf:
        - $ref: "#/components/schemas/EventDayInput"
        - type: object
          required: [eventDayId]
          properties:
            eventDayId: { type: string, format: uuid }
    StationAvailabilityInput:
      type: object
      additionalProperties: false
      required: [date, isAvailable, capacity]
      properties:
        date: { type: string, format: date }
        isAvailable: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
    EventStationInput:
      type: object
      additionalProperties: false
      required: [stationTemplateId, stationOrder, capacity, isAvailable, availabilities]
      properties:
        eventStationId: { type: string, format: uuid }
        stationTemplateId: { type: string, format: uuid }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        isAvailable: { type: boolean }
        availabilities:
          type: array
          maxItems: 31
          items: { $ref: "#/components/schemas/StationAvailabilityInput" }
    StationImportRequest:
      type: object
      additionalProperties: false
      required: [version, stationTemplateIds]
      properties:
        version: { type: integer, minimum: 1 }
        stationTemplateIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
    EventStationUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        isAvailable: { type: boolean }
    StaffAssignmentRequest:
      oneOf:
        - $ref: "#/components/schemas/ScreenerStaffAssignmentRequest"
        - $ref: "#/components/schemas/GeneralStaffAssignmentRequest"
      discriminator:
        propertyName: assignmentRole
        mapping:
          SCREENER: "#/components/schemas/ScreenerStaffAssignmentRequest"
          EVENT_MANAGER: "#/components/schemas/GeneralStaffAssignmentRequest"
          REGISTRATION: "#/components/schemas/GeneralStaffAssignmentRequest"
          REVIEWER: "#/components/schemas/GeneralStaffAssignmentRequest"
          SUPPORT: "#/components/schemas/GeneralStaffAssignmentRequest"
    ScreenerStaffAssignmentRequest:
      type: object
      additionalProperties: false
      required: [version, userId, assignmentRole, eventStationId]
      properties:
        version: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        assignmentRole: { type: string, enum: [SCREENER] }
        eventStationId: { type: string, format: uuid }
    GeneralStaffAssignmentRequest:
      type: object
      additionalProperties: false
      required: [version, userId, assignmentRole]
      properties:
        version: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        assignmentRole: { type: string, enum: [EVENT_MANAGER, REGISTRATION, REVIEWER, SUPPORT] }
        eventStationId: { type: string, format: uuid, nullable: true }
    StaffAssignment:
      type: object
      additionalProperties: false
      required: [staffAssignmentId, assignmentRole, status, user]
      properties:
        staffAssignmentId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
        status: { $ref: "#/components/schemas/StaffAssignmentStatus" }
        notes: { type: string, nullable: true, maxLength: 500 }
        eventStation:
          type: object
          nullable: true
          additionalProperties: false
          required: [eventStationId, stationTemplateId, name, stationOrder]
          properties:
            eventStationId: { type: string, format: uuid }
            stationTemplateId: { type: string, format: uuid }
            name: { type: string }
            stationOrder: { type: integer, minimum: 1 }
        user:
          type: object
          additionalProperties: false
          required: [userId, username]
          properties:
            userId: { type: string, format: uuid }
            username: { type: string }
    ShiftAssignmentInput:
      type: object
      additionalProperties: false
      required: [userId, assignmentRole]
      properties:
        staffAssignmentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
        stationTemplateId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true, maxLength: 500 }
    User:
      type: object
      additionalProperties: false
      required: [userId, username, email, systemRole]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 3, maxLength: 255, description: Normalized username or email }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, csrfToken, user]
      properties:
        accessToken: { type: string, description: Short-lived JWT; never persist in browser storage }
        csrfToken: { type: string, description: Send as X-CSRF-Token for refresh/logout }
        user: { $ref: "#/components/schemas/User" }
    ShiftInput:
      type: object
      additionalProperties: false
      required: [name, startsAt, endsAt, requiredStaff]
      properties:
        shiftId: { type: string, format: uuid, description: Required only when editing an existing shift }
        name: { type: string, minLength: 1, maxLength: 100 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        requiredStaff: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        assignments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ShiftAssignmentInput" }
    Shift:
      allOf:
        - $ref: "#/components/schemas/ShiftInput"
        - type: object
          required: [shiftId, status, staffAssignments]
          properties:
            shiftId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/ShiftStatus" }
            staffAssignments: { type: array, items: { $ref: "#/components/schemas/StaffAssignment" } }
    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [name, venue, timezone, startsAt, endsAt, capacity]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 5000 }
        bannerKey: { $ref: "#/components/schemas/EventBannerKey" }
        artworkDataUrl:
          type: string
          nullable: true
          maxLength: 180000
          pattern: '^data:image/(jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$'
          description: Cropped square event artwork encoded as a bounded JPEG or WebP data URL
        venue: { type: string, minLength: 1, maxLength: 255 }
        address: { type: string, nullable: true, maxLength: 500 }
        postalCode: { type: string, nullable: true, pattern: '^\d{6}$' }
        latitude: { type: number, format: double, nullable: true, minimum: 1.13, maximum: 1.48 }
        longitude: { type: number, format: double, nullable: true, minimum: 103.59, maximum: 104.1 }
        locationProvider: { type: string, nullable: true, enum: [ONEMAP, MANUAL] }
        locationReference: { type: string, nullable: true, maxLength: 255 }
        timezone: { type: string, minLength: 1, maxLength: 100, example: Asia/Singapore }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        expectedAttendance: { type: integer, nullable: true, minimum: 1, maximum: 1000000 }
        eventDays: { type: array, minItems: 1, maxItems: 31, items: { $ref: "#/components/schemas/EventDayInput" } }
        stations: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/EventStationInput" } }
        shifts: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ShiftInput" } }
    UpdateEventRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 5000 }
        bannerKey: { $ref: "#/components/schemas/EventBannerKey" }
        artworkDataUrl:
          type: string
          nullable: true
          maxLength: 180000
          pattern: '^data:image/(jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$'
        venue: { type: string, minLength: 1, maxLength: 255 }
        address: { type: string, nullable: true, maxLength: 500 }
        postalCode: { type: string, nullable: true, pattern: '^\d{6}$' }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        locationProvider: { type: string, nullable: true, enum: [ONEMAP, MANUAL] }
        locationReference: { type: string, nullable: true, maxLength: 255 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        expectedAttendance: { type: integer, nullable: true, minimum: 1, maximum: 1000000 }
        eventDays: { type: array, minItems: 1, maxItems: 31, items: { $ref: "#/components/schemas/EventDayInput" } }
        stations: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/EventStationInput" } }
        shifts: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ShiftInput" } }
    CancelEventRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    Event:
      allOf:
        - $ref: "#/components/schemas/CreateEventRequest"
        - type: object
          required: [eventId, artworkDataUrl, status, version, createdByUserId, shifts, eventDays, eventStations, signupCount, activeCapacityCount, canManage, createdAt, updatedAt]
          properties:
            eventId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/EventStatus" }
            version: { type: integer, minimum: 1 }
            createdByUserId: { type: string, format: uuid }
            cancelledByUserId: { type: string, format: uuid, nullable: true }
            cancelledAt: { type: string, format: date-time, nullable: true }
            cancellationReason: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            shifts: { type: array, items: { $ref: "#/components/schemas/Shift" } }
            eventDays: { type: array, items: { $ref: "#/components/schemas/EventDay" } }
            eventStations: { type: array, items: { $ref: "#/components/schemas/EventStation" } }
            signupCount: { type: integer, minimum: 0, description: Number of collected registration entries for this event }
            activeCapacityCount: { type: integer, minimum: 0, description: Number of signed-up or checked-in registrations not marked completed or cancelled }
            canManage: { type: boolean, description: Whether the current caller may change this event }
            createdBy: { $ref: "#/components/schemas/User" }
            cancelledBy: { type: object, allOf: [{ $ref: "#/components/schemas/User" }], nullable: true }
    LocationResult:
      type: object
      additionalProperties: false
      required: [id, label, address, latitude, longitude, provider, timezone]
      properties:
        id: { type: string }
        label: { type: string }
        address: { type: string }
        postalCode: { type: string, nullable: true }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        provider: { type: string, enum: [ONEMAP] }
        timezone: { type: string, enum: [Asia/Singapore] }
    LocationSearchResponse:
      type: object
      additionalProperties: false
      required: [locations]
      properties:
        locations:
          type: array
          items: { $ref: "#/components/schemas/LocationResult" }
    EventListResponse:
      type: object
      required: [events, nextCursor]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        nextCursor: { type: string, nullable: true }
    EventAuditLog:
      type: object
      required: [eventAuditLogId, eventId, actorUserId, action, correlationId, createdAt]
      properties:
        eventAuditLogId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action: { type: string, enum: [CREATED, UPDATED, PUBLISHED, STARTED, COMPLETED, CANCELLED] }
        beforeSnapshot: { type: object, nullable: true, additionalProperties: true }
        afterSnapshot: { type: object, nullable: true, additionalProperties: true }
        correlationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/User" }
    AuditListResponse:
      type: object
      required: [auditLogs, nextCursor]
      properties:
        auditLogs: { type: array, items: { $ref: "#/components/schemas/EventAuditLog" } }
        nextCursor: { type: string, nullable: true }
    ReviewEvent:
      type: object
      additionalProperties: false
      required: [eventId, name, venue, timezone, status]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string }
        venue: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [IN_PROGRESS] }
    ReviewQueueItem:
      type: object
      additionalProperties: false
      required: [registrationId, participantDisplayName, queueNumber, highestFlag, flaggedResultCount, completedStationCount, totalStationCount, readyReason, lastResultAt]
      properties:
        registrationId: { type: string, format: uuid }
        participantDisplayName: { type: string }
        queueNumber: { type: integer, nullable: true }
        highestFlag: { $ref: "#/components/schemas/OverallFlag" }
        flaggedResultCount: { type: integer, minimum: 0 }
        completedStationCount: { type: integer, minimum: 0 }
        totalStationCount: { type: integer, minimum: 1 }
        readyReason: { type: string, enum: [SCREENING_COMPLETE, URGENT_FLAG] }
        lastResultAt: { type: string, format: date-time, nullable: true }
    ReviewQueueResponse:
      type: object
      additionalProperties: false
      required: [event, queue]
      properties:
        event: { $ref: "#/components/schemas/ReviewEvent" }
        queue:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ReviewQueueItem" }
    ReviewParticipant:
      type: object
      additionalProperties: false
      required: [registrationId, participantDisplayName, queueNumber, registrationStatus, maskedNric, dateOfBirth, gender]
      properties:
        registrationId: { type: string, format: uuid }
        participantDisplayName: { type: string }
        queueNumber: { type: integer, nullable: true }
        registrationStatus: { type: string, enum: [SIGNED_UP, CHECKED_IN, COMPLETED, CANCELLED] }
        maskedNric: { type: string, pattern: '^••••.{1,4}$' }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, maxLength: 1 }
    ScreeningResultSummary:
      type: object
      additionalProperties: false
      required: [resultId, stationId, screeningType, resultData, overallFlag, isFlagged, flagSummary, ruleVersion, createdAt, updatedAt]
      properties:
        resultId: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        screeningType: { type: string, enum: [VISUAL_ACUITY, REFRACTION, COLOUR_VISION, EYE_HEALTH] }
        resultData: { type: object, additionalProperties: true }
        overallFlag: { $ref: "#/components/schemas/OverallFlag" }
        isFlagged: { type: boolean }
        flagSummary: { type: string, nullable: true }
        ruleVersion: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewStationResult:
      type: object
      additionalProperties: false
      required: [stationId, stationName, stationType, stationOrder, result]
      properties:
        stationId: { type: string, format: uuid }
        stationName: { type: string }
        stationType: { type: string, enum: [VISUAL_ACUITY, REFRACTION, COLOUR_VISION, EYE_HEALTH] }
        stationOrder: { type: integer, minimum: 1 }
        result:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ScreeningResultSummary" }]
    ReviewReadiness:
      type: object
      additionalProperties: false
      required: [ready, readyReason, completedStationCount, totalStationCount, highestFlag]
      properties:
        ready: { type: boolean }
        readyReason: { type: string, enum: [SCREENING_COMPLETE, URGENT_FLAG], nullable: true }
        completedStationCount: { type: integer, minimum: 0 }
        totalStationCount: { type: integer, minimum: 0 }
        highestFlag: { $ref: "#/components/schemas/OverallFlag" }
    ReferralSummary:
      type: object
      additionalProperties: false
      required: [referralId, destinationName, reason, instructions, urgency, status]
      properties:
        referralId: { type: string, format: uuid }
        destinationName: { type: string }
        reason: { type: string }
        instructions: { type: string, nullable: true }
        urgency: { $ref: "#/components/schemas/ClinicalUrgency" }
        status: { type: string, enum: [DRAFT, ISSUED, SENT, ACKNOWLEDGED, CANCELLED] }
    ExistingReview:
      type: object
      additionalProperties: false
      required: [reviewId, version, outcome, urgency, clinicalSummary, recommendations, reviewedAt, reviewedByName, referral]
      properties:
        reviewId: { type: string, format: uuid }
        version: { type: integer, enum: [1] }
        outcome: { $ref: "#/components/schemas/ReviewOutcome" }
        urgency: { $ref: "#/components/schemas/ClinicalUrgency" }
        clinicalSummary: { type: string }
        recommendations: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time }
        reviewedByName: { type: string }
        referral:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReferralSummary" }]
    ReviewDetailResponse:
      type: object
      additionalProperties: false
      required: [event, participant, stations, readiness, existingReview, contextVersion]
      properties:
        event: { $ref: "#/components/schemas/ReviewEvent" }
        participant: { $ref: "#/components/schemas/ReviewParticipant" }
        stations: { type: array, items: { $ref: "#/components/schemas/ReviewStationResult" } }
        readiness: { $ref: "#/components/schemas/ReviewReadiness" }
        existingReview:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ExistingReview" }]
        contextVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
    ReferralDecisionInput:
      type: object
      additionalProperties: false
      required: [destinationName, reason]
      properties:
        destinationName: { type: string, minLength: 2, maxLength: 200 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        instructions: { type: string, maxLength: 2000 }
    CompleteReviewDecision:
      type: object
      additionalProperties: false
      required: [outcome, contextVersion, confirmed, clinicalSummary]
      properties:
        outcome: { type: string, enum: [COMPLETE] }
        contextVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
        confirmed: { type: boolean, enum: [true] }
        clinicalSummary: { type: string, minLength: 10, maxLength: 2000 }
        recommendations: { type: string, maxLength: 2000 }
    MonitorReviewDecision:
      type: object
      additionalProperties: false
      required: [outcome, contextVersion, confirmed, clinicalSummary]
      properties:
        outcome: { type: string, enum: [MONITOR] }
        contextVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
        confirmed: { type: boolean, enum: [true] }
        clinicalSummary: { type: string, minLength: 10, maxLength: 2000 }
        recommendations: { type: string, maxLength: 2000 }
    ReferReviewDecision:
      type: object
      additionalProperties: false
      required: [outcome, contextVersion, confirmed, clinicalSummary, urgency, referral]
      properties:
        outcome: { type: string, enum: [REFER] }
        contextVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
        confirmed: { type: boolean, enum: [true] }
        clinicalSummary: { type: string, minLength: 10, maxLength: 2000 }
        recommendations: { type: string, maxLength: 2000 }
        urgency: { type: string, enum: [ROUTINE, PRIORITY, URGENT] }
        referral: { $ref: "#/components/schemas/ReferralDecisionInput" }
    UrgentReviewDecision:
      type: object
      additionalProperties: false
      required: [outcome, contextVersion, confirmed, clinicalSummary, referral]
      properties:
        outcome: { type: string, enum: [URGENT_ESCALATION] }
        contextVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
        confirmed: { type: boolean, enum: [true] }
        clinicalSummary: { type: string, minLength: 10, maxLength: 2000 }
        recommendations: { type: string, maxLength: 2000 }
        referral: { $ref: "#/components/schemas/ReferralDecisionInput" }
    ReviewDecisionRequest:
      oneOf:
        - $ref: "#/components/schemas/CompleteReviewDecision"
        - $ref: "#/components/schemas/MonitorReviewDecision"
        - $ref: "#/components/schemas/ReferReviewDecision"
        - $ref: "#/components/schemas/UrgentReviewDecision"
      discriminator:
        propertyName: outcome
        mapping:
          COMPLETE: "#/components/schemas/CompleteReviewDecision"
          MONITOR: "#/components/schemas/MonitorReviewDecision"
          REFER: "#/components/schemas/ReferReviewDecision"
          URGENT_ESCALATION: "#/components/schemas/UrgentReviewDecision"
    RecordedReview:
      type: object
      additionalProperties: false
      required: [reviewId, version, outcome, urgency, clinicalSummary, recommendations, reviewedAt]
      properties:
        reviewId: { type: string, format: uuid }
        version: { type: integer, enum: [1] }
        outcome: { $ref: "#/components/schemas/ReviewOutcome" }
        urgency: { $ref: "#/components/schemas/ClinicalUrgency" }
        clinicalSummary: { type: string }
        recommendations: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time }
    ReviewDecisionResponse:
      type: object
      additionalProperties: false
      required: [registrationStatus, review, referral]
      properties:
        registrationStatus: { type: string, enum: [COMPLETED] }
        review: { $ref: "#/components/schemas/RecordedReview" }
        referral:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReferralSummary" }]
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
