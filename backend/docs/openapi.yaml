openapi: 3.0.3
info:
  title: VSMS Event Operations API
  version: 2.3.0
  description: Secure staff authentication, event operations, and clinical review workflows for VSMS.
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
servers:
  - url: /
    description: Same-origin API server; local development proxies to https://127.0.0.1:5050
tags:
  - name: System
    description: Service readiness
  - name: Authentication
    description: Amazon Cognito managed login with a secure cookie session
  - name: Events
    description: Authorized event details and lifecycle commands
  - name: Users
    description: Restricted administrative user projection
  - name: Participants
    description: Participant onboarding, lookup, consent, and emergency contacts
  - name: Registrations
    description: Event registration and status history
  - name: Screening
    description: Event station queues and screening result capture
  - name: QR Codes
    description: Registration pass generation, verification, and check-in
  - name: Administration
    description: Restricted operational audit data
  - name: Clinical Reviews
    description: Event-scoped clinical review queue and immutable decisions
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      security: []
      operationId: getHealth
      summary: Check API readiness
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        "500":
          description: Service is not ready
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404":
          description: Health endpoint is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /api/v1/auth/config-status:
    get:
      tags: [Authentication]
      security: []
      operationId: getAuthenticationConfigStatus
      summary: Check whether Cognito managed login is configured
      responses:
        "200":
          description: Authentication configuration status
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthConfigStatus" } } }
  /api/v1/auth/authorize:
    get:
      tags: [Authentication]
      security: []
      operationId: authorizeWithCognito
      summary: Redirect the browser to Cognito managed login
      parameters:
        - in: query
          name: returnTo
          schema: { type: string, default: /dashboard }
      responses:
        "302": { description: Redirect to the Cognito authorization endpoint }
        "503": { description: Cognito managed login is not configured }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/callback:
    get:
      tags: [Authentication]
      security: []
      operationId: completeCognitoAuthorization
      summary: Exchange the Cognito authorization code for a cookie session
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cognito authorization completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { description: Invalid or expired OAuth state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: refreshSession
      summary: Rotate a one-time refresh session
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Session rotated, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Sign out from Cognito and clear browser cookies
      responses:
        "200":
          description: Browser session cleared
          content: { application/json: { schema: { $ref: "#/components/schemas/LogoutResponse" } } }
        "503": { description: Cognito managed login is not configured }
  /api/v1/auth/global-logout:
    post:
      tags: [Authentication]
      operationId: globalLogout
      summary: Alias for Cognito sign-out and local cookie clearing
      responses:
        "200":
          description: Browser session cleared
          content: { application/json: { schema: { $ref: "#/components/schemas/LogoutResponse" } } }
        "503": { description: Cognito managed login is not configured }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the authenticated staff identity
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated Cognito user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Cognito managed login is not configured }
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List projected user records (ADMIN only)
      responses:
        "200":
          description: Up to 100 users without credential material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a staff user (ADMIN or EVENT_MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Staff user created
          content: { application/json: { schema: { $ref: "#/components/schemas/UserMutationResponse" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events visible to the current staff member
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EventLimit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventStatus" }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200":
          description: Authorized, cursor-paginated events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a draft event with optional planned shifts
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable retry key for this create attempt
          schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/active:
    get:
      tags: [Events]
      operationId: listActiveEvents
      summary: List published or in-progress events
      responses:
        "200":
          description: Active events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/events/staff-directory:
    get:
      tags: [Events]
      operationId: listEventStaffDirectory
      summary: List active users available for event staffing
      responses:
        "200":
          description: Active staff directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffDirectoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/events/station-templates:
    get:
      tags: [Events]
      operationId: listStationTemplates
      summary: List active reusable station templates
      responses:
        "200":
          description: Active station templates available for import
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StationTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/locations/search:
    get:
      tags: [Events]
      operationId: searchSingaporeLocations
      summary: Search Singapore addresses with OneMap
      description: Uses a server-cached OneMap token that is renewed automatically; requests are rate limited below OneMap's 300 calls/minute quota.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 120 }
      responses:
        "200":
          description: Normalized Singapore locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationSearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: OneMap is unavailable or not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/v1/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an authorized event detail
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update allowed fields using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventRequest" }
      responses:
        "200":
          description: Event updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/events/{eventId}/registrations:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [Registrations]
      operationId: listEventRegistrations
      summary: List registrations for an event
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated event registrations
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationListResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Registrations]
      operationId: createEventRegistration
      summary: Register a participant for an event
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [participantId]
              properties:
                participantId: { type: string, format: uuid }
      responses:
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationResponse" } } } }
        "201": { description: Participant registered, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/events/{eventId}/shifts/{shiftId}/assignments:
    post:
      tags: [Events]
      operationId: assignEventStaff
      summary: Assign an active user to an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffAssignmentRequest" }
      responses:
        "201":
          description: Assignment saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/events/{eventId}/shifts/{shiftId}/assignments/{assignmentId}:
    delete:
      tags: [Events]
      operationId: removeEventStaffAssignment
      summary: Remove a user from an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Assignment removed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/events/{eventId}/stations/import:
    post:
      tags: [Events]
      operationId: importEventStations
      summary: Import active screening templates as event Station rows (VA / refraction / colour vision / eye health). REGISTRATION and CLINICAL_REVIEW are rejected.
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationImportRequest" }
      responses:
        "201":
          description: Stations imported and audited
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/events/{eventId}/stations/{eventStationId}:
    patch:
      tags: [Events]
      operationId: updateEventStation
      summary: Configure an imported station's order, capacity, or availability
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: eventStationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventStationUpdateRequest" }
      responses:
        "200":
          description: Event station updated and audited
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/events/{eventId}/publish:
    post:
      tags: [Events]
      operationId: publishEvent
      summary: Move a draft event to published
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/start:
    post:
      tags: [Events]
      operationId: startEvent
      summary: Start a published event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/complete:
    post:
      tags: [Events]
      operationId: completeEvent
      summary: Complete an in-progress event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/cancel:
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Cancel a non-terminal event with a reason
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelEventRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/stations:
    get:
      tags: [Screening]
      operationId: listScreeningStations
      summary: List active screening stations for an event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200": { description: Event and active stations, content: { application/json: { schema: { $ref: "#/components/schemas/ScreeningStationsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events/{eventId}/stations/{stationId}/queue:
    get:
      tags: [Screening]
      operationId: listScreeningQueue
      summary: List screenable registrations for a station
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/StationId"
      responses:
        "200": { description: Station queue, content: { application/json: { schema: { $ref: "#/components/schemas/ScreeningQueueResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/events/{eventId}/registrations/resolve:
    get:
      tags: [Screening]
      operationId: resolveScreeningParticipant
      summary: Resolve an event registration from a pass token or registration ID
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: passToken
          in: query
          schema: { type: string, minLength: 4, maxLength: 255 }
        - name: registrationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Resolved registration, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationLookup" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/events/{eventId}/stations/{stationId}/visual-acuity/preview:
    post:
      tags: [Screening]
      operationId: previewVisualAcuity
      summary: Evaluate a visual-acuity result without saving it
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/StationId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VisualAcuityPreviewRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ScreeningPreview" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "422": { $ref: "#/components/responses/ValidationFailed" } }
  /api/v1/events/{eventId}/stations/{stationId}/visual-acuity:
    post:
      tags: [Screening]
      operationId: saveVisualAcuity
      summary: Save or idempotently replay a visual-acuity result
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/StationId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VisualAcuitySaveRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ScreeningSaved" }, "201": { $ref: "#/components/responses/ScreeningSaved" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" } }
  /api/v1/events/{eventId}/stations/{stationId}/refraction/preview:
    post:
      tags: [Screening]
      operationId: previewRefraction
      summary: Evaluate a refraction result without saving it
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/StationId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefractionPreviewRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ScreeningPreview" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "422": { $ref: "#/components/responses/ValidationFailed" } }
  /api/v1/events/{eventId}/stations/{stationId}/refraction:
    post:
      tags: [Screening]
      operationId: saveRefraction
      summary: Save or idempotently replay a refraction result
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/StationId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefractionSaveRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ScreeningSaved" }, "201": { $ref: "#/components/responses/ScreeningSaved" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" } }
  /api/v1/events/{eventId}/stations/{stationId}/colour-vision/preview:
    post:
      tags: [Screening]
      operationId: previewColourVision
      summary: Evaluate a colour-vision result without saving it
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/StationId" }]
