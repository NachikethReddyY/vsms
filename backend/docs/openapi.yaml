openapi: 3.0.3
info:
  title: VSMS Event Operations API
  version: 2.0.0
  description: Secure staff authentication and event lifecycle operations for VSMS.
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
servers:
  - url: /
    description: Same-origin API server; local development uses https://localhost:5050
tags:
  - name: System
    description: Service readiness
  - name: Authentication
    description: Simple username/password login with a secure rotating cookie session
  - name: Events
    description: Authorized event details and lifecycle commands
  - name: Users
    description: Restricted administrative user projection
  - name: QR passes
    description: Event-scoped participant pass generation and resolution
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      security: []
      operationId: getHealth
      summary: Check API readiness
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        "500":
          description: Service is not ready
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404":
          description: Health endpoint is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      summary: Authenticate a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login succeeded; refresh and CSRF cookies are also set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Secure HttpOnly refresh cookie and readable CSRF cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/signup:
    post:
      tags: [Authentication]
      security: []
      operationId: signup
      summary: Create a staff account when public registration is enabled
      description: Disabled by default. An administrator must explicitly set PUBLIC_SIGNUP_ENABLED=true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: refreshSession
      summary: Rotate a one-time refresh session
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Session rotated, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: logout
      summary: Revoke the refresh family and clear cookies
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "204": { description: Session revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List projected user records (ADMIN only)
      responses:
        "200":
          description: Up to 100 users without credential material
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events visible to the current staff member
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EventLimit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventStatus" }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200":
          description: Authorized, cursor-paginated events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a draft event with optional planned shifts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/staff-directory:
    get:
      tags: [Events]
      operationId: listEventStaffDirectory
      summary: List active users available for event staffing
      responses:
        "200":
          description: Active staff directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffDirectoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an authorized event detail
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update allowed fields using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventRequest" }
      responses:
        "200":
          description: Event updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/shifts/{shiftId}/assignments:
    post:
      tags: [Events]
      operationId: assignEventStaff
      summary: Assign an active user to an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffAssignmentRequest" }
      responses:
        "201":
          description: Assignment saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/events/{eventId}/shifts/{shiftId}/assignments/{assignmentId}:
    delete:
      tags: [Events]
      operationId: removeEventStaffAssignment
      summary: Remove a user from an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Assignment removed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/events/{eventId}/publish:
    post:
      tags: [Events]
      operationId: publishEvent
      summary: Move a draft event to published
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/start:
    post:
      tags: [Events]
      operationId: startEvent
      summary: Start a published event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/complete:
    post:
      tags: [Events]
      operationId: completeEvent
      summary: Complete an in-progress event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/cancel:
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Cancel a non-terminal event with a reason
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelEventRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/audit-log:
    get:
      tags: [Events]
      operationId: getEventAuditLog
      summary: Read immutable event history (manager/admin only)
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Reverse-chronological audit records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/qr/generate/{participantId}:
    post:
      tags: [QR passes]
      operationId: generateParticipantQrPass
      summary: Replace and generate a QR pass for an authorized event participant
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The previous active pass was revoked and a new pass was generated
          content: { application/json: { schema: { $ref: "#/components/schemas/QrPassResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/qr/resolve:
    post:
      tags: [QR passes]
      operationId: resolveParticipantQrPass
      summary: Resolve an unexpired QR token within the caller's assigned event scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrResolveRequest" }
      responses:
        "200":
          description: Minimal participant identity for the authorized event
          content: { application/json: { schema: { $ref: "#/components/schemas/QrParticipant" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token kept in browser memory only
    refreshCookie:
      type: apiKey
      in: cookie
      name: vsms_refresh
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    EventLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
      description: Must equal the `vsms_csrf` cookie; requests also require an allowed Origin
  requestBodies:
    TransitionRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version]
            properties:
              version: { type: integer, minimum: 1 }
  responses:
    EventSuccess:
      description: Event transitioned and audited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Event" }
    Unauthorized:
      description: Authentication is absent, invalid, expired, revoked, or reused
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Request origin, CSRF token, or permission is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Resource is absent or intentionally concealed from the caller
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Stale version, illegal transition, or immutable state
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ValidationFailed:
      description: Request validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimited:
      description: Rate limit exceeded
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    SystemRole:
      type: string
      enum: [ADMIN, EVENT_MANAGER, STAFF]
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED]
    EventBannerKey:
      type: string
      enum: [COMMUNITY_SCREENING, LIBRARY_SCREENING, EVENT_OPERATIONS]
    ShiftStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    StaffAssignmentRole:
      type: string
      enum: [EVENT_MANAGER, REGISTRATION, SCREENER, REVIEWER, SUPPORT]
    StaffAssignmentStatus:
      type: string
      enum: [ASSIGNED, CONFIRMED, COMPLETED, CANCELLED]
    StaffDirectoryEntry:
      type: object
      additionalProperties: false
      required: [userId, username, systemRole]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
    StaffAssignmentRequest:
      type: object
      additionalProperties: false
      required: [userId, assignmentRole]
      properties:
        userId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
    StaffAssignment:
      type: object
      additionalProperties: false
      required: [staffAssignmentId, assignmentRole, status, user]
      properties:
        staffAssignmentId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
        status: { $ref: "#/components/schemas/StaffAssignmentStatus" }
        user:
          type: object
          additionalProperties: false
          required: [userId, username]
          properties:
            userId: { type: string, format: uuid }
            username: { type: string }
    User:
      type: object
      additionalProperties: false
      required: [userId, username, email, systemRole]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 3, maxLength: 255, description: Normalized username or email }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, csrfToken, user]
      properties:
        accessToken: { type: string, description: Short-lived JWT; never persist in browser storage }
        csrfToken: { type: string, description: Send as X-CSRF-Token for refresh/logout }
        user: { $ref: "#/components/schemas/User" }
    ShiftInput:
      type: object
      additionalProperties: false
      required: [name, startsAt, endsAt, requiredStaff]
      properties:
        shiftId: { type: string, format: uuid, description: Required only when editing an existing shift }
        name: { type: string, minLength: 1, maxLength: 100 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        requiredStaff: { type: integer, minimum: 1, maximum: 1000, default: 1 }
    Shift:
      allOf:
        - $ref: "#/components/schemas/ShiftInput"
        - type: object
          required: [shiftId, status, staffAssignments]
          properties:
            shiftId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/ShiftStatus" }
            staffAssignments: { type: array, items: { $ref: "#/components/schemas/StaffAssignment" } }
    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [name, venue, timezone, startsAt, endsAt, capacity]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 5000 }
        bannerKey: { $ref: "#/components/schemas/EventBannerKey" }
        artworkDataUrl:
          type: string
          nullable: true
          maxLength: 180000
          pattern: '^data:image/(jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$'
          description: Cropped square event artwork encoded as a bounded JPEG or WebP data URL
        venue: { type: string, minLength: 1, maxLength: 255 }
        timezone: { type: string, minLength: 1, maxLength: 100, example: Asia/Singapore }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        shifts: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ShiftInput" } }
    UpdateEventRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 5000 }
        bannerKey: { $ref: "#/components/schemas/EventBannerKey" }
        artworkDataUrl:
          type: string
          nullable: true
          maxLength: 180000
          pattern: '^data:image/(jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$'
        venue: { type: string, minLength: 1, maxLength: 255 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        shifts: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ShiftInput" } }
    CancelEventRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    Event:
      allOf:
        - $ref: "#/components/schemas/CreateEventRequest"
        - type: object
          required: [eventId, artworkDataUrl, status, version, createdByUserId, shifts, signupCount, activeCapacityCount, canManage, createdAt, updatedAt]
          properties:
            eventId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/EventStatus" }
            version: { type: integer, minimum: 1 }
            createdByUserId: { type: string, format: uuid }
            cancelledByUserId: { type: string, format: uuid, nullable: true }
            cancelledAt: { type: string, format: date-time, nullable: true }
            cancellationReason: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            shifts: { type: array, items: { $ref: "#/components/schemas/Shift" } }
            signupCount: { type: integer, minimum: 0, description: Number of collected registration entries for this event }
            activeCapacityCount: { type: integer, minimum: 0, description: Number of signed-up or checked-in registrations not marked completed or cancelled }
            canManage: { type: boolean, description: Server-derived ownership or event-manager capability for this caller }
            createdBy: { $ref: "#/components/schemas/User" }
            cancelledBy: { type: object, allOf: [{ $ref: "#/components/schemas/User" }], nullable: true }
    EventListResponse:
      type: object
      required: [events, nextCursor]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        nextCursor: { type: string, nullable: true }
    EventAuditLog:
      type: object
      required: [eventAuditLogId, eventId, actorUserId, action, correlationId, createdAt]
      properties:
        eventAuditLogId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid }
        action: { type: string, enum: [CREATED, UPDATED, PUBLISHED, STARTED, COMPLETED, CANCELLED] }
        beforeSnapshot: { type: object, nullable: true, additionalProperties: true }
        afterSnapshot: { type: object, nullable: true, additionalProperties: true }
        correlationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/User" }
    AuditListResponse:
      type: object
      required: [auditLogs, nextCursor]
      properties:
        auditLogs: { type: array, items: { $ref: "#/components/schemas/EventAuditLog" } }
        nextCursor: { type: string, nullable: true }
    QrResolveRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[a-f0-9]{64}$' }
    QrPassResponse:
      type: object
      additionalProperties: false
      required: [success, expiresAt, qrImage]
      properties:
        success: { type: boolean, enum: [true] }
        expiresAt: { type: string, format: date-time }
        qrImage: { type: string, pattern: '^data:image/png;base64,' }
    QrParticipant:
      type: object
      additionalProperties: false
      required: [participantId, firstName, lastName]
      properties:
        participantId: { type: string, format: uuid }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
