openapi: 3.0.3
info:
  title: VSMS Event Operations API
  version: 2.2.0
  description: Secure staff authentication, event operations, and clinical review workflows for VSMS.
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
servers:
  - url: /
    description: Same-origin API server; local development proxies to https://127.0.0.1:5050
tags:
  - name: System
    description: Service readiness
  - name: Authentication
    description: Amazon Cognito managed login with a secure cookie session
  - name: Events
    description: Authorized event details and lifecycle commands
  - name: Public Events
    description: Read-only event pages without attendee or staff data
  - name: Users
    description: Restricted administrative user projection
  - name: Clinical Reviews
    description: Event-scoped clinical review queue and immutable decisions
security:
  - bearerAuth: []
  - accessCookie: []
paths:
  /health:
    get:
      tags: [System]
      security: []
      operationId: getHealth
      summary: Check API readiness
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        "500":
          description: Service is not ready
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "404":
          description: Health endpoint is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /api/v1/auth/authorize:
    get:
      tags: [Authentication]
      security: []
      operationId: authorizeWithCognito
      summary: Redirect the browser to Cognito managed login
      parameters:
        - in: query
          name: returnTo
          schema: { type: string, default: /dashboard }
      responses:
        "302": { description: Redirect to the Cognito authorization endpoint }
        "503": { description: Cognito managed login is not configured }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/callback:
    get:
      tags: [Authentication]
      security: []
      operationId: completeCognitoAuthorization
      summary: Exchange the Cognito authorization code for a cookie session
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cognito authorization completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { description: Invalid or expired OAuth state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: refreshSession
      summary: Rotate a one-time refresh session
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200": { description: Session rotated, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      operationId: logout
      summary: Revoke the refresh family and clear cookies
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      responses:
        "200":
          description: Session revoked and managed-login logout URL returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, logoutUrl]
                properties:
                  message: { type: string }
                  logoutUrl:
                    type: string
                    description: Absolute Cognito logout URL, or a local path when the identity provider is unavailable
                    pattern: '^(https://|/).+'
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events:
    get:
      tags: [Events]
      operationId: listEventsV1
      summary: List events visible to the current staff member
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EventLimit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventStatus" }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200":
          description: Authorized, cursor-paginated events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Events]
      operationId: createEventV1
      summary: Create a draft event with optional planned shifts
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable retry key for this create attempt
          schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { description: Station and staff-assignment plan changes are not available yet }
  /api/v1/events/active:
    get:
      tags: [Events]
      operationId: listActiveEventsV1
      summary: List visible published and in-progress events
      responses:
        "200":
          description: Authorized active events without pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/events/staff-directory:
    get:
      tags: [Events]
      operationId: listEventStaffDirectoryV1
      summary: List active staff available for event staffing
      responses:
        "200":
          description: Active staff directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffDirectoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/events/station-templates:
    get:
      tags: [Events]
      operationId: listStationTemplatesV1
      summary: List active reusable station templates
      responses:
        "200":
          description: Active station templates available for import
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StationTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/events/{eventId}/registrations:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [Events]
      operationId: listEventRegistrationsV1
      summary: List registrations for an event
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Registration rows and pagination metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistrationListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Events]
      operationId: createEventRegistrationV1
      summary: Register a participant for an open event
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventRegistrationCreateRequest" }
      responses:
        "200":
          description: Idempotent replay of an existing registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistrationCommandResponse" }
        "201":
          description: Registration created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventRegistrationCommandResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/shifts/{shiftId}/assignments:
    post:
      tags: [Events]
      operationId: assignEventStaffV1
      summary: Assign a user to an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffAssignmentRequest" }
      responses:
        "201":
          description: Staff assignment created
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/shifts/{shiftId}/assignments/{assignmentId}:
    delete:
      tags: [Events]
      operationId: removeEventStaffAssignmentV1
      summary: Remove a user from an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Assignment removed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/stations/import:
    post:
      tags: [Events]
      operationId: importEventStationsV1
      summary: Import active templates as event-owned station snapshots
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationImportRequest" }
      responses:
        "201":
          description: Stations imported
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/stations/{eventStationId}:
    patch:
      tags: [Events]
      operationId: updateEventStationV1
      summary: Configure an imported station's order, capacity, or availability
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: eventStationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventStationUpdateRequest" }
      responses:
        "200":
          description: Station updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/publish:
    post:
      tags: [Events]
      operationId: publishEventV1
      summary: Move a draft event to published
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/start:
    post:
      tags: [Events]
      operationId: startEventV1
      summary: Start a published event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/complete:
    post:
      tags: [Events]
      operationId: completeEventV1
      summary: Complete an in-progress event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/cancel:
    post:
      tags: [Events]
      operationId: cancelEventV1
      summary: Cancel a non-terminal event with a reason
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelEventRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/v1/events/{eventId}/audit-log:
    get:
      tags: [Events]
      operationId: getEventAuditLogV1
      summary: Read immutable event history for a manager-visible event
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Reverse-chronological audit records
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/public/events/{eventId}:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [Public Events]
      security: []
      operationId: getPublicEvent
      summary: Read a published, in-progress, completed, or cancelled event
      responses:
        "200":
          description: Public event projection; cached for at most 60 seconds
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEvent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/metrics:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [Events]
      operationId: getEventMetrics
      summary: Read truthful event outcome metrics visible to the current staff member
      responses:
        "200":
          description: Aggregate-only metrics; never cached
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/attendees:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [Events]
      operationId: listEventAttendees
      summary: List manager-visible attendee operational rows with cursor pagination
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [SIGNED_UP, CHECKED_IN, COMPLETED, CANCELLED] }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200":
          description: Operational attendee rows; never cached
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventAttendeeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}/export:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [Events]
      operationId: exportEvent
      summary: Export a manager-visible event with a short-lived deletion receipt
      responses:
        "200":
          description: Versioned JSON export; never cached
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventExportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/events/{eventId}:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [Events]
      operationId: getEventV1
      summary: Get an authorized event detail
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateEventV1
      summary: Update allowed fields using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventRequest" }
      responses:
        "200":
          description: Event updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { description: Station and staff-assignment plan changes are not available yet }
    delete:
      tags: [Events]
      operationId: deleteEmptyDraftEvent
      summary: Delete an exported unpopulated draft event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventDeletionRequest" }
      responses:
        "204": { description: Unpopulated draft event deleted and tombstoned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List projected user records (ADMIN only)
      responses:
        "200":
          description: Up to 100 users without credential material
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events visible to the current staff member
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/EventLimit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventStatus" }
        - name: search
          in: query
          schema: { type: string, maxLength: 150 }
      responses:
        "200":
          description: Authorized, cursor-paginated events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create a draft event with optional planned shifts
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable retry key for this create attempt
          schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { description: Station and staff-assignment plan changes are not available yet }
  /api/events/staff-directory:
    get:
      tags: [Events]
      operationId: listEventStaffDirectory
      summary: List active users available for event staffing
      responses:
        "200":
          description: Active staff directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffDirectoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events/station-templates:
    get:
      tags: [Events]
      operationId: listStationTemplates
      summary: List active reusable station templates
      responses:
        "200":
          description: Active station templates available for import
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StationTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/locations/search:
    get:
      tags: [Events]
      operationId: searchSingaporeLocations
      summary: Search Singapore addresses with OneMap
      description: Uses a server-cached OneMap token that is renewed automatically; requests are rate limited below OneMap's 300 calls/minute quota.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 120 }
      responses:
        "200":
          description: Normalized Singapore locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationSearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: OneMap is unavailable or not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /api/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an authorized event detail
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update allowed fields using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventRequest" }
      responses:
        "200":
          description: Event updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { description: Station and staff-assignment plan changes are not available yet }
    delete:
      tags: [Events]
      operationId: deleteEmptyDraftEventLegacy
      summary: Delete an exported unpopulated draft event through the legacy alias
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventDeletionRequest" }
      responses:
        "204": { description: Unpopulated draft event deleted and tombstoned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/{eventId}/shifts/{shiftId}/assignments:
    post:
      tags: [Events]
      operationId: assignEventStaff
      summary: Assign an active user to an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffAssignmentRequest" }
      responses:
        "201":
          description: Assignment saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/{eventId}/shifts/{shiftId}/assignments/{assignmentId}:
    delete:
      tags: [Events]
      operationId: removeEventStaffAssignment
      summary: Remove a user from an event shift
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ShiftId"
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Assignment removed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/{eventId}/stations/import:
    post:
      tags: [Events]
      operationId: importEventStations
      summary: Import active screening templates as event Station rows (VA / refraction / colour vision / eye health). REGISTRATION and CLINICAL_REVIEW are rejected.
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationImportRequest" }
      responses:
        "201":
          description: Stations imported and audited
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/{eventId}/stations/{eventStationId}:
    patch:
      tags: [Events]
      operationId: updateEventStation
      summary: Configure an imported station's order, capacity, or availability
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: eventStationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventStationUpdateRequest" }
      responses:
        "200":
          description: Event station updated and audited
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/{eventId}/publish:
    post:
      tags: [Events]
      operationId: publishEvent
      summary: Move a draft event to published
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/start:
    post:
      tags: [Events]
      operationId: startEvent
      summary: Start a published event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/complete:
    post:
      tags: [Events]
      operationId: completeEvent
      summary: Complete an in-progress event
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody: { $ref: "#/components/requestBodies/TransitionRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/cancel:
    post:
      tags: [Events]
      operationId: cancelEvent
      summary: Cancel a non-terminal event with a reason
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelEventRequest" }
      responses: { "200": { $ref: "#/components/responses/EventSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/ValidationFailed" }, "429": { $ref: "#/components/responses/RateLimited" } }
  /api/events/{eventId}/reviews:
    get:
      tags: [Clinical Reviews]
      operationId: listClinicalReviews
      summary: List registrations currently actionable by an assigned reviewer
      parameters: [{ $ref: "#/components/parameters/EventId" }]
      responses:
        "200":
          description: Event summary and severity-ordered actionable queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueueResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/events/{eventId}/reviews/{registrationId}:
    get:
      tags: [Clinical Reviews]
      operationId: getClinicalReview
      summary: Inspect the current screening context or immutable decision
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Redacted participant, screening, readiness, and review detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/events/{eventId}/reviews/{registrationId}/decision:
    post:
      tags: [Clinical Reviews]
      operationId: recordClinicalReviewDecision
      summary: Atomically record one immutable decision and optional draft referral
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionRequest" }
      responses:
        "201":
          description: Decision recorded and registration completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDecisionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/events/{eventId}/audit-log:
    get:
      tags: [Events]
      operationId: getEventAuditLog
      summary: Read immutable event history (manager/admin only)
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Reverse-chronological audit records
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived local access token for non-browser API clients and compatibility tests
    accessCookie:
      type: apiKey
      in: cookie
      name: vsms_access
      description: HttpOnly Cognito access token; state-changing requests also require the CSRF header
    refreshCookie:
      type: apiKey
      in: cookie
      name: vsms_refresh
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    EventLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
      description: Must equal the `vsms_csrf` cookie; requests also require an allowed Origin
  requestBodies:
    TransitionRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version]
            properties:
              version: { type: integer, minimum: 1 }
  responses:
    EventSuccess:
      description: Event transitioned and audited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Event" }
    BadRequest:
      description: Request cannot be fulfilled in the resource's current state
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: Authentication is absent, invalid, expired, revoked, or reused
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Request origin, CSRF token, or permission is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Resource is absent or intentionally concealed from the caller
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Stale version, illegal transition, or immutable state
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ValidationFailed:
      description: Request validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimited:
      description: Rate limit exceeded
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    SystemRole:
      type: string
      enum: [ADMIN, EVENT_MANAGER, STAFF]
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED]
    EventBannerKey:
      type: string
      enum: [COMMUNITY_SCREENING, LIBRARY_SCREENING, EVENT_OPERATIONS]
    ShiftStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    StaffAssignmentRole:
      type: string
      enum: [EVENT_MANAGER, REGISTRATION, SCREENER, REVIEWER, SUPPORT]
    StaffAssignmentStatus:
      type: string
      enum: [ASSIGNED, CONFIRMED, COMPLETED, CANCELLED]
    OverallFlag:
      type: string
      enum: [NORMAL, REVIEW, REFER, URGENT]
    ReviewOutcome:
      type: string
      enum: [COMPLETE, MONITOR, REFER, URGENT_ESCALATION]
    ClinicalUrgency:
      type: string
      enum: [ROUTINE, PRIORITY, URGENT, EMERGENCY]
    StaffDirectoryEntry:
      type: object
      additionalProperties: false
      required: [userId, username, systemRole]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
    StationTemplate:
      type: object
      additionalProperties: false
      required: [stationTemplateId, templateKey, version, name, defaultCapacity]
      properties:
        stationTemplateId: { type: string, format: uuid }
        templateKey: { type: string, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
        defaultCapacity: { type: integer, minimum: 1, maximum: 1000 }
    EventStation:
      type: object
      additionalProperties: false
      required: [eventStationId, stationTemplateId, templateVersion, name, stationOrder, capacity, isAvailable, availabilities]
      properties:
        eventStationId: { type: string, format: uuid }
        stationTemplateId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        isAvailable: { type: boolean }
        availabilities:
          type: array
          items: { $ref: "#/components/schemas/EventStationAvailability" }
    EventStationAvailability:
      type: object
      additionalProperties: false
      required: [eventStationAvailabilityId, isAvailable, capacity, eventDay]
      properties:
        eventStationAvailabilityId: { type: string, format: uuid }
        isAvailable: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        eventDay:
          type: object
          additionalProperties: false
          required: [eventDayId, date]
          properties:
            eventDayId: { type: string, format: uuid }
            date: { type: string, format: date }
    EventDayInput:
      type: object
      additionalProperties: false
      required: [date, startsAt, endsAt]
      properties:
        eventDayId: { type: string, format: uuid }
        date: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    EventDay:
      allOf:
        - $ref: "#/components/schemas/EventDayInput"
        - type: object
          required: [eventDayId]
          properties:
            eventDayId: { type: string, format: uuid }
    StationAvailabilityInput:
      type: object
      additionalProperties: false
      required: [date, isAvailable, capacity]
      properties:
        date: { type: string, format: date }
        isAvailable: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
    EventStationInput:
      type: object
      additionalProperties: false
      required: [stationTemplateId, stationOrder, capacity, isAvailable, availabilities]
      properties:
        eventStationId: { type: string, format: uuid }
        stationTemplateId: { type: string, format: uuid }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        isAvailable: { type: boolean }
        availabilities:
          type: array
          maxItems: 31
          items: { $ref: "#/components/schemas/StationAvailabilityInput" }
    StationImportRequest:
      type: object
      additionalProperties: false
      required: [version, stationTemplateIds]
      properties:
        version: { type: integer, minimum: 1 }
        stationTemplateIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
    EventStationUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        isAvailable: { type: boolean }
    StaffAssignmentRequest:
      oneOf:
        - $ref: "#/components/schemas/ScreenerStaffAssignmentRequest"
        - $ref: "#/components/schemas/GeneralStaffAssignmentRequest"
      discriminator:
        propertyName: assignmentRole
        mapping:
          SCREENER: "#/components/schemas/ScreenerStaffAssignmentRequest"
          EVENT_MANAGER: "#/components/schemas/GeneralStaffAssignmentRequest"
          REGISTRATION: "#/components/schemas/GeneralStaffAssignmentRequest"
          REVIEWER: "#/components/schemas/GeneralStaffAssignmentRequest"
          SUPPORT: "#/components/schemas/GeneralStaffAssignmentRequest"
    ScreenerStaffAssignmentRequest:
      type: object
      additionalProperties: false
      required: [version, userId, assignmentRole, eventStationId]
      properties:
        version: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        assignmentRole: { type: string, enum: [SCREENER] }
        eventStationId: { type: string, format: uuid }
    GeneralStaffAssignmentRequest:
      type: object
      additionalProperties: false
      required: [version, userId, assignmentRole]
      properties:
        version: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        assignmentRole: { type: string, enum: [EVENT_MANAGER, REGISTRATION, REVIEWER, SUPPORT] }
        eventStationId: { type: string, format: uuid, nullable: true }
    StaffAssignment:
      type: object
      additionalProperties: false
      required: [staffAssignmentId, assignmentRole, status, user]
      properties:
        staffAssignmentId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
        status: { $ref: "#/components/schemas/StaffAssignmentStatus" }
        notes: { type: string, nullable: true, maxLength: 500 }
        eventStation:
          type: object
          nullable: true
          additionalProperties: false
          required: [eventStationId, stationTemplateId, name, stationOrder]
          properties:
            eventStationId: { type: string, format: uuid }
            stationTemplateId: { type: string, format: uuid }
            name: { type: string }
            stationOrder: { type: integer, minimum: 1 }
        user:
          type: object
          additionalProperties: false
          required: [userId, username]
          properties:
            userId: { type: string, format: uuid }
            username: { type: string }
    ShiftAssignmentInput:
      type: object
      additionalProperties: false
      required: [userId, assignmentRole]
      properties:
        staffAssignmentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
        stationTemplateId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true, maxLength: 500 }
    User:
      type: object
      additionalProperties: false
      required: [userId, username, email, systemRole]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, sessionExpiresIn, csrfToken]
      properties:
        expiresIn: { type: integer, minimum: 0 }
        sessionExpiresIn: { type: integer, minimum: 0 }
        csrfToken: { type: string, minLength: 32, description: Rotated double-submit token; also set as the readable vsms_csrf cookie }
        returnTo: { type: string }
        user: { $ref: "#/components/schemas/User" }
    ShiftInput:
      type: object
      additionalProperties: false
      required: [name, startsAt, endsAt, requiredStaff]
      properties:
        shiftId: { type: string, format: uuid, description: Required only when editing an existing shift }
        name: { type: string, minLength: 1, maxLength: 100 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        requiredStaff: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        assignments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ShiftAssignmentInput" }
    Shift:
      allOf:
        - $ref: "#/components/schemas/ShiftInput"
        - type: object
          required: [shiftId, status, staffAssignments]
          properties:
            shiftId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/ShiftStatus" }
            staffAssignments: { type: array, items: { $ref: "#/components/schemas/StaffAssignment" } }
    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [name, venue, timezone, startsAt, endsAt, capacity]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, nullable: true, maxLength: 5000 }
        bannerKey: { $ref: "#/components/schemas/EventBannerKey" }
        artworkDataUrl:
          type: string
          nullable: true
          maxLength: 180000
          pattern: '^data:image/(jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$'
          description: Cropped square event artwork encoded as a bounded JPEG or WebP data URL
        venue: { type: string, minLength: 1, maxLength: 255 }
        address: { type: string, nullable: true, maxLength: 500 }
        postalCode: { type: string, nullable: true, pattern: '^\d{6}$' }
