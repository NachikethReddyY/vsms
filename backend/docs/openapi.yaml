    QrRevokeResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
        data: { $ref: "#/components/schemas/QrCode" }
    QrRenderResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
