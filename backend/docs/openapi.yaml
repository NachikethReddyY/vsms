      summary: Call an event-scoped queue entry
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/QueueId" }]
      responses: { "200": { description: Queue entry called, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/queues/events/{eventId}/entries/{queueId}/start:
    patch:
      tags: [Queue]
      operationId: startEventQueueEntry
      summary: Start an event-scoped queue entry
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/QueueId" }]
      responses: { "200": { description: Queue entry started, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/queues/events/{eventId}/entries/{queueId}/advance:
    patch:
      tags: [Queue]
      operationId: advanceEventQueueEntry
      summary: Advance an event-scoped queue entry
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/QueueId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdvanceQueueRequest" } } } }
      responses: { "200": { description: Participant transferred, content: { application/json: { schema: { $ref: "#/components/schemas/AdvanceQueueResponse" } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/queues/events/{eventId}/entries/{queueId}/complete:
    patch:
      tags: [Queue]
      operationId: completeEventQueueEntry
      summary: Complete an event-scoped queue entry
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/QueueId" }]
      responses: { "200": { description: Queue entry completed, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/queues/events/{eventId}/entries/{queueId}/skip:
    patch:
      tags: [Queue]
      operationId: skipEventQueueEntry
      summary: Skip an event-scoped queue entry
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/QueueId" }]
      responses: { "200": { description: Queue entry skipped, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/queues/events/{eventId}/entries/{queueId}:
    delete:
      tags: [Queue]
      operationId: leaveEventQueue
      summary: Cancel an event-scoped queue entry
      parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/QueueId" }]
      responses: { "200": { description: Queue entry cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /api/v1/queues/entries/{queueId}/call:
    patch:
      tags: [Queue]
      operationId: callQueueEntry
      summary: Call the next waiting participant in a station queue
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Queue entry called, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/queues/entries/{queueId}/start:
    patch:
      tags: [Queue]
      operationId: startQueueEntry
      summary: Begin servicing a called participant
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Queue entry started, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/queues/entries/{queueId}/advance:
    patch:
      tags: [Queue]
      operationId: advanceQueueEntry
      summary: Transfer a participant to the next station and close the current queue entry
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvanceQueueRequest" }
      responses:
        "200": { description: Participant transferred, content: { application/json: { schema: { $ref: "#/components/schemas/AdvanceQueueResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/queues/entries/{queueId}/complete:
    patch:
      tags: [Queue]
      operationId: completeQueueEntry
      summary: Complete the final queue station and mark the registration completed
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Queue entry completed, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/queues/entries/{queueId}/skip:
    patch:
      tags: [Queue]
      operationId: skipQueueEntry
      summary: Skip a waiting or called participant (does not advance them)
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Queue entry skipped, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/queues/entries/{queueId}:
    delete:
      tags: [Queue]
      operationId: leaveQueue
      summary: Remove a participant from the queue (cancels the entry)
      parameters:
        - name: queueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Queue entry cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/QueueEntry" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token kept in browser memory only
    refreshCookie:
      type: apiKey
      in: cookie
      name: vsms_refresh
    accessCookie:
      type: apiKey
      in: cookie
      name: vsms_access
      description: HttpOnly Cognito access token used for global session revocation
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountProviderOperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferralId:
      name: referralId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StationId:
      name: stationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsentId:
      name: consentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QrId:
      name: qrId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QrToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    EventLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ParticipantPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
      description: Must equal the `vsms_csrf` cookie; requests also require an allowed Origin
    ConditionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema: { type: string, minLength: 32 }
      description: Required when credential or CSRF cookies are present; must equal the `vsms_csrf` cookie and include an allowed Origin
  requestBodies:
    TransitionRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version]
            properties:
              version: { type: integer, minimum: 1 }
  responses:
    EventSuccess:
      description: Event transitioned and audited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Event" }
    BadRequest:
      description: Request body is malformed or provider envelope fields are inconsistent
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: Authentication is absent, invalid, expired, revoked, or reused
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Request origin, CSRF token, or permission is invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Resource is absent or intentionally concealed from the caller
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Stale version, illegal transition, or immutable state
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ValidationFailed:
      description: Request validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    InvalidCursor:
      description: Pagination cursor is malformed, expired, tampered with, or used against the wrong resource scope
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimited:
      description: Rate limit exceeded
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ScreeningPreview:
      description: Screening evaluation preview
      content: { application/json: { schema: { $ref: "#/components/schemas/ScreeningEvaluation" } } }
    ScreeningSaved:
      description: Screening result saved or replayed
      content: { application/json: { schema: { $ref: "#/components/schemas/ScreeningResult" } } }
  schemas:
    SystemRole:
      type: string
      enum: [ADMIN, EVENT_MANAGER, STAFF]
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED]
    EventBannerKey:
      type: string
      enum: [COMMUNITY_SCREENING, LIBRARY_SCREENING, EVENT_OPERATIONS]
    ShiftStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
    StaffAssignmentRole:
      type: string
      enum: [EVENT_MANAGER, REGISTRATION, SCREENER, REVIEWER, SUPPORT]
    StaffAssignmentStatus:
      type: string
      enum: [ASSIGNED, CONFIRMED, COMPLETED, CANCELLED]
    OverallFlag:
      type: string
      enum: [NORMAL, REVIEW, REFER, URGENT]
    ReviewOutcome:
      type: string
      enum: [COMPLETE, MONITOR, REFER, URGENT_ESCALATION]
    ClinicalUrgency:
      type: string
      enum: [ROUTINE, PRIORITY, URGENT, EMERGENCY]
    StaffDirectoryEntry:
      type: object
      additionalProperties: false
      required: [userId, username, systemRole, roles]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        systemRole: { $ref: "#/components/schemas/SystemRole" }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [ADMINISTRATOR, EVENT_MANAGER, REGISTRATION_OFFICER, SCREENER, REVIEWER, SUPPORT] }
    StationTemplate:
      type: object
      additionalProperties: false
      required: [stationTemplateId, templateKey, version, name, defaultCapacity]
      properties:
        stationTemplateId: { type: string, format: uuid }
        templateKey: { type: string, maxLength: 80 }
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true }
        defaultCapacity: { type: integer, minimum: 1, maximum: 1000 }
    EventStation:
      type: object
      additionalProperties: false
      required: [eventStationId, stationTemplateId, templateVersion, name, stationType, stationOrder, capacity, isAvailable, availabilities]
      properties:
        eventStationId: { type: string, format: uuid }
        stationTemplateId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 120 }
        stationType: { type: string, enum: [VISUAL_ACUITY, REFRACTION, COLOUR_VISION] }
        description: { type: string, nullable: true }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        isAvailable: { type: boolean }
        availabilities:
          type: array
          items: { $ref: "#/components/schemas/EventStationAvailability" }
    EventStationAvailability:
      type: object
      additionalProperties: false
      required: [eventStationAvailabilityId, isAvailable, capacity, eventDay]
      properties:
        eventStationAvailabilityId: { type: string, format: uuid }
        isAvailable: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        eventDay:
          type: object
          additionalProperties: false
          required: [eventDayId, date]
          properties:
            eventDayId: { type: string, format: uuid }
            date: { type: string, format: date }
    EventDayInput:
      type: object
      additionalProperties: false
      required: [date, startsAt, endsAt]
      properties:
        eventDayId: { type: string, format: uuid }
        date: { type: string, format: date }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    EventDay:
      allOf:
        - $ref: "#/components/schemas/EventDayInput"
        - type: object
          required: [eventDayId]
          properties:
            eventDayId: { type: string, format: uuid }
    StationAvailabilityInput:
      type: object
      additionalProperties: false
      required: [date, isAvailable, capacity]
      properties:
        date: { type: string, format: date }
        isAvailable: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
    EventStationInput:
      type: object
      additionalProperties: false
      required: [stationTemplateId, stationOrder, capacity, isAvailable, availabilities]
      properties:
        eventStationId: { type: string, format: uuid }
        stationTemplateId: { type: string, format: uuid }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        isAvailable: { type: boolean }
        availabilities:
          type: array
          maxItems: 31
          items: { $ref: "#/components/schemas/StationAvailabilityInput" }
    StationImportRequest:
      type: object
      additionalProperties: false
      required: [version, stationTemplateIds]
      properties:
        version: { type: integer, minimum: 1 }
        stationTemplateIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
    EventStationUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        stationOrder: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        isAvailable: { type: boolean }
    StaffAssignmentRequest:
      oneOf:
        - $ref: "#/components/schemas/ScreenerStaffAssignmentRequest"
        - $ref: "#/components/schemas/GeneralStaffAssignmentRequest"
      discriminator:
        propertyName: assignmentRole
        mapping:
          SCREENER: "#/components/schemas/ScreenerStaffAssignmentRequest"
          EVENT_MANAGER: "#/components/schemas/GeneralStaffAssignmentRequest"
          REGISTRATION: "#/components/schemas/GeneralStaffAssignmentRequest"
          REVIEWER: "#/components/schemas/GeneralStaffAssignmentRequest"
          SUPPORT: "#/components/schemas/GeneralStaffAssignmentRequest"
    ScreenerStaffAssignmentRequest:
      type: object
      additionalProperties: false
      required: [version, userId, assignmentRole, eventStationId]
      properties:
        version: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        assignmentRole: { type: string, enum: [SCREENER] }
        eventStationId: { type: string, format: uuid }
    GeneralStaffAssignmentRequest:
      type: object
      additionalProperties: false
      required: [version, userId, assignmentRole]
      properties:
        version: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        assignmentRole: { type: string, enum: [EVENT_MANAGER, REGISTRATION, REVIEWER, SUPPORT] }
        eventStationId: { type: string, format: uuid, nullable: true }
    StaffAssignment:
      type: object
      additionalProperties: false
      required: [staffAssignmentId, assignmentRole, status, user]
      properties:
        staffAssignmentId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
        status: { $ref: "#/components/schemas/StaffAssignmentStatus" }
        notes: { type: string, nullable: true, maxLength: 500 }
        eventStation:
          type: object
          nullable: true
          additionalProperties: false
          required: [eventStationId, stationTemplateId, name, stationOrder]
          properties:
            eventStationId: { type: string, format: uuid }
            stationTemplateId: { type: string, format: uuid }
            name: { type: string }
            stationOrder: { type: integer, minimum: 1 }
        user:
          type: object
          additionalProperties: false
          required: [userId, username]
          properties:
            userId: { type: string, format: uuid }
            username: { type: string }
    ShiftAssignmentInput:
      type: object
      additionalProperties: false
      required: [userId, assignmentRole]
      properties:
        staffAssignmentId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        assignmentRole: { $ref: "#/components/schemas/StaffAssignmentRole" }
        stationTemplateId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true, maxLength: 500 }
    AccountApprovalState:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    AccountAccessState:
      type: string
      enum: [ENABLED, SUSPENDED, DISABLED]
    ProfessionalCategory:
      type: string
      enum: [STAFF, DOCTOR]
    EventMembershipRoleType:
      type: string
      enum: [EVENT_MANAGER, REGISTRATION, SCREENER, REVIEWER, SUPPORT]
    EventMembershipRequest:
      type: object
      additionalProperties: false
      required: [userId, roles]
      properties:
        userId: { type: string, format: uuid }
        roles:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: "#/components/schemas/EventMembershipRoleType" }
    EventMembershipRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties: { role: { $ref: "#/components/schemas/EventMembershipRoleType" } }
    MembershipRemovalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
    EventMemberUser:
      type: object
      additionalProperties: false
      required: [id, fullName, email, approvalState, accessState, status]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        approvalState: { $ref: "#/components/schemas/AccountApprovalState" }
        accessState: { $ref: "#/components/schemas/AccountAccessState" }
        status: { type: string, enum: [ACTIVE, INACTIVE, DISABLED, SUSPENDED] }
        professionalCategory: { type: string, nullable: true, enum: [STAFF, DOCTOR] }
    EventMembershipDetail:
      type: object
      additionalProperties: false
      required: [membershipId, eventId, userId, status, addedAt, user, roles]
      properties:
        membershipId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, REMOVED] }
        addedAt: { type: string, format: date-time }
        removedAt: { type: string, format: date-time, nullable: true }
        removalReason: { type: string, nullable: true, maxLength: 500 }
        user: { $ref: "#/components/schemas/EventMemberUser" }
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, role, assignedAt, assignedById]
            properties:
              id: { type: string, format: uuid }
              role: { $ref: "#/components/schemas/EventMembershipRoleType" }
              assignedAt: { type: string, format: date-time }
              assignedById: { type: string, format: uuid }
    EventMembershipListResponse:
      type: object
      additionalProperties: false
      required: [memberships]
      properties: { memberships: { type: array, items: { $ref: "#/components/schemas/EventMembershipDetail" } } }
    EligibleEventUsersResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, fullName, email, eventMemberships]
            properties:
              id: { type: string, format: uuid }
              fullName: { type: string }
              email: { type: string, format: email }
              professionalCategory: { type: string, nullable: true, enum: [STAFF, DOCTOR] }
              eventMemberships: { type: array, items: { type: object, additionalProperties: true } }
    AccountProviderOperationStatus:
