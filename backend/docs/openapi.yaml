      description: Recovers expired leases, respects per-account generation order and retry backoff, and escalates operations after the bounded attempt limit. Freshly owned operations are reported as pending rather than executed concurrently.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountProviderDrainRequest" } } }
      responses:
        "200": { description: Audited drain summary, content: { application/json: { schema: { $ref: "#/components/schemas/AccountProviderDrainResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
