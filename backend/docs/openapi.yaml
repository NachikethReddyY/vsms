    post:
      tags: [Administration]
      operationId: requeueAccountProviderOperation
      summary: Requeue an escalated account identity-provider operation as a new ordered generation
      description: Preserves the escalated source and its failure evidence as administratively handled. Requeue is rejected when a newer generation already supersedes the source.
      parameters: [{ $ref: "#/components/parameters/AccountProviderOperationId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountProviderOperationMaintenanceRequest" } } }
      responses:
        "200": { description: Requeued provider operation completed, content: { application/json: { schema: { $ref: "#/components/schemas/AccountProviderOperationRequeueResponse" } } } }
        "202": { description: Requeued provider operation remains queued or owned, content: { application/json: { schema: { $ref: "#/components/schemas/AccountProviderOperationRequeueResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { description: Requeued provider operation escalated again for administrator attention }
