        odCorrect: { type: integer, minimum: 0, maximum: 24 }
        osCorrect: { type: integer, minimum: 0, maximum: 24 }
    ColourVisionPreviewRequest:
      type: object
      additionalProperties: false
      required: [resultData]
      properties: { resultData: { $ref: "#/components/schemas/ColourVisionResultData" } }
    ColourVisionSaveRequest:
      type: object
      additionalProperties: false
      required: [registrationId, idempotencyKey, acknowledged, resultData]
      properties:
        registrationId: { type: string, format: uuid }
