openapi: 3.0.3
info:
  title: VSMS Secure Staff Registration API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
components:
  securitySchemes:
    staffCookie:
      type: apiKey
      in: cookie
      name: vsms_access
  parameters:
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing, invalid, or expired Cognito access token
    Forbidden:
      description: Cognito group or active local role does not authorize access
security:
  - staffCookie: []
paths:
  /auth/login:
    post:
      security: []
      summary: Start Cognito password authentication and required first-login/MFA challenges
      responses:
        "200": { description: Authenticated; HttpOnly session cookies set }
        "202": { description: Permanent-password, MFA enrollment, or MFA verification challenge required }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/respond-to-challenge:
    post:
      security: []
      summary: Complete a Cognito permanent-password or MFA challenge
      responses:
        "200": { description: Authenticated; HttpOnly session cookies set }
        "202": { description: Another first-login challenge must be completed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      security: []
      summary: Refresh the HttpOnly Cognito session
      responses:
        "200": { description: Session refreshed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      summary: Revoke Cognito tokens and clear session cookies
      responses:
        "200": { description: Logged out }
  /auth/me:
    get:
      summary: Return verified active staff profile and effective roles
      responses:
        "200": { description: Current staff profile }
  /auth/change-password:
    post:
      summary: Change Cognito password
      responses:
        "200": { description: Password changed }
  /auth/forgot-password:
    post:
      security: []
      summary: Request Cognito recovery code
      responses:
        "200": { description: Generic recovery response }
  /auth/confirm-forgot-password:
    post:
      security: []
      summary: Confirm Cognito password recovery
      responses:
        "200": { description: Password reset }
  /events/active:
    get:
      summary: List events currently open for registration with counts
      responses:
        "200": { description: Active events }
  /events/{eventId}/registrations:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      summary: Idempotently register a participant
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      responses:
        "201": { description: Registration created with registrationId, reference, queue and status }
        "200": { description: Existing result returned for an idempotent replay }
        "409": { description: Duplicate registration or conflicting idempotency key }
    get:
      summary: List registrations for an event
      responses:
        "200": { description: Paginated registrations }
  /participants:
    get:
      summary: Search participants; at least one bounded criterion is required
      parameters:
        - { name: participantReference, in: query, schema: { type: string, minLength: 3 } }
        - { name: name, in: query, schema: { type: string, minLength: 3 } }
        - { name: contactNumber, in: query, schema: { type: string, minLength: 3 } }
        - { name: dateOfBirth, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Paginated masked participant matches }
        "400": { description: Invalid or unrestricted search }
    post:
      summary: Create participant with server-generated reference
      responses:
        "201": { description: Participant created }
  /participants/{participantId}:
    parameters:
      - $ref: "#/components/parameters/ParticipantId"
    get:
      summary: Get participant
      responses:
        "200": { description: Participant }
    patch:
      summary: Validate and update participant
      responses:
        "200": { description: Participant updated }
  /participants/{participantId}/emergency-contacts:
    parameters:
      - $ref: "#/components/parameters/ParticipantId"
    get:
      summary: List emergency contacts including preserved removed records
      responses:
        "200": { description: Emergency contacts }
    post:
      summary: Add emergency contact
      responses:
        "201": { description: Contact created }
  /emergency-contacts/{contactId}:
    patch:
      summary: Update, reprioritize, or mark an emergency contact removed
      parameters:
        - name: contactId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Contact updated }
  /consent-forms/active:
    get:
      summary: Return the current effective consent form
      responses:
        "200": { description: Active version and complete content }
  /participants/{participantId}/consents:
    parameters:
      - $ref: "#/components/parameters/ParticipantId"
    get:
      summary: List immutable consent evidence and withdrawals
      responses:
        "200": { description: Consent history }
    post:
      summary: Record accepted or declined consent
      responses:
        "201": { description: Consent recorded }
  /participants/{participantId}/consents/{consentId}/withdraw:
    post:
      summary: Append a withdrawal while preserving original consent evidence
      parameters:
        - $ref: "#/components/parameters/ParticipantId"
        - name: consentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Withdrawal recorded }
  /participants/{participantId}/registrations:
    get:
      summary: List participant registration history
      parameters:
        - $ref: "#/components/parameters/ParticipantId"
      responses:
        "200": { description: Registrations and status history }
  /registrations/{registrationId}:
    get:
      summary: Return a registration confirmation result
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200": { description: Registration }
  /registrations/{registrationId}/history:
    get:
      summary: Return append-only registration status history
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200": { description: Status history }
  /qr/registrations/{registrationId}:
    post:
      summary: Create a secure QR pass using only the registration ID handoff
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "201": { description: QR image and expiry }
