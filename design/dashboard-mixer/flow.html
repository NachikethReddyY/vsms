<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VSMS dashboard concept: Participant flow board</title>
  <style>
    :root {
      --canvas: #F7F7F4;
      --canvas-soft: #FAFAF7;
      --surface: #FFFFFF;
      --surface-2: #F2F1EC;
      --surface-3: #ECEAE4;
      --hairline: #E6E5E0;
      --hairline-soft: #EFEEE8;
      --hairline-strong: #CFCDC4;
      --ink: #26251E;
      --ink-2: #5A5852;
      --muted: #807D72;
      --muted-soft: #A09C92;
      --accent: #2563EB;
      --accent-strong: #1D4ED8;
      --accent-tint: rgba(37,99,235,0.10);
      --accent-ink: #FFFFFF;
      --focus: #2563EB;
      --green: #1F8A65;
      --amber: #B45309;
      --orange: #C2410C;
      --red: #CF2D56;
      --radius-control: 8px;
      --radius-panel: 12px;
      --shadow: 0 8px 30px rgba(38,37,30,0.08);
      --transition: 140ms ease-out;
    }

    [data-concept="flow"][data-theme="dark"] {
      --canvas: #100F0D;
      --canvas-soft: #141310;
      --surface: #1A1916;
      --surface-2: #22211D;
      --surface-3: #2A2924;
      --hairline: rgba(237,235,228,0.09);
      --hairline-soft: rgba(237,235,228,0.06);
      --hairline-strong: rgba(237,235,228,0.18);
      --ink: #EDEBE4;
      --ink-2: #B0ACA2;
      --muted: #8A867C;
      --muted-soft: #6B6860;
      --accent: #93C5FD;
      --accent-strong: #BFDBFE;
      --accent-tint: rgba(147,197,253,0.16);
      --accent-ink: #0B1220;
      --focus: #93C5FD;
      --green: #3FA37F;
      --amber: #D9964A;
      --orange: #E07B4C;
      --red: #E05C7E;
      --shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    [data-concept="flow"] {
      font-family: "Geist", "Geist Sans", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
      background: var(--canvas);
      min-height: 100dvh;
    }

    [data-concept="flow"] * { box-sizing: border-box; }
    [data-concept="flow"] h1, [data-concept="flow"] h2, [data-concept="flow"] h3, [data-concept="flow"] h4, [data-concept="flow"] p { margin: 0; }

    [data-concept="flow"] .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
      white-space: nowrap;
    }

    [data-concept="flow"] button,
    [data-concept="flow"] input,
    [data-concept="flow"] select {
      font: inherit;
      color: inherit;
      border-radius: var(--radius-control);
      border: 1px solid var(--hairline);
      background: var(--surface);
      min-height: 44px;
    }

    [data-concept="flow"] button {
      cursor: pointer;
      transition: border-color var(--transition), background-color var(--transition), color var(--transition), transform 80ms ease;
    }

    [data-concept="flow"] button:active { transform: scale(0.97); }

    [data-concept="flow"] :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    [data-concept="flow"] .flow-shell {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 252px 1fr 312px;
      gap: 12px;
      padding: 12px;
      max-width: 1540px;
      margin: 0 auto;
    }

    [data-concept="flow"] .flow-region {
      border: 1px solid var(--hairline);
      border-radius: var(--radius-panel);
      background: var(--surface);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    [data-concept="flow"] .flow-region-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    [data-concept="flow"] .flow-region-label {
      font-weight: 600;
      letter-spacing: -0.01em;
      font-size: 14px;
      color: var(--ink);
    }

    [data-concept="flow"] .flow-region-subtle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    [data-concept="flow"] .flow-mix-button {
      min-height: 36px;
      height: 36px;
      padding: 0 11px;
      border: 1px solid var(--hairline-soft);
      background: var(--canvas);
      color: var(--muted);
      border-radius: 999px;
      font-size: 12px;
    }

    [data-concept="flow"] .flow-mix-button:hover {
      border-color: var(--hairline-strong);
      color: var(--ink);
    }

    [data-concept="flow"] .flow-nav-shell {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    [data-concept="flow"] .flow-event-switch {
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      width: 100%;
      border-radius: var(--radius-control);
      border-color: var(--hairline-strong);
      background: var(--surface-2);
    }

    [data-concept="flow"] .flow-event-switch .title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    [data-concept="flow"] .flow-event-switch .meta {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    [data-concept="flow"] .flow-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      margin-left: auto;
      flex: 0 0 auto;
    }

    [data-concept="flow"] .flow-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 0;
      overflow: auto;
      padding-bottom: 2px;
    }

    [data-concept="flow"] .flow-nav-item {
      min-height: 44px;
      border-radius: var(--radius-control);
      border: 1px solid transparent;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: transparent;
      color: var(--ink-2);
      text-align: left;
      gap: 8px;
      font-size: 13px;
    }

    [data-concept="flow"] .flow-nav-item:hover {
      background: var(--surface-2);
      border-color: var(--hairline-soft);
    }

    [data-concept="flow"] .flow-nav-item.active {
      color: var(--ink);
      border-color: var(--accent-tint);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      font-weight: 600;
      position: relative;
    }

    [data-concept="flow"] .flow-nav-item.active::before {
      content: "";
      position: absolute;
      left: -13px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    [data-concept="flow"] .flow-nav-item .count {
      color: var(--muted);
      font-size: 12px;
    }

    [data-concept="flow"] .flow-foot-note {
      margin-top: auto;
      border-top: 1px solid var(--hairline);
      padding-top: 10px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    [data-concept="flow"] .flow-conn {
      border: 1px solid var(--hairline-soft);
      background: var(--surface-2);
      border-radius: var(--radius-control);
      min-height: 44px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    [data-concept="flow"] .flow-conn .state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--ink-2);
    }

    [data-concept="flow"] .flow-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    [data-concept="flow"] .flow-dot.ok { background: var(--green); }
    [data-concept="flow"] .flow-dot.warn { background: var(--amber); }
    [data-concept="flow"] .flow-dot.alert { background: var(--orange); }
    [data-concept="flow"] .flow-dot.bad { background: var(--red); }

    [data-concept="flow"] .flow-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    [data-concept="flow"] .flow-context {
      padding: 12px;
    }

    [data-concept="flow"] .flow-title {
      font-size: 20px;
      line-height: 1.18;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    [data-concept="flow"] .flow-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    [data-concept="flow"] .flow-header-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    [data-concept="flow"] .flow-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    [data-concept="flow"] .flow-input {
      min-width: 220px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--hairline-strong);
      border-radius: var(--radius-control);
      background: var(--canvas);
      padding: 0 10px;
      gap: 8px;
      min-height: 44px;
      flex: 1;
      max-width: 420px;
    }

    [data-concept="flow"] .flow-input input {
      border: 0;
      background: transparent;
      flex: 1;
      width: 100%;
      min-height: 100%;
      outline: none;
      color: var(--ink);
    }

    [data-concept="flow"] .flow-input input::placeholder {
      color: var(--muted-soft);
    }

    [data-concept="flow"] .flow-chip {
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0 12px;
      min-height: 44px;
      white-space: nowrap;
      color: var(--ink-2);
      background: var(--canvas);
      font-size: 12px;
    }

    [data-concept="flow"] .flow-chip.sync {
      border-color: var(--amber);
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 8%, transparent);
      border-style: solid;
    }

    [data-concept="flow"] .flow-state-note {
      margin-top: 10px;
      border: 1px dashed var(--hairline-strong);
      color: var(--muted);
      border-radius: var(--radius-control);
      padding: 8px 10px;
      font-size: 12px;
      display: none;
    }

    [data-concept="flow"] .flow-state-note[data-demo-state="loading"],
    [data-concept="flow"] .flow-state-note[data-demo-state="error"],
    [data-concept="flow"] .flow-state-note[data-demo-state="offline"] {
      display: block;
    }

    [data-concept="flow"] .flow-state-note.state-offline {
      color: var(--red);
      border-color: color-mix(in srgb, var(--red) 30%, var(--surface));
      background: color-mix(in srgb, var(--red) 8%, transparent);
    }

    [data-concept="flow"] .flow-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    [data-concept="flow"] .metric {
      border: 1px solid var(--hairline-soft);
      border-radius: var(--radius-panel);
      background: var(--surface);
      padding: 9px 10px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    [data-concept="flow"] .metric-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    [data-concept="flow"] .metric-value {
      font-size: 28px;
      font-weight: 600;
      line-height: 1;
    }

    [data-concept="flow"] .metric-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    [data-concept="flow"] .metric-value.critical { color: var(--red); }
    [data-concept="flow"] .metric-value.warn { color: var(--amber); }
    [data-concept="flow"] .metric-value.good { color: var(--green); }

    [data-concept="flow"] .flow-workspace {
      min-height: 460px;
    }

    [data-concept="flow"] .flow-toolbar2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }

    [data-concept="flow"] .flow-toolbar2 .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    [data-concept="flow"] .flow-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      align-items: start;
      min-height: 0;
      overflow: auto;
    }

    [data-concept="flow"] .flow-lane {
      border: 1px solid var(--hairline-soft);
      border-radius: var(--radius-control);
      min-height: 360px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    [data-concept="flow"] .flow-lane-head {
      padding: 9px 10px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface-2);
      font-size: 12px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    [data-concept="flow"] .flow-lane-title {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-weight: 600;
      color: var(--ink);
    }

    [data-concept="flow"] .flow-lane-count {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    [data-concept="flow"] .flow-lane-meta {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    [data-concept="flow"] .flow-lane-body {
      list-style: none;
      margin: 0;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      overflow: auto;
    }

    [data-concept="flow"] .flow-card {
      border: 1px solid var(--hairline-strong);
      border-radius: var(--radius-control);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
    }

    [data-concept="flow"] .flow-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-tint);
    }

    [data-concept="flow"] .flow-card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    [data-concept="flow"] .flow-card-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 1px;
    }

    [data-concept="flow"] .flow-card-meta {
      font-size: 11px;
      color: var(--muted);
    }

    [data-concept="flow"] .flow-card-sub {
      font-size: 12px;
      color: var(--ink-2);
    }

    [data-concept="flow"] .flow-status {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      border-radius: 999px;
      height: 24px;
      border: 1px solid transparent;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    [data-concept="flow"] .status-normal {
      border-color: color-mix(in srgb, var(--green) 40%, transparent);
      color: var(--green);
      background: color-mix(in srgb, var(--green) 8%, transparent);
    }

    [data-concept="flow"] .status-review {
      border-color: color-mix(in srgb, var(--amber) 45%, transparent);
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 10%, transparent);
    }

    [data-concept="flow"] .status-refer {
      border-color: color-mix(in srgb, var(--orange) 45%, transparent);
      color: var(--orange);
      background: color-mix(in srgb, var(--orange) 10%, transparent);
    }

    [data-concept="flow"] .status-urgent {
      border-color: color-mix(in srgb, var(--red) 45%, transparent);
      color: var(--red);
      background: color-mix(in srgb, var(--red) 10%, transparent);
    }

    [data-concept="flow"] .flow-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    [data-concept="flow"] .flow-action {
      min-height: 44px;
      padding: 0 10px;
      border-radius: var(--radius-control);
      border: 1px solid var(--hairline);
      background: var(--canvas);
      font-size: 12px;
      color: var(--ink-2);
    }

    [data-concept="flow"] .flow-action.primary {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }

    [data-concept="flow"] .flow-empty,
    [data-concept="flow"] .flow-error,
    [data-concept="flow"] .flow-loading {
      border: 1px dashed var(--hairline-strong);
      border-radius: var(--radius-control);
      min-height: 84px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 8px;
      margin: 6px 0;
    }

    [data-concept="flow"] .flow-error {
      border-color: color-mix(in srgb, var(--red) 40%, var(--surface));
      color: var(--red);
      background: color-mix(in srgb, var(--red) 8%, transparent);
    }

    [data-concept="flow"] .flow-loading {
      color: var(--muted);
      border-color: color-mix(in srgb, var(--ink) 18%, transparent);
      background: color-mix(in srgb, var(--canvas) 80%, transparent);
    }

    [data-concept="flow"] .flow-support {
      min-height: 0;
      gap: 10px;
      overflow: auto;
    }

    [data-concept="flow"] .support-list,
    [data-concept="flow"] .event-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    [data-concept="flow"] .support-item,
    [data-concept="flow"] .activity-item,
    [data-concept="flow"] .audit-item,
    [data-concept="flow"] .referral-item {
      border: 1px solid var(--hairline-soft);
      border-radius: var(--radius-control);
      padding: 8px;
      min-height: 44px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      flex-direction: column;
    }

    [data-concept="flow"] .support-item .name,
    [data-concept="flow"] .support-item .role {
      font-size: 12px;
    }

    [data-concept="flow"] .support-item .name {
      font-weight: 600;
    }

    [data-concept="flow"] .support-item .role,
    [data-concept="flow"] .support-item .station {
      color: var(--muted);
      font-size: 11px;
    }

    [data-concept="flow"] .support-foot-note {
      border-top: 1px solid var(--hairline);
      padding-top: 10px;
      color: var(--muted);
      font-size: 11px;
      min-height: auto;
    }

    [data-concept="flow"] .activity-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    [data-concept="flow"] .activity-section h4,
    [data-concept="flow"] .support-section h4 {
      font-size: 13px;
      margin-bottom: 7px;
      letter-spacing: -0.01em;
    }

    [data-concept="flow"] .activity-item,
    [data-concept="flow"] .audit-item,
    [data-concept="flow"] .referral-item {
      background: var(--surface-2);
      min-height: 44px;
      color: var(--ink);
    }

    [data-concept="flow"] .activity-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    [data-concept="flow"] .activity-copy {
      font-size: 12px;
      color: var(--ink-2);
    }

    [data-concept="flow"] .flow-notice {
      border-radius: var(--radius-control);
      border: 1px solid var(--hairline-soft);
      padding: 10px;
      font-size: 12px;
      color: var(--ink-2);
      background: var(--surface-2);
    }

    [data-concept="flow"] .flow-notice.important {
      border-color: color-mix(in srgb, var(--amber) 40%, transparent);
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 10%, transparent);
    }

    [data-concept="flow"] .timeline-note {
      margin-top: auto;
      border-top: 1px solid var(--hairline);
      padding-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    [data-concept="flow"] [data-demo-state="loading"] .flow-demo-offline,
    [data-concept="flow"] [data-demo-state="error"] .flow-demo-offline,
    [data-concept="flow"] [data-demo-state="empty"] .flow-demo-offline { display: none; }

    [data-concept="flow"] .lane-urgent {
      border-color: color-mix(in srgb, var(--red) 45%, transparent);
    }

    [data-concept="flow"] .lane-review {
      border-color: color-mix(in srgb, var(--amber) 45%, transparent);
    }

    [data-concept="flow"] .flow-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
    }

    [data-concept="flow"] .flow-legend span {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      color: var(--muted);
      border: 1px solid var(--hairline-soft);
      border-radius: 999px;
      padding: 0 8px;
      min-height: 24px;
    }

    [data-concept="flow"] .flow-legend b {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      display: inline-block;
    }

    [data-concept="flow"] .flow-legend .norm { color: var(--green); }
    [data-concept="flow"] .flow-legend .norm b { background: var(--green); }
    [data-concept="flow"] .flow-legend .rev b { background: var(--amber); color: var(--amber); }
    [data-concept="flow"] .flow-legend .ref b { background: var(--orange); }
    [data-concept="flow"] .flow-legend .urg b { background: var(--red); }

    [data-concept="flow"] .state-offline [data-region="supporting-rail"],
    [data-concept="flow"] .state-offline [data-region="activity-compliance"] {
      border-color: color-mix(in srgb, var(--red) 35%, transparent);
    }

    [data-concept="flow"] .flow-mobile-state {
      display: none;
      font-size: 11px;
      color: var(--muted);
    }

    [data-concept="flow"][data-demo-state="error"] .flow-workspace::after {
      content: "Failed to refresh one station queue. Review lane remains unchanged and will retry automatically.";
      display: block;
      margin-top: 10px;
      border: 1px solid color-mix(in srgb, var(--red) 36%, transparent);
      background: color-mix(in srgb, var(--red) 8%, transparent);
      color: var(--red);
      border-radius: var(--radius-control);
      padding: 10px;
      font-size: 12px;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="loading"] .flow-lane-body li {
      display: none;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="loading"] .flow-lane-body::after,
    [data-concept="flow"] .flow-workspace[data-demo-state="loading"] .flow-lane-body .flow-loading {
      content: "";
      display: block;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="loading"] .flow-lane-body {
      min-height: 80px;
      justify-content: center;
      align-items: stretch;
      gap: 6px;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="loading"] .flow-lane-body::before {
      content: "Loading participant cards…";
      border: 1px dashed var(--hairline-strong);
      border-radius: var(--radius-control);
      min-height: 68px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      width: 100%;
      text-align: center;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="empty"] .flow-lane-body {
      justify-content: center;
      align-items: stretch;
      min-height: 140px;
      color: var(--muted);
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="empty"] .flow-lane-body::before {
      content: "No participants in the filtered view.";
      border: 1px dashed var(--hairline-soft);
      border-radius: var(--radius-control);
      min-height: 68px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      width: 100%;
      text-align: center;
      padding: 8px;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="offline"] .flow-event-switch {
      border-color: color-mix(in srgb, var(--red) 35%, var(--surface));
    }

    [data-concept="flow"] .state-offline-notice {
      display: none;
      border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
      color: var(--red);
      background: color-mix(in srgb, var(--red) 8%, transparent);
      border-radius: var(--radius-control);
      padding: 10px;
      font-size: 12px;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="offline"] .state-offline-notice {
      display: block;
    }

    [data-concept="flow"] .state-demo-empty {
      display: none;
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }

    [data-concept="flow"] .flow-workspace[data-demo-state="empty"] .state-demo-empty {
      display: inline;
    }

    [data-concept="flow"] [data-demo-state="empty"] .lane-review,
    [data-concept="flow"] [data-demo-state="empty"] .lane-urgent { display: none; }

    [data-concept="flow"] .flow-demo-state-select {
      min-width: 160px;
      border-radius: var(--radius-control);
      border: 1px solid var(--hairline);
      background: var(--canvas);
      padding: 0 12px;
      font-size: 12px;
      color: var(--ink-2);
      min-height: 44px;
    }

    @media (max-width: 1280px) {
      [data-concept="flow"] .flow-shell {
        grid-template-columns: 212px minmax(0, 1fr);
      }

      [data-concept="flow"] .flow-support {
        grid-column: 1 / -1;
      }

      [data-concept="flow"] .flow-metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      [data-concept="flow"] .flow-board {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      [data-concept="flow"] .flow-shell {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 8px;
      }

      [data-concept="flow"] .flow-support {
        min-height: 0;
      }

      [data-concept="flow"] .flow-nav-shell {
        order: 2;
      }

      [data-concept="flow"] .flow-metrics-grid {
        grid-template-columns: 1fr 1fr;
      }

      [data-concept="flow"] .flow-board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      [data-concept="flow"] .flow-region {
        padding: 10px;
      }

      [data-concept="flow"] .flow-title {
        font-size: 18px;
      }

      [data-concept="flow"] .flow-mix-button {
        min-height: 44px;
      }

      [data-concept="flow"] .flow-mobile-state {
        display: inline;
      }
    }

    @media (max-width: 720px) {
      [data-concept="flow"] .flow-shell {
        grid-template-columns: 1fr;
      }

      [data-concept="flow"] .flow-board {
        grid-template-columns: 1fr;
      }

      [data-concept="flow"] .flow-metrics-grid,
      [data-concept="flow"] .flow-toolbar,
      [data-concept="flow"] .flow-toolbar2 {
        grid-template-columns: 1fr;
        display: flex;
        flex-wrap: wrap;
      }

      [data-concept="flow"] .flow-main {
        order: 1;
      }

      [data-concept="flow"] .flow-nav-shell {
        order: 3;
      }

      [data-concept="flow"] .flow-support {
        order: 4;
      }

      [data-concept="flow"] .flow-chip {
        min-height: 44px;
      }

      [data-concept="flow"] .flow-input,
      [data-concept="flow"] .flow-demo-state-select {
        flex: 1 1 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      [data-concept="flow"] *,
      [data-concept="flow"] *::before,
      [data-concept="flow"] *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      [data-concept="flow"] button:active {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="dashboard-flow-fragment" data-concept="flow" data-source="flow" data-theme="light" data-demo-state="live">
    <template data-region="navigation-shell" data-source="flow">
      <section class="flow-region flow-nav-shell">
        <div class="flow-region-head">
          <div>
            <p class="flow-region-label">Navigation shell</p>
            <p class="flow-region-subtle">Main menu and event context</p>
          </div>
          <button type="button" class="flow-mix-button" data-region="navigation-shell" data-source="flow">Use in mix</button>
        </div>

        <button class="flow-event-switch" type="button" aria-label="Current event">
          <div>
            <div class="title" data-bind="event.name">Northside Community Screening</div>
            <div class="meta"><span data-bind="event.date"></span> · <span data-bind="event.venue"></span></div>
          </div>
          <span class="flow-live-dot" aria-hidden="true"></span>
        </button>

        <nav aria-label="Dashboard sections">
          <ul class="flow-nav-list">
            <li><button class="flow-nav-item active"><span>Live operations</span><span class="count" data-bind="counts.queue">18</span></button></li>
            <li><button class="flow-nav-item"><span>Registration</span><span class="count" data-bind="stages.registration.count">22</span></button></li>
            <li><button class="flow-nav-item"><span>Screening queue</span><span class="count" data-bind="counts.waiting">18</span></button></li>
            <li><button class="flow-nav-item"><span>Clinical review</span><span class="count" data-bind="counts.review">12</span></button></li>
            <li><button class="flow-nav-item"><span>Referrals</span><span class="count" data-bind="counts.referrals">3</span></button></li>
            <li><button class="flow-nav-item"><span>Sync centre</span><span class="count" data-bind="sync.pendingSync">4</span></button></li>
            <li><button class="flow-nav-item"><span>Audit logs</span><span class="count" data-bind="counts.audit">8</span></button></li>
          </ul>
        </nav>

        <div class="flow-foot-note">
          <button class="flow-conn" type="button">
            <span class="state"><span class="flow-dot ok"></span><span data-bind="sync.label">Connected</span></span>
            <strong data-bind="sync.lastSynced">Synced 2 min ago</strong>
          </button>
          <div>Staffer · <span data-bind="staffing.lead">Maya Chen, lead screener</span></div>
          <div>Theme · <span data-theme-state>Light</span></div>
        </div>
      </section>
    </template>

    <template data-region="event-context-header" data-source="flow">
      <section class="flow-region flow-context">
        <div class="flow-region-head">
          <div>
            <p class="flow-region-label">Event / context header</p>
            <p class="flow-region-subtle">Event operations and workflow control</p>
          </div>
          <button type="button" class="flow-mix-button" data-region="event-context-header" data-source="flow">Use in mix</button>
        </div>

        <div>
          <p class="flow-title" data-bind="event.name">Northside Community Screening</p>
          <p class="flow-subtitle"><span data-bind="event.date">Tue 19 Jul 2026 · 08:45–16:30</span> · <span data-bind="event.venue">Northside Community Hall</span> · <strong>Live</strong> · Queue size: <span data-bind="counts.waiting">18</span></p>
        </div>

        <div class="flow-header-row">
          <div>
            <div class="flow-subtitle">Capacity: <span data-bind="stages.registration.capacity">4</span> screening stations running, <span data-bind="stages.visualAcuity.capacity">3</span> active lanes — pace target 52 participants/hour.</div>
            <div class="flow-subtitle">Language note: rule recommendations are not clinical decisions. Reviewer confirms outcome before finalising records.</div>
          </div>
          <span class="flow-mobile-state">Mobile fallback: stacked lanes, rail below main panel, 44px controls.</span>
        </div>

        <div class="flow-toolbar" aria-label="Context actions">
          <label class="flow-input" for="flow-search">
            <span aria-hidden="true">⌕</span>
            <input id="flow-search" type="search" placeholder="Search participants, IDs, queue numbers" data-control="search" />
          </label>
          <button class="flow-chip" type="button" data-action="toggle-urgent-first">Urgent-first sort</button>
          <button class="flow-chip" type="button" data-action="toggle-theme" data-theme-button="true">Theme</button>
          <button class="flow-chip" type="button" data-action="jump-board">Open clinical review</button>
          <select class="flow-demo-state-select" aria-label="Demo state selector" data-control="demo-state">
            <option value="live">Live</option>
            <option value="loading">Loading</option>
            <option value="empty">Empty</option>
            <option value="error">Error</option>
            <option value="offline">Offline / offline-safe</option>
          </select>
        </div>

        <p class="flow-state-note state-offline" data-state-note="offline" data-demo-state="offline">Saved safely on this device. Records will synchronise when the connection returns.</p>
        <p class="flow-state-note" data-state-note="loading" data-demo-state="loading">Loading queue rows and clinical flags. Last successful read: <strong data-bind="sync.lastSynced">2 min ago</strong>.</p>
        <p class="flow-state-note" data-state-note="error" data-demo-state="error">Temporary queue sync error. Pending actions are queued locally and will retry automatically.</p>
      </section>
    </template>

    <template data-region="headline-metrics" data-source="flow">
      <section class="flow-region">
        <div class="flow-region-head">
          <div>
            <p class="flow-region-label">Headline metrics</p>
            <p class="flow-region-subtle">Snapshot across registration to review</p>
          </div>
          <button type="button" class="flow-mix-button" data-region="headline-metrics" data-source="flow">Use in mix</button>
        </div>
        <div class="flow-metrics-grid">
          <div class="metric"><div><div class="metric-label">Registered</div><div class="metric-value" data-metric="registered">146</div></div><div class="metric-meta"><span data-bind="event.date">Tue 19 Jul</span> baseline</div></div>
          <div class="metric"><div><div class="metric-label">Waiting</div><div class="metric-value" data-metric="waiting">18</div></div><div class="metric-meta">Live wait: <span data-metric="waitMedian">22</span> minutes median</div></div>
          <div class="metric"><div><div class="metric-label">Awaiting review</div><div class="metric-value warn" data-metric="review">12</div></div><div class="metric-meta">Rule flags requiring reviewer sign-off</div></div>
          <div class="metric"><div><div class="metric-label">Complete</div><div class="metric-value good" data-metric="complete">72</div></div><div class="metric-meta">Synced this morning: <span data-metric="completeDelta">+12</span></div></div>
          <div class="metric"><div><div class="metric-label">Urgent</div><div class="metric-value critical" data-metric="urgent">4</div></div><div class="metric-meta">Urgent-first queue: <span data-bind="workflow.urgentFirst">Enabled</span></div></div>
          <div class="metric"><div><div class="metric-label">Pending sync / referrals</div><div class="metric-value" data-metric="pendingSync">9 / 3</div></div><div class="metric-meta">Last conflict resolution: <span data-bind="sync.conflictStatus">Awaiting review</span></div></div>
        </div>
        <div class="flow-legend" aria-label="Status legend">
          <span class="norm"><b></b>Complete · Green</span>
          <span class="rev"><b></b>Review · Amber</span>
          <span class="ref"><b></b>Referral · Orange</span>
          <span class="urg"><b></b>Urgent · Red</span>
        </div>
      </section>
    </template>

    <template data-region="primary-workspace" data-source="flow">
      <section class="flow-region flow-workspace" data-demo-state="live">
        <div class="flow-region-head">
          <div>
            <p class="flow-region-label">Primary workspace</p>
            <p class="flow-region-subtle">Kanban flow across the screening stations</p>
          </div>
          <button type="button" class="flow-mix-button" data-region="primary-workspace" data-source="flow">Use in mix</button>
        </div>

        <div class="flow-toolbar2">
          <span>Search and movement examples <span class="state-demo-empty">· demo state: empty</span></span>
          <div class="control-group">
            <button class="flow-chip" type="button" data-action="clear-filters">Clear filters</button>
            <button class="flow-chip" type="button" data-action="select-clinical">Clinical review focus</button>
          </div>
        </div>

        <div class="flow-board" aria-label="Kanban participant board">
          <article class="flow-lane" data-lane="registration">
            <header class="flow-lane-head"><span class="flow-lane-title">Registration</span><span class="flow-lane-meta" data-lane-meta="registration"></span></header>
            <ul class="flow-lane-body" data-lane-list="registration"></ul>
          </article>
          <article class="flow-lane" data-lane="visual_acuity">
            <header class="flow-lane-head"><span class="flow-lane-title">Visual acuity</span><span class="flow-lane-meta" data-lane-meta="visualAcuity"></span></header>
            <ul class="flow-lane-body" data-lane-list="visualAc"></ul>
          </article>
          <article class="flow-lane" data-lane="refraction">
            <header class="flow-lane-head"><span class="flow-lane-title">Refraction</span><span class="flow-lane-meta" data-lane-meta="refraction"></span></header>
            <ul class="flow-lane-body" data-lane-list="refraction"></ul>
          </article>
          <article class="flow-lane" data-lane="colour_vision">
            <header class="flow-lane-head"><span class="flow-lane-title">Colour vision</span><span class="flow-lane-meta" data-lane-meta="colourVision"></span></header>
            <ul class="flow-lane-body" data-lane-list="colourVision"></ul>
          </article>
          <article class="flow-lane" data-lane="eye_health">
            <header class="flow-lane-head"><span class="flow-lane-title">Eye health</span><span class="flow-lane-meta" data-lane-meta="eyeHealth"></span></header>
            <ul class="flow-lane-body" data-lane-list="eyeHealth"></ul>
          </article>
          <article class="flow-lane lane-review" data-lane="clinical_review">
            <header class="flow-lane-head"><span class="flow-lane-title">Clinical review</span><span class="flow-lane-meta" data-lane-meta="clinicalReview"></span></header>
            <ul class="flow-lane-body" data-lane-list="clinicalReview"></ul>
          </article>
          <article class="flow-lane lane-urgent" data-lane="urgent">
            <header class="flow-lane-head"><span class="flow-lane-title">Urgent</span><span class="flow-lane-meta" data-lane-meta="urgent"></span></header>
            <ul class="flow-lane-body" data-lane-list="urgent"></ul>
          </article>
          <article class="flow-lane lane-review" data-lane="review">
            <header class="flow-lane-head"><span class="flow-lane-title">Review</span><span class="flow-lane-meta" data-lane-meta="review"></span></header>
            <ul class="flow-lane-body" data-lane-list="review"></ul>
          </article>
        </div>

        <div class="state-offline-notice">Saved safely on this device. Records will synchronise when the connection returns.</div>
      </section>
    </template>

    <template data-region="supporting-rail" data-source="flow">
      <aside class="flow-region flow-support">
        <div class="flow-region-head">
          <div>
            <p class="flow-region-label">Supporting rail</p>
            <p class="flow-region-subtle">Staff and station pressure points</p>
          </div>
          <button type="button" class="flow-mix-button" data-region="supporting-rail" data-source="flow">Use in mix</button>
        </div>

        <section class="support-section">
          <h4>Staffing</h4>
          <ul class="support-list" data-list="staffing"></ul>
        </section>

        <section class="support-section">
          <h4>Station capacity</h4>
          <ul class="support-list" data-list="stations"></ul>
        </section>

        <section class="support-section">
          <h4>Sync ledger</h4>
          <ul class="support-list" data-list="syncLedger"></ul>
          <p class="support-foot-note" data-bind="sync.policy">Saved safely on this device. Pending sync is allowed.</p>
        </section>
      </aside>
    </template>

    <template data-region="activity/compliance" data-source="flow">
      <section class="flow-region">
        <div class="flow-region-head">
          <div>
            <p class="flow-region-label">Activity / compliance</p>
            <p class="flow-region-subtle">Auditable states and referral trail</p>
          </div>
          <button type="button" class="flow-mix-button" data-region="activity/compliance" data-source="flow">Use in mix</button>
        </div>

        <div class="activity-grid">
          <section class="activity-section">
            <h4>Recent activity</h4>
            <ul class="event-list" data-list="activity"></ul>
          </section>
          <section class="activity-section">
            <h4>Referrals</h4>
            <ul class="event-list" data-list="referrals"></ul>
          </section>
          <section class="activity-section">
            <h4>Audit</h4>
            <ul class="event-list" data-list="audit"></ul>
          </section>
        </div>

        <div class="flow-notice important">
          Offline-safe copy note: <strong>Flagged for reviewer assessment</strong> is advisory language. The clinical reviewer records the final decision, and recorded decisions are immutable.
        </div>

        <div class="timeline-note">Example journey marker style uses neutral text + semantic status only; no diagnosis wording is rendered in this dashboard.</div>
      </section>
    </template>

    <main class="flow-shell" aria-label="Flow concept composition" role="main">
      <div data-region-host="navigation-shell"></div>
      <section class="flow-main">
        <div data-region-host="event-context-header"></div>
        <div data-region-host="headline-metrics"></div>
        <div data-region-host="primary-workspace"></div>
        <div data-region-host="activity/compliance"></div>
      </section>
      <div data-region-host="supporting-rail"></div>
    </main>
  </div>

        stationCards: [

          { station: 'Visual acuity', capacity: 3, throughput: '18/hr', occupied: 2, wait: '11m', status: 'Healthy' },

        ],
        syncLedger: [

          { line: 'Synced', detail: '11 records confirmed', age: '2m ago', tone: 'green' },
        ],
        activity: [
          { time: '09:41', actor: 'Aisha Rahman', action: 'Opened clinical review for VSMS-240719-014', detail: 'Rule recommendation acknowledged; decision remains pending.' },

          { time: '08:56', actor: 'Harold King', action: 'Referral created', detail: 'Recorded decision is immutable and locked.' },
        ],
        referrals: [
          { id: 'R-202', participant: 'Harold King', destination: 'Eastside Ophthalmology', urgency: 'URGENT', reason: 'Asymmetric refraction and suspected macular sign', actor: 'Dr Brooks', status: 'Draft ready' },
          { id: 'R-203', participant: 'Fatimah Aziz', destination: 'Northside GP', urgency: 'PRIORITY', reason: 'Severe headache and eye discomfort', actor: 'Aisha Rahman', status: 'Draft' },
          { id: 'R-204', participant: 'Noor Rahman', destination: 'Ophthalmology fast-track', urgency: 'URGENT', reason: 'Colour mismatch and reduced response', actor: 'Daniel Lowe', status: 'Queued' },
        ],
        audit: [
          { time: '09:42', user: 'Maya Chen', what: 'decision_sync_update', result: 'Conflict pending review' },
          { time: '09:37', user: 'System', what: 'sync_state_changed', result: 'Saved locally' },
          { time: '09:26', user: 'Aisha Rahman', what: 'review_assigned', result: 'VSMS-240719-008' },
          { time: '09:12', user: 'Tom Baird', what: 'staff_swap', result: 'Colour vision technician started break' },
          { time: '08:59', user: 'System', what: 'lane_move', result: 'VSMS-240719-014 moved to Clinical review' },
        ],
      };

      const regionOrder = [
        'navigation-shell',
        'event-context-header',
        'headline-metrics',
        'primary-workspace',
        'supporting-rail',
        'activity/compliance',
      ];

      const flags = {
        normal: { label: 'Review needed not raised', cls: 'status-normal' },
        review: { label: 'Review', cls: 'status-review' },
        refer: { label: 'Referral', cls: 'status-refer' },
        urgent: { label: 'Urgent', cls: 'status-urgent' },
      };

      const laneKeys = {
        registration: 'registration',
        visualAcuity: 'visualAcuity',
        refraction: 'refraction',
        colourVision: 'colourVision',
        eyeHealth: 'eyeHealth',
        clinicalReview: 'clinicalReview',
        urgent: 'urgent',
        review: 'review',
      };

      function bindText() {
        flowRoot.querySelectorAll('[data-bind]').forEach((el) => {
          const value = getByPath(data, el.dataset.bind);
          if (value == null) return;
          el.textContent = typeof value === 'number' ? String(value) : value;
        });
      }

      function getByPath(scope, path) {
        return path.split('.').reduce((obj, key) => (obj == null ? undefined : obj[key]), scope);
      }

      function setMetricValues() {
        Object.entries(data.metrics).forEach(([key, value]) => {
          flowRoot.querySelectorAll(`[data-metric="${key}"]`).forEach((node) => {
            node.textContent = String(value);
          });
        });
      }

      function mountRegions() {
        regionOrder.forEach((region) => {
          const template = flowRoot.querySelector(`template[data-region="${region}"]`);
          const host = flowRoot.querySelector(`[data-region-host="${region}"]`);
          if (!template || !host) return;
          host.replaceChildren(template.content.cloneNode(true));
        });
      }

      function laneMeta() {
        const metaMap = {
          registration: data.stages.registration,
          visualAcuity: data.stages.visualAcuity,
          refraction: data.stages.refraction,
          colourVision: data.stages.colourVision,
          eyeHealth: data.stages.eyeHealth,
          clinicalReview: data.stages.clinicalReview,
          urgent: data.stages.urgent,
          review: data.stages.review,
        };

        Object.entries(metaMap).forEach(([laneKey, laneData]) => {
          if (!laneData) return;
          const el = flowRoot.querySelector(`[data-lane-meta="${laneKey}"]`);
          if (!el) return;
          const util = laneData.utilization ? ` · ${laneData.utilization} utilization` : '';
          el.textContent = `${laneData.capacity} cap · ${laneData.active} active · ${laneData.wait} wait${util}`;
        });
      }

      let urgentSort = false;
      let activeFilter = '';
      let currentState = 'live';

      function sortedItems(list) {
        if (!urgentSort) return list;
        const priority = { urgent: 0, refer: 1, review: 2, normal: 3 };
        return [...list].sort((a, b) => {
          const ap = priority[a.flag] ?? 9;
          const bp = priority[b.flag] ?? 9;
          if (ap !== bp) return ap - bp;
          return (a.waitMinutes ?? 0) - (b.waitMinutes ?? 0);
        });
      }

      function filterItems(list) {
        if (!activeFilter) return list;
        const q = activeFilter.toLowerCase();
        return list.filter((item) =>
          item.id.toLowerCase().includes(q) ||
          item.name.toLowerCase().includes(q) ||
          item.queue.toLowerCase().includes(q)
        );
      }

      function createCard(item) {
        const li = document.createElement('li');
        li.className = 'flow-card';
        li.tabIndex = 0;
        li.dataset.participantId = item.id;
        li.dataset.participantFlag = item.flag;

        const head = document.createElement('div');
        head.className = 'flow-card-top';

        const block = document.createElement('div');

        const name = document.createElement('p');
        name.className = 'flow-card-name';
        name.textContent = item.name;

        const meta = document.createElement('p');
        meta.className = 'flow-card-meta';
        meta.textContent = `${item.id} · Queue ${item.queue} · Age ${item.age} · Wait ${item.waitMinutes}m`;

        block.append(name, meta);

        const statusInfo = flags[item.flag] || flags.normal;
        const status = document.createElement('span');
        status.className = `flow-status ${statusInfo.cls}`;
        status.textContent = statusInfo.label;

        head.append(block, status);

        const note = document.createElement('p');
        note.className = 'flow-card-sub';
        note.textContent = item.note || '';

        const actions = document.createElement('div');
        actions.className = 'flow-card-actions';

        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'flow-action';
        open.textContent = item.moveHint || 'Open';

        const details = document.createElement('button');
        details.type = 'button';
        details.className = 'flow-action primary';
        details.textContent = item.decisionRecorded ? 'View decision' : 'Inspect';

        actions.append(open, details);

        if (item.reviewer) {
          const info = document.createElement('p');
          info.className = 'flow-card-sub';
          info.textContent = `Reviewer: ${item.reviewer}`;
          li.append(head, note, info, actions);
        } else {
          li.append(head, note, actions);
        }

        li.dataset.actionable = 'true';
        return li;
      }

      function stateMessageForLane(laneEl, state, total = 0) {
        if (state === 'loading') {
          const msg = document.createElement('li');
          msg.className = 'flow-loading';
          msg.textContent = 'Loading participant cards…';
          laneEl.appendChild(msg);
          return;
        }

        if (state === 'error' && laneEl.closest('[data-region="primary-workspace"]')) {
          const msg = document.createElement('li');
          msg.className = 'flow-error';
          msg.textContent = 'This lane cannot refresh at the moment.';
          laneEl.appendChild(msg);
          return;
        }

        if (state === 'empty') {
          const msg = document.createElement('li');
          msg.className = 'flow-empty';
          msg.textContent = 'No participants in this lane for the current filter.';
          laneEl.appendChild(msg);
          return;
        }

        if (!total) {
          const msg = document.createElement('li');
          msg.className = 'flow-empty';
          msg.textContent = 'No participants waiting here right now.';
          laneEl.appendChild(msg);
        }
      }

      function renderLists() {
        Object.entries(laneKeys).forEach(([, modelKey]) => {
          const laneList = flowRoot.querySelector(`[data-lane-list="${modelKey}"]`);
          if (!laneList) return;

          laneList.innerHTML = '';
          const items = filterItems(sortedItems(data.lanes[modelKey] || []));

          if (currentState === 'loading') {
            stateMessageForLane(laneList, 'loading', 0);
            return;
          }

          if (currentState === 'error' && modelKey === 'registration') {
            stateMessageForLane(laneList, 'error', items.length);
            return;
          }

          if (!items.length || currentState === 'empty') {
            stateMessageForLane(laneList, currentState, 0);
            return;
          }

          items.forEach((item) => laneList.appendChild(createCard(item)));
        });

        const workspace = flowRoot.querySelector('[data-region="primary-workspace"]');
        if (workspace) workspace.dataset.demoState = currentState;
      }

      function renderListsFallbackIfNoCards() {
        const boards = flowRoot.querySelectorAll('[data-lane-list]');
        boards.forEach((laneList) => {
          if (!laneList.children.length) {
            const empty = document.createElement('li');
            empty.className = 'flow-empty';
            empty.textContent = 'No participants in this lane.';
            laneList.appendChild(empty);
          }
        });
      }

      function renderSupportLists() {
        const staffHost = flowRoot.querySelector('[data-list="staffing"]');
        if (staffHost) {
          staffHost.innerHTML = '';
          data.staffing.slice(0, 6).forEach((member) => {
            const row = document.createElement('li');
            row.className = 'support-item';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = member.name;
            const role = document.createElement('div');
            role.className = 'role';
            role.textContent = member.role;
            const station = document.createElement('div');
            station.className = 'station';
            station.textContent = `${member.station} · ${member.status}`;
            if (member.note) {
              const note = document.createElement('div');
              note.className = 'station';
              note.textContent = member.note;
              row.append(name, role, station, note);
            } else {
              row.append(name, role, station);
            }
            staffHost.appendChild(row);
          });
        }

        const stationHost = flowRoot.querySelector('[data-list="stations"]');
        if (stationHost) {
          stationHost.innerHTML = '';
          data.stationCards.forEach((item) => {
            const row = document.createElement('li');
            row.className = 'support-item';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = item.station;
            const role = document.createElement('div');
            role.className = 'role';
            role.textContent = `${item.occupied}/${item.capacity} active · ${item.throughput}`;
            const station = document.createElement('div');
            station.className = 'station';
            station.textContent = `${item.wait} average wait · status: ${item.status}`;
            row.append(name, role, station);
            stationHost.appendChild(row);
          });
        }

        const syncHost = flowRoot.querySelector('[data-list="syncLedger"]');
        if (syncHost) {
          syncHost.innerHTML = '';
          data.syncLedger.forEach((item) => {
            const row = document.createElement('li');
            row.className = 'support-item';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = item.line;
            const role = document.createElement('div');
            role.className = 'role';
            role.textContent = item.detail;
            const when = document.createElement('div');
            when.className = 'station';
            when.textContent = item.age;
            if (item.tone === 'red') {
              when.style.color = 'var(--red)';
            }
            row.append(name, role, when);
            syncHost.appendChild(row);
          });
        }
      }

      function renderActivity() {
        const activityHost = flowRoot.querySelector('[data-list="activity"]');
        if (activityHost) {
          activityHost.innerHTML = '';
          data.activity.forEach((item) => {
            const row = document.createElement('li');
            row.className = 'activity-item';
            const meta = document.createElement('div');
            meta.className = 'activity-meta';
            meta.textContent = `${item.time} · ${item.actor}`;
            const body = document.createElement('div');
            body.className = 'activity-copy';
            body.textContent = `${item.action} — ${item.detail}`;
            row.append(meta, body);
            activityHost.appendChild(row);
          });
        }

        const referralsHost = flowRoot.querySelector('[data-list="referrals"]');
        if (referralsHost) {
          referralsHost.innerHTML = '';
          data.referrals.forEach((item) => {
            const row = document.createElement('li');
            row.className = 'referral-item';
            const meta = document.createElement('div');
            meta.className = 'activity-meta';
            meta.textContent = `${item.id} · ${item.urgency}`;
            const body = document.createElement('div');
            body.className = 'activity-copy';
            body.textContent = `${item.participant} → ${item.destination} · ${item.reason}`;
            const actor = document.createElement('div');
            actor.className = 'activity-meta';
            actor.textContent = `${item.actor} · ${item.status}`;
            row.append(meta, body, actor);
            referralsHost.appendChild(row);
          });
        }

        const auditHost = flowRoot.querySelector('[data-list="audit"]');
        if (auditHost) {
          auditHost.innerHTML = '';
          data.audit.forEach((item) => {
            const row = document.createElement('li');
            row.className = 'audit-item';
            const meta = document.createElement('div');
            meta.className = 'activity-meta';
            meta.textContent = `${item.time} · ${item.user}`;
            const body = document.createElement('div');
            body.className = 'activity-copy';
            body.textContent = `${item.what} · ${item.result}`;
            row.append(meta, body);
            auditHost.appendChild(row);
          });
        }
      }

      function applyTheme(theme) {
        const newTheme = theme || (flowRoot.dataset.theme === 'dark' ? 'light' : 'dark');
        flowRoot.dataset.theme = newTheme;
        const label = flowRoot.querySelector('[data-theme-state]');
        if (label) label.textContent = `${newTheme[0].toUpperCase()}${newTheme.slice(1)}`;
      }

      function setState(value) {
        currentState = value || 'live';
        flowRoot.dataset.demoState = currentState;
        flowRoot.setAttribute('data-demo-state', currentState);
        flowRoot.querySelectorAll('[data-state-note]').forEach((note) => {
          note.style.display = note.getAttribute('data-demo-state') === currentState ? 'block' : 'none';
        });
        if (currentState === 'offline') {
          flowRoot.classList.add('state-offline');
        } else {
          flowRoot.classList.remove('state-offline');
        }
      }

      function renderEverything() {
        laneMeta();
        renderLists();
        renderSupportLists();
        renderActivity();
        renderListsFallbackIfNoCards();
      }

      mountRegions();
      bindText();
      setMetricValues();
      applyTheme('light');
      setState('live');
      renderEverything();

      flowRoot.addEventListener('click', (event) => {
        const mixBtn = event.target.closest('[data-region][data-source]');
        if (!mixBtn) return;
        if (!mixBtn.matches('.flow-mix-button')) return;
        const region = mixBtn.dataset.region;
        const source = mixBtn.dataset.source;
        const state = { region, source, selectedAt: Date.now() };
        flowRoot.dispatchEvent(new CustomEvent('vsms:mix-request', { detail: state }));
      });

      flowRoot.querySelectorAll('[data-control="search"]').forEach((search) => {
        search.addEventListener('input', (event) => {
          activeFilter = String(event.target.value || '').trim();
          renderEverything();
        });
      });

      flowRoot.querySelectorAll('[data-action="toggle-urgent-first"]').forEach((button) => {
        button.addEventListener('click', () => {
          urgentSort = !urgentSort;
          data.workflow.urgentFirst = urgentSort ? 'Enabled' : 'Disabled';
          flowRoot.querySelector('[data-bind="workflow.urgentFirst"]').textContent = data.workflow.urgentFirst;
          renderLists();
        });
      });

      flowRoot.querySelectorAll('[data-action="toggle-theme"]').forEach((button) => {
        button.addEventListener('click', () => {
          const next = flowRoot.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(next);
        });
      });

      flowRoot.querySelectorAll('[data-control="demo-state"]').forEach((select) => {
        select.addEventListener('change', (event) => {
          setState(event.target.value);
          renderEverything();
        });
      });

      flowRoot.querySelectorAll('[data-action="clear-filters"]').forEach((button) => {
        button.addEventListener('click', () => {
          activeFilter = '';
          const search = flowRoot.querySelector('#flow-search');
          if (search) search.value = '';
          renderEverything();
        });
      });

      flowRoot.querySelectorAll('[data-action="select-clinical"]').forEach((button) => {
        button.addEventListener('click', () => {
          activeFilter = 'review';
          renderEverything();
        });
      });

      flowRoot.querySelectorAll('[data-action="jump-board"]').forEach((button) => {
        button.addEventListener('click', () => {
          const board = flowRoot.querySelector('[data-region="primary-workspace"]');
          if (board) board.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      window.__vsmsDashboardFlow = {
        concept: 'flow',
        data,
        integrationNotes: {
          dataAttributes: [
            'data-region',
            'data-source',
            'data-bind',
            'data-metric',
            'data-lane-list',
            'data-lane-meta',
            'data-participant-id',
          ],
          events: ['vsms:mix-request'],
          exampleStates: ['live', 'loading', 'empty', 'error', 'offline'],
        },
      };
    })();
  </script>
