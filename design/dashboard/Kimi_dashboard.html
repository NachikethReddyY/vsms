<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSMS · Operations Dashboard</title>
<!--
  VSMS — Vision Screening Management System
  Independent dashboard proposal · DESIGN_ID: Kimi_dashboard
  Self-contained prototype: inline CSS + inline JS, no dependencies.
  Architecture: top-tab command shell (no sidebar) · events as operational rows ·
  live event as a station pipeline board · participant work mode (scan→confirm→record→handoff) ·
  clinical review split view · sync ledger with working retry · dry-run mode.
-->
<style>
/* ════════════════════════════════════════════════════════════════
   VSMS operations dashboard · DESIGN_ID: Kimi_dashboard
   Design language: "operations ledger" — cool sage canvas, ink primary
   actions, colour reserved for state, monospace data, chevron stage chain.
   ════════════════════════════════════════════════════════════════ */

:root{
  --bg:#EDEFEA;          /* soft sage-gray canvas */
  --surface:#FFFFFF;
  --surface-2:#F5F6F1;   /* recessed pane */
  --surface-3:#E8EBE3;   /* fills, chain segments */
  --line:#DCE0D5;
  --line-strong:#C0C6B9;
  --ink:#1A231C;         /* warm green-black */
  --ink-2:#3D473F;
  --muted:#67726A;
  --faint:#99A19A;
  --pri:#1F2E25;         /* primary action: near-black ink */
  --pri-hover:#131E17;
  --go:#0E5C41;          /* inline actions / links: deep green */
  --live:#175CD3;        /* in-progress blue (state only) */
  --live-tint:#E9F0FC;
  --ok:#1C7A4D;          /* complete / synced */
  --ok-tint:#E3F2E9;
  --warn:#B45309;        /* review / flag / warning */
  --warn-tint:#FAEFDB;
  --bad:#B3261E;         /* failed / urgent / destructive */
  --bad-tint:#F9E8E6;
  --dry:#8A6D1A;         /* dry-run amber */
  --dry-bg:#FCF3D4;
  --dry-line:#E2CC86;
  --focus:#175CD3;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
  --shadow:0 14px 40px rgba(20,31,23,.22);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
::selection{background:#CFE3D8}

.skip-link{position:absolute;left:-9999px;top:8px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);z-index:200}
.skip-link:focus{left:8px}

/* ── Top command bar ─────────────────────────────────────────── */
#topbar{background:var(--surface);border-bottom:1px solid var(--line-strong);position:sticky;top:0;z-index:60}
.tb-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:0 20px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.02em}
.brand-sub{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:none;min-height:44px;padding:0 14px;border-radius:var(--r);color:var(--ink-2);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;border-bottom:2px solid transparent}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pri);border-radius:var(--r) var(--r) 0 0}
.tab-n{background:var(--warn-tint);color:var(--warn);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;font-variant-numeric:tabular-nums}
.tab-n.attn{background:var(--bad-tint);color:var(--bad)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.conn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.off .dot{background:var(--warn)}
.syncpill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.syncpill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.syncpill.warn .dot{background:var(--warn)}
.syncpill.bad{border-color:var(--bad);background:var(--bad-tint);color:var(--bad)}
.syncpill.bad .dot{background:var(--bad)}
.rolewrap{display:flex;align-items:center;gap:8px}
.role-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
#role-select{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:0 8px;font-weight:600;font-size:13px}
.me{display:flex;align-items:center;gap:9px;min-height:44px}
.me-av{width:32px;height:32px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.me-name{font-size:13px;font-weight:600}

/* ── Mode banners ────────────────────────────────────────────── */
.drybar{position:sticky;top:58px;z-index:55;background:var(--dry-bg);border-bottom:1px solid var(--dry-line);color:var(--dry);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 20px;font-size:13px;font-weight:600}
.drybar .dry-tag{background:var(--dry);color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.drybar .sp{flex:1}
.offlinebar{background:#F3EFE4;border-bottom:1px solid var(--dry-line);color:#6E5A17;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 20px;font-size:12.5px;font-weight:600}

/* ── Views & page scaffolding ────────────────────────────────── */
#main{flex:1;width:100%;max-width:1360px;margin:0 auto;padding:22px 20px 40px;outline:none}
.view{display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead h1{font-size:21px}
.phead .sub{color:var(--muted);font-size:13px}
.phead .sp{flex:1}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{position:relative}
.search input{min-height:44px;min-width:min(320px,72vw);border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fgroup{display:flex;gap:6px;flex-wrap:wrap}
.fchip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.sel{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:0 8px;font-weight:600;font-size:13px}
.sel-lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;align-self:center}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid transparent;font-weight:650;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-hover)}
.btn-pri:disabled{background:var(--faint);cursor:not-allowed}
.btn-sec{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-sec:hover{background:var(--surface-2)}
.btn-go{background:var(--go);color:#fff}
.btn-go:hover{background:#0A4A34}
.btn-danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad-tint)}
.btn-danger-solid{background:var(--bad);color:#fff}
.btn-danger-solid:disabled{background:var(--faint);border-color:var(--faint);cursor:not-allowed}
.btn-text{background:none;border:0;color:var(--go);font-weight:650;min-height:44px;padding:0 10px;border-radius:var(--r);text-decoration:underline;text-underline-offset:3px}
.btn-text:hover{color:#0A4A34}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── Status tokens (dot + coloured text, never colour-only) ──── */
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st-draft{color:var(--muted)}.st-draft::before{background:none;border:2px solid var(--faint);width:6px;height:6px}
.st-upcoming{color:var(--ink-2)}
.st-live{color:var(--live)}
.st-done{color:var(--ok)}
.st-warn{color:var(--warn)}.st-warn::before{border-radius:2px}
.st-bad{color:var(--bad)}.st-bad::before{border-radius:2px}
.st-ok{color:var(--ok)}
.st-mut{color:var(--muted)}
.st-dry{color:var(--dry)}.st-dry::before{border-radius:2px}

/* ── Alert strip ─────────────────────────────────────────────── */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:10px;background:var(--warn-tint);border:1px solid #E7D3AC;border-left:4px solid var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px;color:#6B4A12;flex-wrap:wrap}
.alert.bad{background:var(--bad-tint);border-color:#E8C0BC;border-left-color:var(--bad);color:#7A201A}
.alert svg{flex:none}
.alert b{font-weight:700}
.alert .sp{flex:1}
.alert .btn-text{min-height:36px}

/* ── Event rows (operational ledger rows, not cards) ─────────── */
.evgroup{display:flex;flex-direction:column;gap:8px}
.evgroup-h{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.evgroup-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.evgroup-h .ln{flex:1;height:1px;background:var(--line)}
.evgroup-h .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:var(--r);padding:14px 16px;align-items:center}
.ev.s-live{border-left-color:var(--live)}
.ev.s-upcoming{border-left-color:var(--ink-2)}
.ev.s-draft{border-left-color:var(--faint);border-left-style:dashed}
.ev.s-completed{border-left-color:var(--ok)}
.ev-date{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.ev-date .d{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.ev-date .m{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.ev-date .none{font-size:11px;color:var(--warn);font-weight:650;line-height:1.3;display:block}
.ev-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.ev-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev-title h3{font-size:15.5px}
.ev-meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.ev-meta .sep{color:var(--faint)}
.ev-meta .mono{font-family:var(--mono);font-size:11.5px}
.ev-read{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.ev-read .ok{color:var(--ok);font-weight:600}
.ev-read .miss{color:var(--warn);font-weight:600}
.ev-warns{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--warn);font-weight:600}
.ev-next{font-size:12.5px;color:var(--ink-2)}
.ev-next b{color:var(--ink)}
.ev-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:190px}
.ev-actions .primary{justify-content:center}
.ev-sub{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.ev-sub .btn-text{min-height:36px;padding:0 8px;font-size:12.5px;text-decoration:none}
.ev-sub .btn-text:hover{text-decoration:underline;text-underline-offset:3px}
.ev-sub .del{color:var(--bad)}

/* ── Stage chain (signature chevron strip) ───────────────────── */
.chain{display:flex;gap:3px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.chain li{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface-3);color:var(--ink-2);padding:9px 16px 9px 22px;font-size:12.5px;font-weight:600;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);min-height:44px}
.chain li:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:14px}
.chain li b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.chain li.hot{background:var(--live-tint);color:var(--live)}
.chain li.branch{background:var(--warn-tint);color:var(--warn)}
.chain li.okseg{background:var(--ok-tint);color:var(--ok)}
.chain.mini li{min-height:30px;padding:4px 12px 4px 18px;font-size:11.5px;gap:6px}
.chain.mini li b{font-size:12px}
.chain.mini li:first-child{padding-left:10px}

/* ── Live event header band ──────────────────────────────────── */
.live-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.live-head .row1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live-head h1{font-size:19px}
.live-head .meta{font-size:12.5px;color:var(--muted)}
.live-head .sp{flex:1}
.live-ready{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.live-ready b{font-weight:700}

/* ── Station pipeline board ──────────────────────────────────── */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.col-h h3{font-size:13px}
.col-h .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.col-stat{padding:7px 12px;font-size:11.5px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col-stat .ok{color:var(--ok);font-weight:650}
.col-stat .warn{color:var(--warn);font-weight:650}
.col-staff{padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.col-staff b{color:var(--ink-2);font-weight:650}
.col-chips{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:52px}
.chip{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:var(--r);padding:5px 10px;text-align:left}
.chip:hover{border-color:var(--ink-2)}
.chip .av{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink-2);flex:none}
.chip .who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.chip .who b{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .who span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.chip .tag{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chip.in .tag{color:var(--live)}
.chip.flag{border-color:#E2C48F;background:var(--warn-tint)}
.chip.flag .tag{color:var(--warn)}
.col-empty{font-size:12px;color:var(--faint);padding:6px 2px}

/* ── Two-column live lower region ────────────────────────────── */
.live-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:13px}
.panel-h .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel-b{padding:6px 14px 10px}
.duty{list-style:none;margin:0;padding:0}
.duty li{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.duty li:last-child{border-bottom:0}
.duty .r{font-size:11.5px;color:var(--muted)}
.duty .stn{margin-left:auto;font-size:11.5px;font-weight:650;color:var(--ink-2);background:var(--surface-3);border-radius:4px;padding:2px 8px}
.increc{list-style:none;margin:0;padding:0}
.increc li{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.increc li:last-child{border-bottom:0}
.increc .why{font-size:11.5px;color:var(--warn);font-weight:600}
.increc .btn-text{min-height:36px;margin-left:auto}

/* ── Work mode (participant workflow) ────────────────────────── */
.work-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper{display:flex;gap:3px;list-style:none;margin:0;padding:0;flex-wrap:wrap;flex:1}
.stepper li{display:flex;align-items:center;gap:8px;background:var(--surface-3);color:var(--muted);padding:8px 16px 8px 20px;font-size:12.5px;font-weight:650;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);min-height:40px}
.stepper li:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:12px}
.stepper li .sn{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.stepper li.cur{background:var(--pri);color:#fff}
.stepper li.done{background:var(--ok-tint);color:var(--ok)}
.stepper li.done .sn{border-color:var(--ok);background:var(--ok);color:#fff}
.work{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.wid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;position:sticky;top:130px}
.wid .wl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.wid h2{font-size:18px}
.wid .code{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.wid .qbig{font-size:13px;color:var(--ink-2)}
.wid .qbig b{font-size:22px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.wid .evline{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.wid .syncrow{border-top:1px solid var(--line);padding-top:9px}
.wmain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-height:420px}
.wmain h2{font-size:17px}
.wmain .lead{font-size:13px;color:var(--muted)}

/* QR scan viewport */
.scanbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:16px;align-items:stretch}
.qrview{position:relative;border:2px dashed var(--line-strong);border-radius:10px;min-height:260px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--surface-2) 0 14px,var(--surface) 14px 28px)}
.qrview .corner{position:absolute;width:26px;height:26px;border:3px solid var(--ink-2)}
.qrview .c1{top:12px;left:12px;border-right:0;border-bottom:0}
.qrview .c2{top:12px;right:12px;border-left:0;border-bottom:0}
.qrview .c3{bottom:12px;left:12px;border-right:0;border-top:0}
.qrview .c4{bottom:12px;right:12px;border-left:0;border-top:0}
.qrview .hint{text-align:center;color:var(--muted);font-size:13px;padding:0 20px}
.scanside{display:flex;flex-direction:column;gap:10px}
.scanside .note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 12px;font-family:var(--mono);font-size:12.5px;min-width:0}

/* confirm + station trail */
.confirm-ev{display:flex;align-items:center;gap:10px;background:var(--ok-tint);border:1px solid #BFE0CC;border-radius:var(--r);padding:12px 14px;font-size:13px;color:#14532D;font-weight:600;flex-wrap:wrap}
.trail{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.trail li{display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted);min-height:36px}
.trail li.done{color:var(--ok);border-color:#BFE0CC;background:var(--ok-tint)}
.trail li.cur{color:var(--live);border-color:#B9D2F5;background:var(--live-tint)}
.trail li .tdot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* forms */
.form{display:flex;flex-direction:column;gap:14px;max-width:640px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:650;color:var(--ink-2)}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 11px;background:var(--surface)}
.field textarea{padding:10px 11px;min-height:84px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13.5px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--go)}
.flagbox{background:var(--warn-tint);border:1px solid #E7D3AC;border-left:4px solid var(--warn);border-radius:var(--r);padding:12px 14px;font-size:13px;color:#6B4A12}
.flagbox b{color:#4A3109}
.syncstate{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650}

/* handoff */
.handoff-next{background:var(--live-tint);border:1px solid #B9D2F5;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.handoff-next .hl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--live)}
.handoff-next .hv{font-size:17px;font-weight:700;color:#0B3B8F}
.handoff-next .hs{font-size:12.5px;color:#3D5A93}
.savedline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}

/* ── Review split view ───────────────────────────────────────── */
.split{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:12px;align-items:start}
.qlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qlist-h{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:8px}
.qrow{width:100%;display:flex;flex-direction:column;gap:3px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;min-height:44px}
.qrow:hover{background:var(--surface-2)}
.qrow[aria-current="true"]{background:var(--live-tint);box-shadow:inset 3px 0 0 var(--live)}
.qrow .t{display:flex;align-items:center;gap:8px;width:100%}
.qrow .t b{font-size:13.5px}
.qrow .t .wait{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.qrow .f{font-size:12px;color:var(--warn);font-weight:600}
.qrow .c{font-size:11px;color:var(--muted);font-family:var(--mono)}
.rdetail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px;min-height:420px}
.rd-id{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.rd-id h2{font-size:18px}
.rd-id .mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rd-id .sp{flex:1}
.rd-sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.completeness{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.completeness li{display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 11px;font-size:12px;font-weight:600;min-height:36px}
.completeness li.y{color:var(--ok);border-color:#BFE0CC;background:var(--ok-tint)}
.completeness li.n{color:var(--warn);border-color:#E7D3AC;background:var(--warn-tint)}
.resblock{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.resblock-h{background:var(--surface-2);padding:8px 12px;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.resblock-h .when{margin-left:auto;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.resgrid div{padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.resgrid dt{font-size:11px;color:var(--muted);margin-bottom:1px}
.resgrid dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}
.resgrid dd.fl{color:var(--warn)}
.decision{border:1px solid var(--line-strong);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.radio{display:flex;align-items:flex-start;gap:10px;min-height:44px;font-size:13.5px;font-weight:600;padding:6px 8px;border-radius:var(--r)}
.radio:hover{background:var(--surface-2)}
.radio input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri)}
.radio small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rules{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

/* ── Sync ledger ─────────────────────────────────────────────── */
.syncband{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.syncband .sb{flex:1;min-width:150px;padding:12px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.syncband .sb:last-child{border-right:0}
.syncband .sb b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:700}
.syncband .sb span{font-size:11.5px;color:var(--muted);font-weight:600}
.srows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);min-height:52px}
.srow:last-child{border-bottom:0}
.srow .who b{font-size:13.5px;font-weight:650}
.srow .who span{display:block;font-size:11px;color:var(--muted);font-family:var(--mono)}
.srow .what{font-size:12.5px;color:var(--ink-2)}
.srow .what span{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .act{display:flex;gap:6px}
.schips{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.schips .cdot{width:7px;height:7px;border-radius:50%;background:currentColor}
.sc-off{background:var(--surface-3);color:var(--ink-2)}
.sc-pend{background:#F1EFE4;color:#6E5A17}
.sc-ing{background:var(--live-tint);color:var(--live)}
.sc-ing .cdot{animation:pulse 1s infinite}
.sc-ok{background:var(--ok-tint);color:var(--ok)}
.sc-fail{background:var(--bad-tint);color:var(--bad)}
.sc-conf{background:var(--warn-tint);color:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
.syncnote{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}

/* ── People ──────────────────────────────────────────────────── */
.pgroup-h{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;display:flex;gap:10px;align-items:baseline}
.pgroup-h .ln{flex:1;height:1px;background:var(--line)}
.prow{display:grid;grid-template-columns:40px minmax(0,1.3fr) minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-height:60px}
.prow .pav{width:38px;height:38px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.prow .pn b{font-size:14px;font-weight:650;display:block}
.prow .pn span{font-size:12px;color:var(--muted)}
.prow .pa{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.prow .pa span{font-size:11.5px;color:var(--muted)}
.prow .pact{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.prow.pending{background:var(--warn-tint);border-color:#E7D3AC}
.prow.deact{opacity:.62}
.prow .pact .btn-sec{min-height:38px;padding:0 12px;font-size:12.5px}
.prow .pact .btn-text{min-height:38px;font-size:12.5px;text-decoration:none}
.rolebadge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--surface-3);border:1px solid var(--line-strong);border-radius:4px;padding:2px 7px;color:var(--ink-2);white-space:nowrap}
.canlist{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.canlist li{display:flex;gap:9px;font-size:13px;align-items:flex-start}
.canlist li::before{content:"✓";color:var(--go);font-weight:700;flex:none}
.canbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:12px}
.canbox h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}

/* ── Overlays: drawer + modal + confirm ──────────────────────── */
.ovl{position:fixed;inset:0;background:rgba(20,31,23,.45);z-index:100;display:flex;justify-content:flex-end;align-items:stretch}
.ovl.center{justify-content:center;align-items:center;padding:20px}
.drawer{background:var(--surface);width:min(600px,96vw);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slidein .16s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:.6}}
.drawer-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:2}
.drawer-h h2{font-size:16px}
.drawer-h .x{margin-left:auto}
.drawer-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.drawer-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal{background:var(--surface);border-radius:10px;width:min(520px,94vw);max-height:88dvh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.5}}
.modal-h{padding:16px 20px 0}
.modal-h h2{font-size:16px}
.modal-b{padding:14px 20px;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.modal-f{padding:0 20px 16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.del-summary{border:1px solid #E8C0BC;background:var(--bad-tint);border-radius:var(--r);padding:12px 14px}
.del-summary b{font-size:14px}
.del-summary span{display:block;font-size:12px;color:#7A201A;margin-top:2px}
.x{width:44px;height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);font-size:16px;line-height:1;color:var(--ink-2)}
.x:hover{background:var(--surface-2)}

/* ── Toasts ──────────────────────────────────────────────────── */
#toast-root{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,90vw)}
.toast{background:var(--pri);color:#fff;border-radius:var(--r);padding:12px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:pop .14s ease-out;display:flex;gap:10px;align-items:flex-start}
.toast.warn{background:#7A5A10}
.toast.bad{background:var(--bad)}

/* ── Empty / denied / skeleton states ────────────────────────── */
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--surface);padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .glyph{width:44px;height:44px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:var(--faint);font-size:18px;font-weight:700}
.empty h3{font-size:15px}
.empty p{font-size:13px;color:var(--muted);max-width:420px}
.denied{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);background:var(--surface);padding:28px 22px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.denied h3{font-size:15px;display:flex;align-items:center;gap:9px}
.denied p{font-size:13px;color:var(--muted)}
.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--surface-2) 40%,#fff 50%,var(--surface-2) 60%);background-size:200% 100%;animation:sh 1.1s linear infinite;min-height:64px;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* ── Settings ────────────────────────────────────────────────── */
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.setcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.setcard h3{font-size:14px}
.setcard p{font-size:12.5px;color:var(--muted)}
.setcard ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

/* ── Footer ──────────────────────────────────────────────────── */
.devfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.devid{font-family:var(--mono);letter-spacing:.03em}

/* ── Section labels ──────────────────────────────────────────── */
.seclab{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* ── Responsive ──────────────────────────────────────────────── */
@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .work{grid-template-columns:1fr}
  .wid{position:static}
  .live-lower{grid-template-columns:1fr}
  .scanbox{grid-template-columns:1fr}
}
@media (max-width:900px){
  .ev{grid-template-columns:56px minmax(0,1fr)}
  .ev-actions{grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
  .ev-sub{justify-content:flex-start;margin-left:auto}
  .srow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .srow .what{grid-column:1/-1}
  .prow{grid-template-columns:40px minmax(0,1fr);}
  .prow .pa{grid-column:2}
  .prow .pact{grid-column:1/-1;justify-content:flex-start}
  .tb-row{gap:10px;padding:6px 14px}
  .tb-right{margin-left:0}
  #main{padding:16px 14px 34px}
}
@media (max-width:640px){
  .chain li,.stepper li{clip-path:none;border-radius:var(--r);padding:8px 12px}
  .chain,.stepper{gap:6px}
  .brand-sub{display:none}
}

/* ── Reduced motion ──────────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .btn:active{transform:none}
}
</style>

<!-- ═══════════════ TOP COMMAND BAR ═══════════════ -->
<header id="topbar">
  <div class="tb-row">

      <button type="button" class="tab" data-nav="sync">Sync <span class="tab-n" id="tab-sync-n" hidden></span></button>

<div id="drybar" class="drybar" hidden></div>

<!-- ═══════════════ MAIN VIEWS ═══════════════ -->
<main id="main" tabindex="-1">

  <!-- 1 · Events overview: search, filters, status-grouped operational rows -->
  <section id="view-events" class="view" aria-label="Events overview"></section>

  <!-- 2 · People: staff search, approvals, invite/import, assignment & permissions -->
  <section id="view-people" class="view" aria-label="People and access" hidden></section>

  <!-- 3 · Clinical review: queue + structured record + final decision -->
  <section id="view-review" class="view" aria-label="Clinical review" hidden></section>

  <!-- 4 · Sync centre: record-level states, retry, conflicts -->
  <section id="view-sync" class="view" aria-label="Sync centre" hidden></section>

  <!-- 5 · Settings & prototype controls -->
  <section id="view-settings" class="view" aria-label="Settings" hidden></section>

  <!-- 6 · Live event dashboard: readiness, attention lane, stage chain, station board -->
  <section id="view-live" class="view" aria-label="Live event dashboard" hidden></section>

  <!-- 7 · Participant work mode: scan → confirm → record → handoff -->

</main>

<div id="overlay-root"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   VSMS operations dashboard · DESIGN_ID: Kimi_dashboard
   Frontend-only state machine. No backend, no dependencies.
   ════════════════════════════════════════════════════════════════ */

/* ── Inline icons (stroke, currentColor) ─────────────────────── */
const IC = {
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

  check:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  wifi:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9.5a15 15 0 0 1 20 0"/><path d="M5 12.9a10 10 0 0 1 14 0"/><path d="M8.5 16.2a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>',

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || s.v!==1) return null;
    s.records.forEach(r=>{ if(r.state==='syncing') r.state = s.connected ? 'pending' : 'saved-offline'; });
    return s;
  }catch(e){ return null; }
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ── Sync engine ─────────────────────────────────────────────── */
function addRecord(rec){
  rec.id = 'r' + (++S.seq.r);
  rec.state = S.connected ? 'pending' : 'saved-offline';
  rec.detail = S.connected ? 'Waiting to sync' : 'Saved on this device while offline';
  if(S.dry) rec.dry = true;
  S.records.unshift(rec);
  persist();
  if(S.connected) setTimeout(()=>advanceRecord(rec.id), 800);
  render();
}
function advanceRecord(id){
  const r = S.records.find(x=>x.id===id);
  if(!r || !['pending','saved-offline'].includes(r.state)) return;
  if(!S.connected){ r.state='saved-offline'; r.detail='Saved on this device while offline'; render(); return; }
  r.state = 'syncing'; r.detail = 'Syncing…'; render();
  setTimeout(()=>{
    const rr = S.records.find(x=>x.id===id);
    if(rr && rr.state==='syncing'){ rr.state='synced'; rr.detail='Synced '+nowT(); persist(); render(); }
  }, 1400);
}
function retryRecord(id){
  const r = S.records.find(x=>x.id===id); if(!r) return;
  r.state='syncing'; r.detail='Retrying…'; render();
  setTimeout(()=>{
    const rr = S.records.find(x=>x.id===id);
    if(rr && rr.state==='syncing'){ rr.state='synced'; rr.detail='Synced after retry · '+nowT(); persist(); render(); toast('Record synced after retry'); }
  }, 1400);
}
function resolveConflict(id, keep){
  const r = S.records.find(x=>x.id===id); if(!r) return;
  r.state='synced'; r.detail='Conflict resolved — kept the '+keep+' version · '+nowT();
  persist(); render(); toast('Conflict resolved — record synced');
}
function toggleConn(){
  S.connected = !S.connected;
  if(!S.connected){
    S.records.forEach(r=>{ if(r.state==='syncing'){ r.state='pending'; r.detail='Waiting to sync'; } });
    toast('Offline — results save on this device', 'warn');
  }else{
    S.records.forEach(r=>{ if(r.state==='saved-offline'){ r.state='pending'; r.detail='Waiting to sync'; } });
    let d = 400;
    S.records.filter(r=>r.state==='pending').forEach(r=>{ setTimeout(()=>advanceRecord(r.id), d); d += 500; });
    toast('Connected — syncing pending records');
  }
  persist(); render();
}
function syncNow(){
  if(!S.connected){ toast('Offline — records will sync when the connection returns','warn'); return; }
  let d = 200;
  S.records.filter(r=>['pending','saved-offline'].includes(r.state)).forEach(r=>{ setTimeout(()=>advanceRecord(r.id), d); d += 450; });
  toast('Syncing pending records…');
}

function evWarnings(e){

    if(!e.date) w.push('No date set');
    if(!e.stations.length) w.push('No screening stations configured');
    if(!e.staffIds.length) w.push('No staff assigned');
  }
  if(e.status==='upcoming'){
    const hasRev = e.staffIds.some(id=>{ const s=st(id); return s && s.role==='REVIEWER'; }) || !!e.stationStaff['clinical-review'];
    if(!hasRev) w.push('No clinical reviewer assigned');
    if(e.staffConfirmed < e.staffIds.length) w.push((e.staffIds.length-e.staffConfirmed)+' staff not yet confirmed');
  }
  if(e.status==='live'){
    const unstaffed = e.stations.filter(x=>!e.stationStaff[x]);
    if(unstaffed.length) w.push(unstaffed.map(ST_NAME).join(', ') + ' — no staff assigned');
    const fails = S.records.filter(r=>r.state==='failed').length;
    if(fails) w.push(fails+' record'+(fails>1?'s':'')+' failed to sync');
    const rv = S.participants.filter(p=>p.eventId===e.id && p.status==='review').length;
    if(rv) w.push(rv+' records awaiting clinical review');
  }
  return w;
}
function evNext(e){
  if(e.status==='draft'){
    if(!e.date) return '<b>Next:</b> Set an event date — a draft cannot be scheduled without one.';
    if(!e.stations.length) return '<b>Next:</b> Finish setup — add screening stations and assign staff.';
    return '<b>Next:</b> Run a dry test with your team, then schedule the event.';
  }
  if(e.status==='upcoming'){
    const d = ddiff(e.date);
    if(d<=1) return '<b>Next:</b> Start the event when doors open — or run one last dry test.';
    return '<b>Next:</b> Run a dry test before '+fmtD(e.date)+' so staff can rehearse every station.';
  }
  if(e.status==='live'){
    const w = S.participants.filter(p=>p.eventId===e.id && p.status==='waiting').length;
    return '<b>Next:</b> Open the live dashboard — '+w+' participants are waiting in station queues.';
  }
  return '<b>Next:</b> Open the summary — '+e.followupBase+' follow-up letters still need to be sent.';
}

function renderEvents(){
  const c = $('#view-events');
  const q = S.ui.evQ.trim().toLowerCase();
  let list = S.events.filter(e=>{
    if(S.ui.evStatus!=='all' && e.status!==S.ui.evStatus) return false;
    if(q && !(e.name+' '+e.venue).toLowerCase().includes(q)) return false;
    if(S.ui.evScope==='week'  && !(e.date && ddiff(e.date)>=0 && ddiff(e.date)<=7))  return false;
    if(S.ui.evScope==='month' && !(e.date && ddiff(e.date)>=0 && ddiff(e.date)<=30)) return false;
    if(S.ui.evScope==='past'  && !(e.date && ddiff(e.date)<0)) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(!a.date) return 1; if(!b.date) return -1;
    return S.ui.evSort==='asc' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date);
  });

  const alerts = [];
  const fails = S.records.filter(r=>r.state==='failed').length;
  if(fails) alerts.push({kind:'bad', html:'<b>'+fails+' record'+(fails>1?'s':'')+' failed to sync.</b> Screening data is safe on this device.', act:'sync', lab:'Open sync centre'});
  const e1 = ev('e1');
  if(e1 && e1.status==='live'){
    const un = e1.stations.filter(x=>!e1.stationStaff[x]);
    if(un.length) alerts.push({kind:'warn', html:'<b>Riverside is live:</b> '+un.map(ST_NAME).join(', ')+' has no staff assigned.', act:'people', lab:'Assign staff'});
  }
  S.events.filter(e=>e.status==='upcoming').forEach(e=>{
    const hasRev = e.staffIds.some(id=>{ const s=st(id); return s && s.role==='REVIEWER'; }) || !!e.stationStaff['clinical-review'];
    if(!hasRev) alerts.push({kind:'warn', html:'<b>'+esc(e.name)+':</b> no clinical reviewer assigned yet.', act:'people', lab:'Assign reviewer'});
  });

  const groups = [['live','In progress'],['upcoming','Upcoming'],['draft','Drafts'],['completed','Completed']];
  let body = '', any = false;
  groups.forEach(([g,label])=>{
    const rows = list.filter(e=>e.status===g);
    if(!rows.length) return;
    any = true;
    body += '<div class="evgroup" role="group" aria-label="'+label+'">'
      + '<div class="evgroup-h"><h2>'+label+'</h2><span class="ln"></span><span class="n">'+rows.length+'</span></div>'
      + rows.map(evRow).join('')+'</div>';
  });
  if(!any){
    body = '<div class="empty"><div class="glyph">◇</div><h3>No events match</h3>'
      + '<p>Try a different search, or clear the status and date filters.</p>'
      + '<button type="button" class="btn btn-sec" data-act="ev-clear">Clear filters</button></div>';
  }

  const chips = [['all','All'],['draft','Draft'],['upcoming','Upcoming'],['live','In progress'],['completed','Completed']]
    .map(([v,l])=>'<button type="button" class="fchip" data-act="ev-fstatus" data-v="'+v+'" aria-pressed="'+(S.ui.evStatus===v)+'">'+l+'</button>').join('');

  c.innerHTML =
      '<div class="phead"><div><h1>Events</h1><p class="sub">'+S.events.length+' events · '+S.events.filter(e=>e.status==='live').length+' in progress · Today is Fri 31 Jul 2026</p></div>'
    + '<div class="sp"></div>'
    + (canManage()?'<button type="button" class="btn btn-pri" data-act="ev-create">+ Create event</button>':'')
    + '</div>'
    + (alerts.length?'<div class="alerts">'+alerts.slice(0,3).map(a=>'<div class="alert '+a.kind+'">'+ic('alert')+'<span>'+a.html+'</span><span class="sp"></span><button type="button" class="btn-text" data-nav="'+a.act+'">'+a.lab+'</button></div>').join('')+'</div>':'')
    + '<div class="toolbar" role="search">'
    +   '<div class="search">'+ic('search')+'<input type="search" placeholder="Search events or venues…" value="'+esc(S.ui.evQ)+'" data-act-input="evQ" aria-label="Search events"></div>'
    +   '<div class="fgroup" aria-label="Status filter">'+chips+'</div>'
    +   '<label class="sel-lab" for="ev-scope">Dates</label>'
    +   '<select id="ev-scope" class="sel" data-act-change="evScope">'
    +     '<option value="all"'+(S.ui.evScope==='all'?' selected':'')+'>All dates</option>'
    +     '<option value="week"'+(S.ui.evScope==='week'?' selected':'')+'>Next 7 days</option>'
    +     '<option value="month"'+(S.ui.evScope==='month'?' selected':'')+'>Next 30 days</option>'
    +     '<option value="past"'+(S.ui.evScope==='past'?' selected':'')+'>Past</option>'
    +   '</select>'
    +   '<label class="sel-lab" for="ev-sort">Sort</label>'
    +   '<select id="ev-sort" class="sel" data-act-change="evSort">'
    +     '<option value="asc"'+(S.ui.evSort==='asc'?' selected':'')+'>Soonest first</option>'
    +     '<option value="desc"'+(S.ui.evSort==='desc'?' selected':'')+'>Latest first</option>'
    +   '</select>'
    + '</div>'
    + body;
}

function saveEventForm(f){
  const fd = new FormData(f);
  const name = (fd.get('name')||'').toString().trim();
  const venue = (fd.get('venue')||'').toString().trim();
  const date = (fd.get('date')||'').toString();
  const status = (fd.get('status')||'draft').toString();
  const err = $('#ef-err');
  const fail = m => { err.hidden=false; err.innerHTML = '<b>Check the form:</b> '+m; };
  if(!name) return fail('the event needs a name.');
  if(!venue) return fail('the event needs a venue.');
  if(status==='upcoming' && !date) return fail('set a date before the event can be scheduled as upcoming.');
  const stations = fd.getAll('stations').map(String);
  const staffIds = fd.getAll('staff').map(String);
  const id = f.dataset.id, dupFrom = f.dataset.dup;
  if(id){
    const e = ev(id);
    Object.assign(e,{name:name,venue:venue,date:date,start:fd.get('start'),end:fd.get('end'),capacity:+fd.get('capacity')||e.capacity,stations:stations,staffIds:staffIds});
    if(!['live','completed'].includes(e.status)) e.status = status;
    Object.keys(e.stationStaff).forEach(k=>{ if(!stations.includes(k)) delete e.stationStaff[k]; });
    stations.forEach(s=>{ if(!(s in e.stationStaff)) e.stationStaff[s]=null; });
    e.reg = {onsite:!!fd.get('onsite'), qr:!!fd.get('qr'), consent:fd.get('consent')};
    toast('Event saved — the list is up to date');
  }else{
    const from = dupFrom ? ev(dupFrom) : null;
    const ne = {
      id:'e'+(++S.seq.e), name:name, venue:venue, date:date, start:fd.get('start'), end:fd.get('end'),
      capacity:+fd.get('capacity')||80, status: date? status : 'draft',
      registered:0, completedBase:0, followupBase:0, stations:stations,
      stationStaff:Object.fromEntries(stations.map(s=>[s, (from && from.stationStaff[s] && staffIds.includes(from.stationStaff[s])) ? from.stationStaff[s] : null])),
      staffIds:staffIds, staffConfirmed:0,
      reg:{onsite:!!fd.get('onsite'), qr:!!fd.get('qr'), consent:fd.get('consent')}
    };
    S.events.unshift(ne);
    toast(dupFrom ? 'Duplicate created as a draft — set a date to schedule it' : 'Event created as a draft');
  }
  closeOverlay(); persist(); render();
}

    +       '<span class="hint" style="align-self:center;color:var(--muted);font-size:12px">Choose a decision to finalise. The record leaves the queue and syncs.</span></div>'

}
function finaliseReview(id){
  const f = $('#rev-form'); if(!f) return;
  const fd = new FormData(f);
  const dec = fd.get('decision');
  if(!dec) return;
  const p = pt(id); if(!p) return;
  const notes = (fd.get('notes')||'').toString().trim();
  let outcome = 'No follow-up required';
  if(dec==='followup') outcome = 'Follow-up — routine check advised';
  if(dec==='referral') outcome = 'Referral — '+fd.get('dest')+' ('+String(fd.get('urgency')).toLowerCase()+')';
  p.status = dec==='none' ? 'completed' : 'followup';
  p.station = null; p.outcome = outcome; p.reviewNotes = notes;
  addRecord({who:p.name, code:p.code, type:'Review decision', station:'Clinical review', at:nowT()});
  S.reviewSel = null;
  toast('Review finalised — '+outcome);
  render();
}

function workScanPick(){

  if(!list.length){ toast('Queue is clear — no one is waiting to be scanned'); return; }

function workLookup(code){
  const q = code.trim().toUpperCase();
  if(!q) return;
  const p = activeList().find(x=>x.code.toUpperCase()===q || x.queue.toUpperCase()===q);
  if(!p){ toast('No participant matches “'+code+'” at this event','bad'); return; }
  if(['completed','followup'].includes(p.status)){ toast(p.name+' has already completed this event','warn'); return; }
  S.work = {pid:p.id, step:'confirm'};
  render();
}
function saveWorkResult(f){
  const p = pt(S.work.pid); if(!p) return;
  const station = p.station || 'registration';
  const def = FORMS[station] || FORMS['registration'];
  const fd = new FormData(f);
  const v = {};
  def.fields.forEach(fl=>{ v[fl.k] = fl.t==='check' ? (fd.get(fl.k)?'yes':'') : (fd.get(fl.k)||'').toString(); });
  const err = $('#wf-err');
  const missingNum = def.fields.filter(fl=>fl.t==='number' && v[fl.k]==='').map(fl=>fl.label);
  if(missingNum.length){ err.hidden=false; err.innerHTML='<b>Check the form:</b> missing '+missingNum.join(', ')+'.'; return; }
  if(station==='registration' && (!v.consent || !v.verified)){ err.hidden=false; err.innerHTML='<b>Check the form:</b> consent and identity must be confirmed before check-in.'; return; }
  const flagText = def.flag ? def.flag(v) : null;
  const labelOf = k => (def.fields.find(x=>x.k===k)||{}).label || k;
  let vals = [];
  if(station==='visual-acuity') vals = [['Right eye',v.right,ACUITY.indexOf(v.right)>=3],['Left eye',v.left,ACUITY.indexOf(v.left)>=3],['Correction',v.corr]];
  else if(station==='refraction') vals = [['Right',(v.rs||'0')+' / '+(v.rc||'0')+' × '+(v.ra||'0'),Math.abs(+v.rs)>=4],['Left',(v.ls||'0')+' / '+(v.lc||'0')+' × '+(v.la||'0'),Math.abs(+v.ls)>=4]];
  else if(station==='colour-vision') vals = [['Plates correct',v.plates+' / 14',+v.plates<10]];
  else if(station==='eye-health') vals = [['Lids and lashes',v.lids,v.lids==='Abnormal'],['Conjunctiva',v.conj,v.conj==='Abnormal'],['Cornea',v.cornea,v.cornea==='Abnormal'],['Iris and pupil',v.iris,v.iris==='Abnormal']];
  else vals = [['Consent',v.consent?'Form v3 signed':'Not confirmed'],['Details',v.verified?'Verified':'Not verified'],['Assistance',v.assist||'None']];
  if(v.notes) vals.push(['Notes', v.notes]);

  p.results[station] = {vals:vals, at:nowT(), flagged:!!flagText};
  if(!p.done.includes(station)) p.done.push(station);
  p.lastResult = {station:station, vals:vals, at:nowT()};
  p.lastFlag = flagText || null;
  p.incomplete = false; delete p.why;
  const idx = FLOW.indexOf(station);
  const nextSt = FLOW[idx+1] || null;
  if(flagText){ p.flags.push(flagText); p.status='review'; p.station='clinical-review'; p.wait='0 min'; }
  else if(nextSt){ p.station=nextSt; p.status='waiting'; }
  else { p.station=null; p.status='completed'; }

  const rec = {who:p.name, code:p.code, type:'Screening result', station:ST_NAME(station), at:nowT()};
  addRecord(rec);
  S.work.step = 'handoff';
  S.work.lastRecordId = rec.id;
  toast(flagText ? 'Result saved — flagged for reviewer assessment' : 'Result saved on this device');
  render();
}

function drySeed(evId){
  const mk = (id,name,age,sex,q,status,station,done)=>({id:id,eventId:evId,name:name,age:age,sex:sex,code:'DRY-'+q,queue:q,status:status,station:station,done:done,results:{},flags:[],missing:[],wait:'2 min',dry:true});
  return [
    mk('tp1','Test Participant A',45,'F','T01','waiting','visual-acuity',['registration']),
    mk('tp2','Test Participant B',61,'M','T02','waiting','registration',[]),
    mk('tp3','Test Participant C',38,'F','T03','waiting','refraction',['registration','visual-acuity']),
    mk('tp4','Test Participant D',55,'M','T04','waiting','eye-health',['registration','visual-acuity','refraction','colour-vision'])
  ];
}

/* ── Action delegation ───────────────────────────────────────── */
document.addEventListener('click', e=>{
  const ovl = e.target.classList && e.target.classList.contains('ovl');
  if(ovl){ closeOverlay(); return; }
  const nav = e.target.closest('[data-nav]');
  if(nav){ closeOverlay(); go(nav.dataset.nav); return; }
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  switch(act){
    /* shell */
    case 'conn-toggle': toggleConn(); break;
    case 'role': break; /* handled on change */
    case 'overlay-close': closeOverlay(); break;
    case 'reset':
      openModal('Reset the prototype?',
        '<p>All events, staff, participants and sync records return to the original fictional seed data. Anything you changed is discarded.</p>',
        '<button type="button" class="btn btn-sec" data-act="overlay-close">Cancel</button>'
        + '<button type="button" class="btn btn-danger-solid" data-act="reset-do">Reset everything</button>');
      break;
    case 'reset-do': localStorage.removeItem(KEY); location.reload(); break;
    /* events */
    case 'ev-create': if(canManage()) openEditor({}); break;
    case 'ev-edit': if(canManage()) openEditor({id:id}); break;
    case 'ev-dup': if(canManage()) openEditor({dupFrom:id}); break;
    case 'ev-del': if(canManage()) deleteEvent(id); break;
    case 'del-do': {
      const e2 = ev(id);
      S.events = S.events.filter(x=>x.id!==id);
      if(S.liveEventId===id) S.liveEventId = S.events.length?S.events[0].id:null;
      closeOverlay(); toast('Deleted “'+(e2?e2.name:'event')+'”'); render(); break;
    }
    case 'ev-start': {
      const e2 = ev(id); if(!e2) break;
      e2.status = 'live'; S.liveEventId = id;
      toast('Event is live — the dashboard is open'); setView('live'); break;
    }
    case 'ev-open': S.liveEventId = id; go('live'); break;
    case 'ev-summary': openSummary(id); break;
    case 'ev-dry': startDryRun(id); break;
    case 'ev-clear': S.ui.evQ=''; S.ui.evStatus='all'; S.ui.evScope='all'; render(); break;
    case 'ev-fstatus': S.ui.evStatus = t.dataset.v; render(); break;
    /* people */
    case 'ppl-approve': { const s=st(id); if(s){ s.status='active'; s.last='Approved just now'; toast(s.name+' approved — they can sign in'); render(); } break; }
    case 'ppl-reject': { const s=st(id); if(s){ S.staff = S.staff.filter(x=>x.id!==id); toast(s.name+' rejected — invitation withdrawn'); render(); } break; }
    case 'ppl-invite':
      openModal('Invite staff member',
        '<form id="invite-form" class="form">'
        + '<div class="field"><label for="iv-name">Full name</label><input id="iv-name" name="name" required placeholder="e.g. Rita Kapoor"></div>'
        + '<div class="field"><label for="iv-email">Email</label><input id="iv-email" name="email" type="email" required placeholder="name@vsms.example"></div>'
        + '<div class="field"><label for="iv-role">Role</label><select id="iv-role" name="role" class="sel" style="width:100%">'
        + Object.entries(ROLES).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></div></form>',
        '<button type="button" class="btn btn-sec" data-act="overlay-close">Cancel</button>'
        + '<button type="button" class="btn btn-pri" data-act="invite-do">Send invitation</button>');
      break;
    case 'invite-do': {

    case 'perms-save': {
      const s = st(id); if(!s) break;
      s.perms = Array.from(document.querySelectorAll('#overlay-root input[name="perm"]:checked')).map(x=>x.value);
      closeOverlay(); toast('Permissions saved for '+s.name); render(); break;
    }
    case 'ppl-deact': {
      const s = st(id); if(!s) break;
      openModal('Deactivate access?',
        '<div class="del-summary"><b>'+esc(s.name)+'</b><span>'+esc(s.email)+' · '+ROLES[s.role]+'</span></div>'
        + '<p>They will no longer be able to sign in or be assigned to events. Their recorded work is kept.</p>',
        '<button type="button" class="btn btn-sec" data-act="overlay-close">Keep active</button>'
        + '<button type="button" class="btn btn-danger-solid" data-act="deact-do" data-id="'+s.id+'">Deactivate</button>');
      break;
    }
    case 'deact-do': { const s=st(id); if(s){ s.status='deactivated'; s.last='Deactivated just now'; closeOverlay(); toast(s.name+' deactivated'); render(); } break; }
    case 'ppl-react': { const s=st(id); if(s){ s.status='active'; s.last='Reactivated just now'; toast(s.name+' reactivated'); render(); } break; }
    /* review */
    case 'rev-select': S.reviewSel = id; render(); break;
    case 'rev-finalise': finaliseReview(id); break;
    /* sync */
    case 'sync-retry': retryRecord(id); break;
    case 'sync-keep': resolveConflict(id, t.dataset.keep); break;
    case 'sync-now': syncNow(); break;
    /* live + work */
    case 'live-back': setView('events'); break;
    case 'live-scan': S.work = {pid:null, step:'scan'}; setView('work'); break;
    case 'work-resume': S.work = {pid:id, step:(t.dataset.step==='record'?'record':'confirm')}; setView('work'); break;
    case 'work-sim': workScanPick(); break;
    case 'work-confirm': if(S.work){ S.work.step='record'; render(); } break;
    case 'work-rescan': S.work = {pid:null, step:'scan'}; render(); break;
    case 'work-next': S.work = {pid:null, step:'scan'}; render(); break;
    case 'work-board': S.work = null; setView('live'); break;
    /* dry run */
    case 'dry-exit': exitDryRun(); break;
    case 'dry-exit-do': doExitDry(); break;
  }
});
document.addEventListener('input', e=>{
  const t = e.target.closest('[data-act-input]'); if(!t) return;
  S.ui[t.dataset.actInput] = t.value;
  render();
  const el = document.querySelector('[data-act-input="'+t.dataset.actInput+'"]');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
});
document.addEventListener('change', e=>{
  const t = e.target.closest('[data-act-change]'); if(!t) return;
  switch(t.dataset.actChange){
    case 'role': S.role = t.value; toast('Viewing as '+ROLES[S.role]); render(); break;
    case 'evScope': case 'evSort': case 'pplRole': case 'pplStatus':
      S.ui[t.dataset.actChange] = t.value; render(); break;
    case 'del-check': { const b = $('#del-do'); if(b) b.disabled = !t.checked; break; }
    case 'assign-role': { const ul = $('#as-can'); if(ul) ul.innerHTML = ROLE_CAN[t.value].map(x=>'<li>'+x+'</li>').join(''); break; }
    case 'assign-ev': {
      const ee = ev(t.value); const sel = $('#as-stn');
      if(sel && ee) sel.innerHTML = ee.stations.map(x=>'<option value="'+x+'">'+ST_NAME(x)+'</option>').join('') || '<option value="">No stations on this event</option>';
      break; }
    case 'perm-prev': {
      const ul = $('#perm-can'); if(!ul) break;
      const on = Array.from(document.querySelectorAll('#overlay-root input[name="perm"]:checked')).map(x=>x.value);
      ul.innerHTML = on.map(k=>{ const p=PERMS.find(x=>x[0]===k); return p?'<li>'+p[1]+'</li>':''; }).join('') || '<li>No permissions selected</li>';
      break; }
    case 'rev-dec': {
      const fin = $('#rev-fin'); if(fin) fin.disabled = false;
      const ref = $('#rev-ref'); if(ref) ref.hidden = t.value!=='referral';
      break; }
  }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='ev-form') saveEventForm(e.target);
  if(e.target.id==='work-form') saveWorkResult(e.target);
  if(e.target.id==='manual-form') workLookup($('#manual-code').value);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOverlay(); });

/* ── Boot ────────────────────────────────────────────────────── */
(function boot(){
  const rs = $('#role-select');
  rs.innerHTML = Object.entries(ROLES).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
  rs.value = S.role;
  render();
  if(S.connected){
    let d = 600;
    S.records.filter(r=>r.state==='pending').forEach(r=>{ setTimeout(()=>advanceRecord(r.id), d); d += 500; });
  }
})();
</script>

</body>
</html>
