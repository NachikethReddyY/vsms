<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VSMS Operations Board</title>
  <meta name="description" content="Independent VSMS dashboard prototype for community vision screening operations.">
  <style>
    :root {
      color-scheme: light;
      --rail: #17211f;
      --rail-2: #22302d;
      --canvas: #eef2ef;
      --surface: #fbfcfa;
      --surface-2: #f3f6f3;
      --ink: #14201e;
      --ink-2: #485653;
      --muted: #687570;
      --line: #d8dfdb;
      --line-strong: #b8c4bf;
      --accent: #006e68;
      --accent-hover: #005b56;
      --accent-soft: #dcefeb;
      --success: #19704d;
      --success-soft: #e2f1e8;
      --warning: #9a560e;
      --warning-soft: #fbedd9;
      --danger: #a23d38;
      --danger-soft: #f8e4e2;
      --info: #315d8a;
      --info-soft: #e5edf5;
      --focus: #00a297;
      --shadow: 0 16px 46px rgba(20, 32, 30, .14);
      --r: 10px;
      --r-sm: 6px;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
      --sans: "Aptos", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--rail); }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button, select { min-height: 44px; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    button:active:not(:disabled) { transform: scale(.975); }
    a { color: inherit; }
    .skip-link {
      position: fixed;
      z-index: 100;
      inset: 12px auto auto 12px;
      padding: 10px 14px;
      background: white;
      color: var(--ink);
      border-radius: var(--r-sm);
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: translateY(0); }

    .app {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100dvh;
    }
    .rail {
      position: sticky;
      top: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--rail);
      color: #eef5f2;
    }
    .brand {
      min-height: 74px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 9px;
      color: #d9fff6;
      font: 700 13px/1 var(--mono);
      letter-spacing: -.04em;
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: -.01em; }
    .brand span { display: block; margin-top: 1px; color: #a6b6b1; font-size: 11px; }
    .rail-context {
      margin: 14px 12px 8px;
      padding: 12px;
      border-radius: var(--r);
      background: var(--rail-2);
    }
    .rail-context small {
      display: block;
      margin-bottom: 4px;
      color: #9fb1ab;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .rail-context strong { display: block; font-size: 13px; }
    .rail-context span { display: block; margin-top: 3px; color: #c5d3cf; font-size: 12px; }
    .rail-nav {
      flex: 1;
      padding: 8px 10px;
      overflow-y: auto;
    }
    .nav-label {
      margin: 18px 10px 7px;
      color: #83968f;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .nav-button {
      position: relative;
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #c7d4d0;
      text-align: left;
    }
    .nav-button:hover { background: rgba(255,255,255,.06); color: white; }
    .nav-button.active {
      background: rgba(77, 218, 202, .12);
      color: #e5fffa;
      font-weight: 700;
    }
    .nav-button.active::before {
      content: "";
      position: absolute;
      inset: 10px auto 10px 0;
      width: 3px;
      border-radius: 3px;
      background: #55d6c7;
    }
    .nav-count {
      min-width: 25px;
      padding: 2px 6px;
      border-radius: 99px;
      background: rgba(255,255,255,.1);
      color: #dce8e4;
      font: 700 11px/1.4 var(--mono);
      text-align: center;
    }
    .rail-footer {
      padding: 13px 14px 15px;
      border-top: 1px solid rgba(255, 255, 255, .1);
    }
    .connection {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-bottom: 13px;
      color: #d6e2de;
      font-size: 12px;
    }
    .state-mark {
      width: 9px;
      height: 9px;
      margin-top: 4px;
      flex: none;
      border-radius: 50%;
      background: #59c894;
      box-shadow: 0 0 0 3px rgba(89, 200, 148, .13);
    }
    .connection span { display: block; color: #91a49d; font-size: 11px; }
    .profile {
      display: grid;
      grid-template-columns: 34px minmax(0,1fr);
      gap: 9px;
      align-items: center;
    }
    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #d7e8e2;
      color: #153b35;
      font-weight: 800;
      font-size: 12px;
    }
    .profile strong, .profile span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile strong { display: block; font-size: 12px; }
    .profile span { display: block; color: #91a49d; font-size: 11px; }

    .stage { min-width: 0; }
    .command-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 66px;
      padding: 9px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(251, 252, 250, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .command-title { min-width: 190px; }
    .command-title small { display: block; color: var(--muted); font-size: 11px; }
    .command-title strong { display: block; font-size: 16px; letter-spacing: -.015em; }
    .command-spacer { flex: 1; }
    .command-actions { display: flex; align-items: center; gap: 8px; }
    .sync-command {
      min-height: 44px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--surface);
      color: var(--ink-2);
    }
    .sync-command strong { color: var(--ink); font-size: 12px; }
    .sync-command span { display: block; font-size: 10px; }
    .text-button, .secondary, .primary, .danger-button {
      min-height: 44px;
      padding: 0 15px;
      border-radius: var(--r-sm);
      font-weight: 700;
      white-space: nowrap;
      transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }
    .text-button {
      border: 0;
      background: transparent;
      color: var(--ink-2);
    }
    .text-button:hover { background: var(--surface-2); color: var(--ink); }
    .secondary {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
    }
    .secondary:hover { border-color: var(--accent); color: var(--accent); }
    .primary {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
    }
    .primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .danger-button {
      border: 1px solid var(--danger);
      background: transparent;
      color: var(--danger);
    }
    .danger-button:hover { background: var(--danger-soft); }
    .small-button { min-height: 44px; padding: 0 11px; font-size: 12px; }

    .dry-run-bar {
      display: none;
      position: sticky;
      top: 66px;
      z-index: 19;
      min-height: 50px;
      padding: 7px 22px;
      align-items: center;
      gap: 12px;
      background: #fff2c7;
      border-bottom: 1px solid #dfb84f;
      color: #5d4202;
    }
    .dry-run-bar.visible { display: flex; }
    .dry-run-bar strong { font-size: 13px; }
    .dry-run-bar span { flex: 1; font-size: 12px; }
    .dry-run-bar button {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid #806313;
      border-radius: var(--r-sm);
      background: #fff8de;
      color: #523b00;
      font-weight: 700;
    }

    main {
      width: 100%;
      max-width: 1550px;
      margin: 0 auto;
      padding: 26px 28px 52px;
    }
    .page-head {
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }
    .page-head h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    .page-head p { max-width: 670px; margin: 7px 0 0; color: var(--ink-2); font-size: 15px; }
    .page-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .kicker {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .toolbar {
      margin-bottom: 16px;
      padding: 10px;
      display: grid;
      grid-template-columns: minmax(210px, 1.4fr) repeat(2, minmax(150px, .6fr)) auto;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
    }
    .field-control, .field textarea, .field input, .field select {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      background: white;
      color: var(--ink);
    }
    .field textarea { min-height: 88px; resize: vertical; }
    .field-control::placeholder, .field input::placeholder, .field textarea::placeholder { color: #78847f; }
    .field-control:focus, .field textarea:focus, .field input:focus, .field select:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(0, 162, 151, .18);
      outline-offset: 0;
    }

    .section-strip {
      margin: 24px 0 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-strip h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .section-strip span { color: var(--muted); font-size: 12px; }
    .section-strip::after { content: ""; height: 1px; flex: 1; background: var(--line); }

    .event-list {
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
    }
    .event-row {
      position: relative;
      display: grid;
      grid-template-columns: 92px minmax(260px, 1.35fr) minmax(190px, .75fr) minmax(190px, .72fr);
      min-height: 142px;
      border-bottom: 1px solid var(--line);
    }
    .event-row:last-child { border-bottom: 0; }
    .event-row::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--line-strong);
    }
    .event-row[data-status="in_progress"]::before { background: var(--accent); }
    .event-row[data-status="upcoming"]::before { background: var(--info); }
    .event-row[data-status="draft"]::before { background: #7a7161; }
    .event-row[data-status="completed"]::before { background: var(--success); }
    .event-date {
      padding: 20px 14px 18px 19px;
      border-right: 1px solid var(--line);
      text-align: center;
    }
    .event-date strong { display: block; font: 800 28px/1 var(--mono); letter-spacing: -.05em; }
    .event-date span { display: block; margin-top: 5px; color: var(--ink-2); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .event-date small { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .event-main, .event-readiness, .event-next { padding: 18px 18px 16px; }
    .event-readiness, .event-next { border-left: 1px solid var(--line); }
    .event-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .event-status i, .status i {
      width: 9px;
      height: 9px;
      display: inline-block;
      flex: none;
      border-radius: 50%;
      background: currentColor;
    }
    .status-live { color: var(--accent); }
    .status-upcoming { color: var(--info); }
    .status-draft { color: #6d6558; }
    .status-completed { color: var(--success); }
    .event-main h3 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .event-meta {
      margin-top: 7px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px 15px;
      color: var(--ink-2);
      font-size: 12px;
    }
    .event-actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
    }
    .link-action {
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 3px;
    }
    .link-action:hover { text-decoration-color: currentColor; }
    .link-action.destructive { color: var(--danger); }
    .readiness-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }
    .readiness-label strong { font-family: var(--mono); font-size: 12px; }
    .readiness-track {
      height: 7px;
      margin: 7px 0 11px;
      overflow: hidden;
      border-radius: 5px;
      background: #e0e5e2;
    }
    .readiness-track span { display: block; height: 100%; background: var(--accent); }
    .warning-line {
      margin-top: 8px;
      padding: 8px 9px;
      border-left: 3px solid var(--warning);
      background: var(--warning-soft);
      color: #6f3c06;
      font-size: 11px;
    }
    .clear-line {
      margin-top: 8px;
      color: var(--success);
      font-size: 11px;
      font-weight: 700;
    }
    .event-next small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .event-next strong { display: block; margin: 5px 0 11px; font-size: 14px; line-height: 1.35; }
    .event-next .primary, .event-next .secondary { width: 100%; }

    .empty-state, .permission-state {
      padding: 54px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--r);
      background: var(--surface);
      text-align: center;
    }
    .empty-state .empty-symbol, .permission-state .empty-symbol {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--accent);
      font: 800 22px/1 var(--mono);
    }
    .empty-state h2, .permission-state h2 { margin: 0; font-size: 21px; }
    .empty-state p, .permission-state p { max-width: 530px; margin: 7px auto 18px; color: var(--ink-2); }

    .throughput {
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: repeat(7, minmax(100px, 1fr));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
    }
    .throughput-item {
      min-height: 84px;
      padding: 14px;
      border-right: 1px solid var(--line);
    }
    .throughput-item:last-child { border-right: 0; }
    .throughput-item strong { display: block; font: 800 25px/1.05 var(--mono); }
    .throughput-item span { display: block; margin-top: 7px; color: var(--ink-2); font-size: 11px; }
    .throughput-item.attention { background: var(--warning-soft); }
    .throughput-item.danger { background: var(--danger-soft); }
    .live-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(290px, .65fr);
      gap: 16px;
      align-items: start;
    }
    .board-panel {
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
      overflow: hidden;
    }
    .panel-head {
      min-height: 58px;
      padding: 11px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 16px; }
    .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .attention-row {
      min-height: 78px;
      padding: 13px 15px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .attention-row:last-child { border-bottom: 0; }
    .priority-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--warning-soft);
      color: var(--warning);
      font: 800 12px/1 var(--mono);
    }
    .attention-row strong { display: block; font-size: 13px; }
    .attention-row span { display: block; margin-top: 3px; color: var(--ink-2); font-size: 11px; }
    .station-row {
      padding: 12px 15px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .station-row:last-child { border-bottom: 0; }
    .station-row strong { font-size: 13px; }
    .station-row span { display: block; color: var(--muted); font-size: 11px; }
    .station-state { text-align: right; }
    .station-state strong { font-family: var(--mono); }
    .callout {
      margin: 16px 0;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--r-sm);
      background: var(--surface);
    }
    .callout.warning { border-left-color: var(--warning); background: var(--warning-soft); }
    .callout.danger { border-left-color: var(--danger); background: var(--danger-soft); }
    .callout.success { border-left-color: var(--success); background: var(--success-soft); }
    .callout div { flex: 1; }
    .callout strong { display: block; font-size: 13px; }
    .callout span { display: block; margin-top: 2px; color: var(--ink-2); font-size: 11px; }

    .workspace {
      min-height: 645px;
      display: grid;
      grid-template-columns: 242px minmax(380px, 1fr) 275px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
    }
    .workspace-pane { min-width: 0; }
    .workspace-pane + .workspace-pane { border-left: 1px solid var(--line); }
    .pane-head {
      min-height: 62px;
      padding: 12px 15px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }
    .pane-head strong { display: block; font-size: 13px; }
    .pane-head span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .queue-person {
      width: 100%;
      min-height: 74px;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    .queue-person:hover, .queue-person.active { background: var(--accent-soft); }
    .queue-person strong { display: block; font-size: 13px; }
    .queue-person span { display: block; margin-top: 3px; color: var(--muted); font: 11px/1.4 var(--mono); }
    .active-work { padding: 20px; }
    .identity-strip {
      margin: -20px -20px 20px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      background: #f7faf8;
    }
    .identity-strip strong { display: block; font-size: 17px; }
    .identity-strip span { display: block; margin-top: 2px; color: var(--ink-2); font: 11px/1.4 var(--mono); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .status.success { color: var(--success); }
    .status.warning { color: var(--warning); }
    .status.danger { color: var(--danger); }
    .status.info { color: var(--info); }
    .scan-target {
      min-height: 310px;
      padding: 38px;
      display: grid;
      place-items: center;
      border: 2px dashed var(--line-strong);
      border-radius: var(--r);
      background:
        linear-gradient(90deg, var(--accent) 26px, transparent 26px) top left / 48px 3px no-repeat,
        linear-gradient(var(--accent) 26px, transparent 26px) top left / 3px 48px no-repeat,
        linear-gradient(-90deg, var(--accent) 26px, transparent 26px) top right / 48px 3px no-repeat,

      function filteredEvents() {
        const query = state.eventQuery.trim().toLowerCase();
        const filtered = state.events.filter(event => {
          const matchesText = !query || [event.name, event.venue, statusLabel(event.status)].some(value => value.toLowerCase().includes(query));
          const matchesStatus = state.eventStatus === "all" || event.status === state.eventStatus;
          return matchesText && matchesStatus;
        });
        return filtered.sort((a, b) => {
          if (state.eventSort === "date-desc") return (b.date || "9999").localeCompare(a.date || "9999");
          if (state.eventSort === "status") return a.status.localeCompare(b.status);
          return (a.date || "9999").localeCompare(b.date || "9999");
        });
      }

        if (event.status === "in_progress") return ["Open live event", "open-live", "primary"];

                  <div class="field"><label for="left-distance">Left eye distance acuity</label><select id="left-distance" name="leftDistance" required><option value="">Choose result</option><option>6/6</option><option selected>6/9</option><option>6/12</option><option>6/18</option><option>6/24</option><option>6/36</option></select><small>Record the measured screening result.</small></div>
                  <fieldset class="field full"><legend>Screened with habitual correction?</legend><div class="radio-row"><label><input type="radio" name="correction" value="Yes" checked> Yes</label><label><input type="radio" name="correction" value="No"> No</label></div></fieldset>
                  <div class="field full"><label for="screen-notes">Operational note</label><textarea id="screen-notes" name="notes" placeholder="Add only information relevant to completing this screening station"></textarea></div>
                </div>
                ${state.localSaved ? `<div class="callout success"><div><strong>Saved safely on this device</strong><span>${state.dryRun ? "Dry run record will not enter the live event." : "Local save complete. Current sync state: " + esc(state.screenSyncState) + "."}</span></div></div>` : ""}
                <div class="form-actions"><button type="submit" class="secondary">${state.localSaved ? "Save changes" : "Save result"}</button><button type="button" class="primary" data-action="handoff" ${state.localSaved ? "" : "disabled"}>Hand off to Refraction</button></div>
              </form>
            </div>`;
        }
        return `
          <div class="page-head">
            <div><p class="kicker">${state.dryRun ? "Dry run / " : ""}Visual acuity</p><h1>${state.screenPhase === "scan" ? "Ready for the next participant" : "Participant screening"}</h1><p>Identity, event, save state, and the next station stay visible through the handoff.</p></div>
            <div class="page-actions"><button class="secondary" data-nav="live">Back to event</button>${state.screenPhase !== "scan" ? `<button class="secondary" data-action="rescan">Scan another pass</button>` : ""}</div>
          </div>
          <div class="workspace">
            <section class="workspace-pane">${queuePane(state.screenPhase === "scan" ? "" : person.name)}</section>
            <section class="workspace-pane">${content}</section>
            <section class="workspace-pane">${pathPane()}</section>
          </div>`;
      }

      function renderReview() {
        const review = selectedReview();
        const pendingReviews = state.reviews.filter(item => !item.finalized);
        if (!pendingReviews.length) return `
          <div class="page-head"><div><p class="kicker">Clinical review</p><h1>Review queue</h1><p>Reviewer decisions complete the screening pathway without making a diagnosis.</p></div></div>
          <div class="empty-state"><div class="empty-symbol">OK</div><h2>All review records are finalised</h2><p>New screening flags and incomplete records will appear here when they need a reviewer.</p><button class="secondary" data-nav="live">Return to live event</button></div>`;
        if (state.reviewCompleted) return `
          <div class="page-head"><div><p class="kicker">Decision recorded</p><h1>Review finalised</h1><p>The screening outcome and follow-up action were saved explicitly.</p></div></div>
          <div class="empty-state"><div class="empty-symbol">OK</div><h2>${esc(review.name)} is complete</h2><p>This record has left the active review queue. ${pendingReviews.length} records still require review.</p><button class="primary" data-action="next-review">Open next review</button></div>`;
        return `
          <div class="page-head">
            <div><p class="kicker">${state.dryRun ? "Dry run / " : ""}Reviewer workspace</p><h1>Clinical review queue</h1><p>Structured results, missing work, and screening flags stay beside the explicit reviewer decision.</p></div>
            <div class="page-actions"><button class="secondary" data-nav="live">Back to event</button></div>
          </div>
          <div class="review-layout">
            <section>
              <div class="pane-head"><strong>Awaiting review</strong><span>${pendingReviews.length} records, oldest wait 12 min</span></div>
              ${pendingReviews.map(item => `<button class="queue-person ${item.id === review.id ? "active" : ""}" data-action="open-review" data-id="${item.id}"><strong>${esc(item.name)}</strong><span>${esc(item.code)} / ${esc(item.queue)}</span></button>`).join("")}
            </section>
            <section class="review-record">
              <div class="identity-strip"><div><strong>${esc(review.name)}</strong><span>${esc(review.code)} / ${review.age} years / Tampines North</span></div><span class="status warning"><i></i>${esc(review.status)}</span></div>
              <div class="result-group"><h3>Visual acuity</h3>
                <div class="result-row"><span>Right eye distance</span><strong>${esc(review.right)}</strong></div>
                <div class="result-row"><span>Left eye distance</span><strong>${esc(review.left)}</strong></div>
                <div class="result-row"><span>Pinhole result</span><strong>${esc(review.pinhole)}</strong></div>
              </div>
              <div class="result-group"><h3>Eye health screening</h3>
                <div class="result-row"><span>Pressure screening</span><strong>${esc(review.pressure)}</strong></div>
                <div class="result-row"><span>Image quality</span><strong>${review.missing ? "Review required" : "Acceptable"}</strong></div>
              </div>
              <div class="flag-panel"><strong>Screening flag</strong><br>${esc(review.flag)} This is a screening flag, not a diagnosis.</div>
              ${review.missing ? `<div class="missing-panel"><strong>Incomplete result</strong><br>${esc(review.missing)}</div>` : ""}
            </section>
            <section class="decision-pane">
              <h2>Reviewer decision</h2>
              <p>Choose the final screening disposition, document the reasoning, then finalise.</p>
              <form id="review-form">
                <div class="decision-options">
                  <label class="decision-option"><input type="radio" name="decision" value="Screening complete" required><span><strong>Screening complete</strong><br>No follow-up action recorded.</span></label>
                  <label class="decision-option"><input type="radio" name="decision" value="Follow-up required"><span><strong>Follow-up required</strong><br>Record a non-urgent follow-up action.</span></label>
                  <label class="decision-option"><input type="radio" name="decision" value="Referral action"><span><strong>Referral action</strong><br>Record the reviewer-approved referral next step.</span></label>
                </div>
                <div class="field" style="margin-top:12px"><label for="review-notes">Reviewer notes</label><textarea id="review-notes" name="notes" required placeholder="Record the basis for this screening decision"></textarea></div>
                <div class="field" style="margin-top:12px"><label for="follow-up">Follow-up or referral action</label><select id="follow-up" name="followUp"><option>No action</option><option>Routine optometry follow-up</option><option>Primary care follow-up</option><option>Reviewer-approved referral</option></select></div>
                <div class="review-disclaimer">VSMS supports screening and review. It does not diagnose. Final decisions are recorded by an authorised reviewer.</div>
                <div class="form-actions"><button class="primary" type="submit">Finalise review</button></div>
              </form>
            </section>
          </div>`;
      }

      function filteredStaff() {
        const query = state.peopleQuery.trim().toLowerCase();
        return state.staff.filter(person => !query || [person.name, person.email, person.role, person.event, person.station, person.status].some(value => value.toLowerCase().includes(query)));
      }

      function renderPeopleRows() {
        const people = filteredStaff();
        if (!people.length) return `<div class="empty-state"><div class="empty-symbol">0</div><h2>No staff match this search</h2><p>Try a name, email, role, event, or station.</p><button class="secondary" data-action="clear-people-search">Clear search</button></div>`;

            <td>${esc(person.event)}<small>${esc(person.station)}</small></td>

        return `
          <div class="page-head">
            <div><p class="kicker">Managers only</p><h1>People & access</h1><p>Assign staff to an event, station, and role together. Participants are records and never appear as sign-in users.</p></div>

      const syncStatusClass = status => {
        if (status === "Synced") return "success";
        if (["Saved offline", "Pending sync", "Syncing"].includes(status)) return "info";
        if (status === "Sync failed") return "danger";
        return "warning";
      };

      function renderSync() {
        const counts = label => state.sync.filter(item => item.status === label).length;
        return `
          <div class="page-head">
            <div><p class="kicker">Local-first resilience</p><h1>Sync centre</h1><p>Locally saved work remains recoverable. Retry failures here without making discard an easy action.</p></div>
            <div class="page-actions"><button class="primary" data-action="sync-all">Sync pending records</button></div>
          </div>
          <div class="sync-summary">
            <div><strong>${counts("Saved offline")}</strong><span>Saved offline</span></div>
            <div><strong>${counts("Pending sync")}</strong><span>Pending sync</span></div>
            <div><strong>${counts("Syncing")}</strong><span>Syncing</span></div>
            <div><strong>${counts("Sync failed")}</strong><span>Sync failed</span></div>
            <div><strong>${counts("Conflict requires review")}</strong><span>Conflict requires review</span></div>
          </div>
          <div class="callout"><div><strong>Local save is healthy</strong><span>Results are written to this device before synchronisation. Closing this view will not discard pending work.</span></div></div>
          <div class="data-table-wrap"><table>
            <thead><tr><th>Participant record</th><th>Area</th><th>State</th><th>Last update</th><th>Safe action</th></tr></thead>
            <tbody>${state.sync.map(record => `<tr>
              <td><strong>${esc(record.participant)}</strong><small>${esc(record.code)}</small></td>
              <td>${esc(record.area)}</td>
              <td><span class="status ${syncStatusClass(record.status)}"><i></i>${esc(record.status)}</span></td>
              <td>${esc(record.updated)}</td>
              <td>${record.status === "Sync failed" ? `<button class="secondary small-button" data-action="retry-sync" data-id="${record.id}">Retry sync</button>` : record.status === "Conflict requires review" ? `<button class="secondary small-button" data-action="review-conflict" data-id="${record.id}">Review conflict</button>` : `<span style="color:var(--muted)">No action needed</span>`}</td>
            </tr>`).join("")}</tbody>
          </table></div>`;
      }

                <div class="field"><label for="event-form-status">Event status</label><select id="event-form-status" name="status">${["draft","upcoming","in_progress"].map(value => `<option value="${value}" ${item.status === value ? "selected" : ""}>${statusLabel(value)}</option>`).join("")}</select><small>A date is required before an event can become Upcoming or In progress.</small></div>

          <div class="modal-body">
            <div class="danger-summary"><strong>${esc(event.name)}</strong><span>${formatDate(event.date)} at ${esc(event.venue)}</span></div>

              </div>
              <div class="permission-preview" id="permission-preview"><strong>${esc(person.role)} allows:</strong> ${esc(roleExplanations[person.role])}</div>

          <form id="invite-form">
            <div class="modal-head"><div><h2>Invite staff</h2><p>The invite remains pending until approved.</p></div><button type="button" class="modal-close" data-close aria-label="Close">×</button></div>
            <div class="modal-body"><div class="form-grid">
              <div class="field"><label for="invite-name">Full name</label><input id="invite-name" name="name" required placeholder="e.g. Kavitha Raj"></div>
              <div class="field"><label for="invite-email">Work email</label><input id="invite-email" name="email" type="email" required placeholder="name@organisation.test"></div>
              <div class="field"><label for="invite-role">Role</label><select id="invite-role" name="role" data-role-field>${Object.keys(roleExplanations).map(role => `<option>${role}</option>`).join("")}</select></div>
              <div class="field"><label for="invite-station">Station</label><select id="invite-station" name="station">${["Registration","Visual acuity","Refraction","Colour vision","Eye health","Clinical review"].map(value => `<option>${value}</option>`).join("")}</select></div>
              <div class="field full"><label for="invite-event">Event</label><select id="invite-event" name="event">${state.events.map(event => `<option>${esc(event.name)}</option>`).join("")}</select></div>
            </div><div class="permission-preview" id="permission-preview"><strong>Event Manager allows:</strong> ${roleExplanations["Event Manager"]}</div></div>

        return `
          <form id="import-form">
            <div class="modal-head"><div><h2>Import staff</h2><p>Prototype import validates one fictional CSV row.</p></div><button type="button" class="modal-close" data-close aria-label="Close">×</button></div>
            <div class="modal-body">
              <div class="field"><label for="staff-file">Staff CSV file</label><input id="staff-file" type="file" accept=".csv" aria-describedby="import-help"><small id="import-help">Expected columns: name, email, role, event, station. Choose any CSV to simulate import.</small></div>
              <div class="callout"><div><strong>Preview</strong><span>Nur Aisyah Rahman / Screener / Tampines North / Colour vision / Pending approval</span></div></div>
            </div>
            <div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button type="submit" class="primary">Import 1 staff member</button></div>
          </form>`;
      }

      function refreshEventList() {
        const region = document.getElementById("event-list-region");
        if (region) region.innerHTML = renderEventRows();
      }

      function refreshPeopleList() {
        const region = document.getElementById("people-list-region");
        if (region) region.innerHTML = renderPeopleRows();
      }

      document.addEventListener("input", event => {
        if (event.target.id === "event-search") {
          state.eventQuery = event.target.value;
          refreshEventList();
        }
        if (event.target.id === "people-search") {
          state.peopleQuery = event.target.value;
          refreshPeopleList();
        }
      });

      document.addEventListener("change", event => {
        if (event.target.id === "event-status") { state.eventStatus = event.target.value; refreshEventList(); }
        if (event.target.id === "event-sort") { state.eventSort = event.target.value; refreshEventList(); }
        if (event.target.matches("[data-role-field]")) {
          const preview = document.getElementById("permission-preview");
          if (preview) preview.innerHTML = `<strong>${esc(event.target.value)} allows:</strong> ${esc(roleExplanations[event.target.value])}`;
        }
      });

      document.addEventListener("submit", event => {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);

        if (form.id === "event-form") {
          const status = data.get("status");
          const date = data.get("date");
          const error = document.getElementById("event-form-error");
          if (status !== "draft" && !date) {
            error.textContent = "Choose a date before changing this event from Draft.";
            document.getElementById("event-date").focus();
            return;
          }
          const stations = data.getAll("stations");
          if (!stations.length) {
            error.textContent = "Choose at least one screening station.";
            return;
          }
          const id = Number(form.dataset.id);
          const existing = state.events.find(item => item.id === id);
          const next = {
            id: id || Math.max(0, ...state.events.map(item => item.id)) + 1,
            name: data.get("name").trim(),
            date,
            time: data.get("time"),
            venue: data.get("venue").trim(),
            capacity: Number(data.get("capacity")),
            participants: existing?.participants || 0,
            status,
            stations,
            staff: Number(data.get("staff")),
            staffReady: Math.min(existing?.staffReady || Number(data.get("staff")), Number(data.get("staff"))),
            registration: data.get("registration"),
            warning: existing?.warning || ""
          };
          if (existing) Object.assign(existing, next); else state.events.unshift(next);
          closeModal();
          state.view = "events";
          render();
          showToast(existing ? "Event changes saved." : "Draft event created.");
        }

        if (form.id === "screening-form") {
          state.localSaved = true;
          state.screenSyncState = state.dryRun ? "Dry run save" : "Pending sync";
          render();
          showToast(state.dryRun ? "Dry run result saved locally only." : "Result saved locally. Sync queued.");
          if (!state.dryRun) {
            setTimeout(() => {
              if (state.view === "screening" && state.localSaved) {
                state.screenSyncState = "Synced";
                render();
              }
            }, 1500);
          }
        }

        if (form.id === "review-form") {
          const review = selectedReview();
          review.finalized = true;
          review.status = data.get("decision");
          review.notes = data.get("notes");
          review.followUp = data.get("followUp");
          state.reviewCompleted = true;
          render();
          showToast(state.dryRun ? "Dry run decision recorded outside live data." : "Reviewer decision finalised.");
        }

        if (form.id === "assignment-form") {
          const person = state.staff.find(item => item.id === Number(form.dataset.id));
          person.event = data.get("event");
          person.role = data.get("role");
          person.station = data.get("station");
          person.permissions = data.getAll("permission");
          closeModal();
          render();
          showToast(`Assignment updated for ${person.name}.`);
        }

        if (form.id === "invite-form") {
          state.staff.push({
            id: Math.max(...state.staff.map(item => item.id)) + 1,
            name: data.get("name").trim(),
            email: data.get("email").trim(),
            role: data.get("role"),
            event: data.get("event"),
            station: data.get("station"),
            status: "Pending",
            permissions: []
          });
          closeModal();
          render();
          showToast("Staff invitation added for approval.");
        }

        if (form.id === "import-form") {
          if (!state.staff.some(item => item.email === "nur.aisyah@vsms.test")) {
            state.staff.push({ id: Math.max(...state.staff.map(item => item.id)) + 1, name: "Nur Aisyah Rahman", email: "nur.aisyah@vsms.test", role: "Screener", event: "Tampines North Community Screening", station: "Colour vision", status: "Pending", permissions: ["Scan participant pass", "Record station results"] });
          }
          closeModal();
          render();
          showToast("1 staff member imported for approval.");
        }
      });

      document.addEventListener("click", event => {
        const target = event.target.closest("button");
        if (!target) return;

        if (target.hasAttribute("data-close")) {
          closeModal();
          return;
        }

        const nav = target.dataset.nav;
        if (nav) {
          if (nav === "live" && !selectedEvent()) state.selectedEventId = 1;
          state.view = nav;
          state.reviewCompleted = false;
          render();
          main.focus();
          return;
        }

        const action = target.dataset.action;
        const id = Number(target.dataset.id);
        if (!action) return;

        if (action === "refresh") {
          state.loading = true;
          render();
          setTimeout(() => { state.loading = false; render(); showToast("Current prototype data refreshed."); }, 650);
        }
        if (action === "reset") {
          openModal(`
            <div class="modal-head"><div><h2>Reset prototype?</h2><p>Restore the original fictional events, staff, review queue, and sync states.</p></div><button class="modal-close" data-close aria-label="Close">×</button></div>
            <div class="modal-body"><p>All temporary changes in this browser session will be removed. No backend data exists.</p></div>
            <div class="modal-actions"><button class="primary" data-close>Keep changes</button><button class="danger-button" data-action="confirm-reset">Reset prototype</button></div>`);
        }
        if (action === "confirm-reset") {
          state = makeState();
          drySnapshot = null;
          closeModal();
          render();
          showToast("Prototype reset to its original state.");
        }
        if (action === "create-event") openModal(eventForm(), true);
        if (action === "edit-event" || action === "open-event") {
          const item = state.events.find(event => event.id === id);
          if (item) openModal(eventForm(item), true);
        }
        if (action === "duplicate-event") {
          const source = state.events.find(event => event.id === id);
          const copy = {
            ...structuredClone(source),
            id: Math.max(...state.events.map(event => event.id)) + 1,
            name: `${source.name} Copy`,
            date: "",
            status: "draft",
            participants: 0,
            staffReady: 0,
            warning: "Choose a new date before this copy can become active."
          };
          state.events.unshift(copy);
          render();
          openModal(eventForm(copy, true), true);
          showToast("Draft copy created. Choose a new date to activate it.");
        }
        if (action === "delete-event") {
          const item = state.events.find(event => event.id === id);
          if (item) openDeleteModal(item);
        }
        if (action === "confirm-delete") {
          const item = state.events.find(event => event.id === id);
          state.events = state.events.filter(event => event.id !== id);
          closeModal();
          render();
          showToast(`${item?.name || "Event"} deleted from prototype state.`);
        }
        if (action === "clear-event-filters") {
          state.eventQuery = "";
          state.eventStatus = "all";
          state.eventSort = "date-asc";
          render();
        }
        if (action === "start-event") {
          const item = state.events.find(event => event.id === id);
          if (item && !item.date) {
            openModal(eventForm(item), true);
            showToast("Choose a date before starting this event.");
          } else if (item) {
            item.status = "in_progress";
            state.selectedEventId = item.id;
            state.view = "live";
            render();
            showToast(`${item.name} is now in progress.`);
          }
        }
        if (action === "open-live" || action === "open-summary") {
          state.selectedEventId = id || 1;
          state.view = "live";
          render();
        }
        if (action === "dry-run") {
          if (!state.dryRun) {
            drySnapshot = {
              events: structuredClone(state.events),
              staff: structuredClone(state.staff),
              reviews: structuredClone(state.reviews),
              sync: structuredClone(state.sync)
            };
          }
          state.selectedEventId = id || state.selectedEventId;
          state.dryRun = true;
          state.view = "live";
          state.screenPhase = "scan";
          state.localSaved = false;
          render();
          showToast("Dry run started. Live event data will not change.");
        }
        if (action === "exit-dry-run") {
          if (drySnapshot) {
            state.events = drySnapshot.events;
            state.staff = drySnapshot.staff;
            state.reviews = drySnapshot.reviews;
            state.sync = drySnapshot.sync;
            drySnapshot = null;
          }
          state.dryRun = false;
          state.view = "events";
          state.screenPhase = "scan";
          state.localSaved = false;
          render();
          showToast("Dry run ended. No live records were changed.");
        }
        if (action === "open-screening") {
          state.view = "screening";
          state.screenPhase = "scan";
          state.localSaved = false;
          render();
        }
        if (action === "simulate-scan") {
          state.scanned = true;
          state.screenPhase = "confirm";
          render();
          showToast("Participant pass recognised.");
        }
        if (action === "rescan") {
          state.screenPhase = "scan";
          state.scanned = false;
          state.localSaved = false;
          state.screenSyncState = "Not saved";
          render();
        }
        if (action === "confirm-participant") {
          state.screenPhase = "result";
          state.localSaved = false;
          state.screenSyncState = "Not saved";
          render();
        }
        if (action === "select-participant") {
          state.participantIndex = id;
          state.screenPhase = "confirm";
          state.scanned = true;
          state.localSaved = false;
          render();
        }
        if (action === "handoff" && state.localSaved) {
          state.screenPhase = "handoff";
          render();
        }
        if (action === "next-participant") {
          state.participantIndex = (state.participantIndex + 1) % participants.length;
          state.screenPhase = "scan";
          state.scanned = false;
          state.localSaved = false;
          state.screenSyncState = "Not saved";
          render();
          showToast("Ready for the next participant.");
        }
        if (action === "open-review") {
          state.selectedReviewId = id;
          state.reviewCompleted = false;
          state.view = "review";
          render();
        }
        if (action === "next-review") {
          const next = state.reviews.find(review => !review.finalized);
          if (next) state.selectedReviewId = next.id;
          state.reviewCompleted = false;
          render();
        }
        if (action === "invite-staff") openModal(inviteForm(), true);
        if (action === "import-staff") openModal(importForm());
        if (action === "assign-staff") {
          const person = state.staff.find(item => item.id === id);
          if (person) openModal(assignmentForm(person), true);
        }
        if (action === "approve-staff") {
          const person = state.staff.find(item => item.id === id);
          if (person) person.status = "Active";
          render();
          showToast(`${person?.name || "Staff member"} approved.`);
        }
        if (action === "reject-staff") {
          const person = state.staff.find(item => item.id === id);
          state.staff = state.staff.filter(item => item.id !== id);
          render();
          showToast(`${person?.name || "Pending staff member"} rejected.`);
        }
        if (action === "toggle-staff") {
          const person = state.staff.find(item => item.id === id);
          if (person) person.status = person.status === "Deactivated" ? "Active" : "Deactivated";
          render();
          showToast(`${person?.name || "Staff member"} access is now ${person?.status.toLowerCase()}.`);
        }
        if (action === "show-pending") {
          state.peopleQuery = "pending";
          const pending = state.staff.filter(person => person.status === "Pending");
          const region = document.getElementById("people-list-region");
          if (region) region.innerHTML = pending.length ? `<div class="data-table-wrap"><table><thead><tr><th>Staff member</th><th>Role</th><th>Event & station</th><th>Status</th><th>Actions</th></tr></thead><tbody>${pending.map(person => `<tr><td><strong>${esc(person.name)}</strong><small>${esc(person.email)}</small></td><td>${esc(person.role)}</td><td>${esc(person.event)}<small>${esc(person.station)}</small></td><td><span class="status warning"><i></i>Pending</span></td><td><div class="row-actions"><button class="link-action" data-action="approve-staff" data-id="${person.id}">Approve</button><button class="link-action destructive" data-action="reject-staff" data-id="${person.id}">Reject</button><button class="link-action" data-action="assign-staff" data-id="${person.id}">Change assignment</button></div></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty-state"><h2>No pending staff</h2><p>All invitations have been resolved.</p></div>`;
        }
        if (action === "clear-people-search") {
          state.peopleQuery = "";
          render();
        }
        if (action === "retry-sync") {
          const record = state.sync.find(item => item.id === id);
          if (record) {
            record.status = "Syncing";
            record.updated = "Now";
            render();
            showToast("Retrying saved record.");
            setTimeout(() => {
              record.status = "Synced";
              record.updated = "Now";
              render();
              showToast(`${record.participant} synced successfully.`);
            }, 1100);
          }
        }
        if (action === "sync-all") {
          const pending = state.sync.filter(item => ["Saved offline", "Pending sync", "Sync failed"].includes(item.status));
          pending.forEach(item => { item.status = "Syncing"; item.updated = "Now"; });
          render();
          showToast(`Syncing ${pending.length} saved records.`);
          setTimeout(() => {
            pending.forEach(item => item.status = "Synced");
            render();
            showToast("Pending records synced. Conflict still requires review.");
          }, 1300);
        }
        if (action === "review-conflict") {
          const record = state.sync.find(item => item.id === id);
          openModal(`
            <div class="modal-head"><div><h2>Review sync conflict</h2><p>${esc(record.participant)} / ${esc(record.code)}</p></div><button class="modal-close" data-close aria-label="Close">×</button></div>
            <div class="modal-body"><div class="callout warning"><div><strong>Two saved versions need authorised review</strong><span>The local result remains intact. Compare timestamps and screening context before choosing a version.</span></div></div><div class="result-row"><span>Local device</span><strong>10:31 / complete</strong></div><div class="result-row"><span>Server</span><strong>10:28 / incomplete</strong></div></div>
            <div class="modal-actions"><button class="secondary" data-close>Review later</button><button class="primary" data-action="resolve-conflict" data-id="${record.id}">Keep complete local version</button></div>`);
        }
        if (action === "resolve-conflict") {
          const record = state.sync.find(item => item.id === id);
          if (record) record.status = "Pending sync";
          closeModal();
          render();
          showToast("Conflict reviewed. Complete local version is pending sync.");
        }
        if (action === "report-ready") showToast("Report preview prepared from fictional prototype data.");
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && modalLayer.classList.contains("open")) closeModal();
      });

      render();
    })();
  </script>
</body>
</html>
