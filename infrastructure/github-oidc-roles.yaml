AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub OIDC roles for VSMS build, deployment, migration, and verification

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: Existing GitHub Actions OIDC provider ARN in this AWS account
  GitHubRepository:
    Type: String
    Default: soc-DBSP/react-nodejs-project2-cryptix
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
  EcrRepositoryArn:
    Type: String
  CloudFormationServiceRoleArn:
    Type: String
  StagingStackArn:
    Type: String
    Description: Stack ARN ending in /* so change-set operations remain scoped to this stack
  ProductionStackArn:
    Type: String
  StagingFrontendBucketArn:
    Type: String
  ProductionFrontendBucketArn:
    Type: String
  StagingDistributionArn:
    Type: String
  ProductionDistributionArn:
    Type: String
  StagingClusterArn:
    Type: String
  ProductionClusterArn:
    Type: String
  StagingMigrationTaskDefinitionArn:
    Type: String
    Description: Migration task-definition ARN ending in :* to permit new revisions of only this family
  ProductionMigrationTaskDefinitionArn:
    Type: String
  StagingMigrationExecutionRoleArn:
    Type: String
  StagingMigrationTaskRoleArn:
    Type: String
  ProductionMigrationExecutionRoleArn:
    Type: String
  ProductionMigrationTaskRoleArn:
    Type: String

Resources:
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vsms-github-build
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: PushVsmsImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImageScanFindings
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Ref EcrRepositoryArn

  StagingDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vsms-github-staging-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:staging
      Policies:
        - PolicyName: DeployStagingVsms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                Resource: !Ref StagingStackArn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Ref CloudFormationServiceRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Ref StagingFrontendBucketArn
                  - !Sub ${StagingFrontendBucketArn}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Ref StagingDistributionArn

  ProductionDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vsms-github-production-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:production
      Policies:
        - PolicyName: DeployProductionVsms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                Resource: !Ref ProductionStackArn
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Ref CloudFormationServiceRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Ref ProductionFrontendBucketArn
                  - !Sub ${ProductionFrontendBucketArn}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Ref ProductionDistributionArn

  StagingMigrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vsms-github-staging-migration
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:staging
      Policies:
        - PolicyName: LaunchStagingMigration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref StagingMigrationTaskDefinitionArn
                Condition:
                  ArnEquals:
                    ecs:cluster: !Ref StagingClusterArn
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Ref StagingClusterArn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref StagingMigrationExecutionRoleArn
                  - !Ref StagingMigrationTaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  ProductionMigrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vsms-github-production-migration
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:production
      Policies:
        - PolicyName: LaunchProductionMigration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ProductionMigrationTaskDefinitionArn
                Condition:
                  ArnEquals:
                    ecs:cluster: !Ref ProductionClusterArn
              - Effect: Allow
                Action: ecs:DescribeTasks
                Resource: "*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Ref ProductionClusterArn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref ProductionMigrationExecutionRoleArn
                  - !Ref ProductionMigrationTaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  StagingVerificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vsms-github-staging-verify
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:staging
      Policies:
        - PolicyName: VerifyStagingVsms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"

  ProductionVerificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vsms-github-production-verify
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:production
      Policies:
        - PolicyName: VerifyProductionVsms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                Resource: "*"

Outputs:
  BuildRoleArn:
    Value: !GetAtt BuildRole.Arn
  StagingDeploymentRoleArn:
    Value: !GetAtt StagingDeploymentRole.Arn
  ProductionDeploymentRoleArn:
    Value: !GetAtt ProductionDeploymentRole.Arn
  StagingMigrationRoleArn:
    Value: !GetAtt StagingMigrationRole.Arn
  ProductionMigrationRoleArn:
    Value: !GetAtt ProductionMigrationRole.Arn
  StagingVerificationRoleArn:
    Value: !GetAtt StagingVerificationRole.Arn
  ProductionVerificationRoleArn:
    Value: !GetAtt ProductionVerificationRole.Arn
